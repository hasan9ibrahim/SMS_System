# Load-test NATS (backend step 7) with NATS's default sync (to disk every 2 minutes): an acknowledged event is in the
# server's memory and file cache, not yet on disk. With 3 replicas (production) an ack means 2 of 3 servers hold it,
# which is how NATS recommends running JetStream; compared with always.conf to measure the cost of an fsync per event.
port: 4223
http_port: 8223
jetstream {
  store_dir: /data
}
