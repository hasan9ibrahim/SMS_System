# Shared trial instance: the built web app, with the API and the live WebSocket proxied to the mock.

# Content-Security-Policy reports need no sign-in, so each address may send a few a minute (§14).
limit_req_zone $binary_remote_addr zone=sms_csp_reports:1m rate=60r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # A location with its own add_header drops these (nginx inheritance), so each such location repeats them.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy same-origin always;
  # Content-Security-Policy, report-only (§14): the same policy as production (deploy/ansible/roles/web/defaults),
  # with ws: for this plain-HTTP instance on any port. Violations are logged by the mock (/api/v1/csp-reports).
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws://$host:* wss://$host:*; frame-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri /api/v1/csp-reports" always;

  # Imports and uploads (Migration Center, rate files) send up to 16 MB of JSON.
  client_max_body_size 32m;

  # Optional shared team password for every page, /api and /socket (TEAM_PASSWORD, deploy/team-auth.sh).
  include /etc/nginx/team-auth.conf;

  location /api/ {
    proxy_pass http://mock:4010;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_buffering off;
  }

  # Content-Security-Policy reports (§14): no sign-in, so small and few; the mock limits them too.
  location = /api/v1/csp-reports {
    limit_req zone=sms_csp_reports burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://mock:4010;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Phoenix-protocol WebSocket (live dashboard, analytics, alerts, hover volumes).
  location /socket {
    proxy_pass http://mock:4010;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  # Client-side routes (every page path, and tabs dragged out into their own window).
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws://$host:* wss://$host:*; frame-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri /api/v1/csp-reports" always;
  }
}
