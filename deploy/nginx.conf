# Shared trial instance: the built web app, with the API and the live WebSocket proxied to the mock.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Imports and uploads (Migration Center, rate files) send up to 16 MB of JSON.
  client_max_body_size 32m;

  location /api/ {
    proxy_pass http://mock:4010;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_buffering off;
  }

  # Phoenix-protocol WebSocket (live dashboard, analytics, alerts, hover volumes).
  location /socket {
    proxy_pass http://mock:4010;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routes (every page path, and tabs dragged out into their own window).
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
