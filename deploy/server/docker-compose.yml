# Trial server, images only (team trial): no source code on the server. GitHub Actions builds the images
# from main (.github/workflows/images.yml) into the private GitHub Container Registry; this file and a
# .env (see .env.example next to it) are all the server needs. Steps: deploy/server/README.md.
#
#   docker compose up -d                          databases, API server and web app
#   docker compose --profile seed run --rm seed   one-off: load the fake data (resets all data)
#   docker compose pull && docker compose up -d   update to the latest images from main
name: sms-platform

x-db-env: &db-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-sms_config}
  POSTGRES_USER: ${POSTGRES_USER:-sms_dev}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_HTTP_PORT: 8123
  CLICKHOUSE_DB: ${CLICKHOUSE_DB:-sms_edr}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-sms_dev}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  PLATFORM_CURRENCY: ${PLATFORM_CURRENCY:-EUR}
  PLATFORM_TIMEZONE: ${PLATFORM_TIMEZONE:-UTC}
  SIM_TOTAL_TPS: ${SIM_TOTAL_TPS:-40}
  MOCK_SECRET_KEY: ${MOCK_SECRET_KEY:?set MOCK_SECRET_KEY in .env}

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sms_config}
      POSTGRES_USER: ${POSTGRES_USER:-sms_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-sms_edr}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-sms_dev}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mock:
    image: ${IMAGE_REGISTRY:-ghcr.io/hasan9ibrahim}/sms-mock:${IMAGE_TAG:-main}
    restart: unless-stopped
    environment: *db-env
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4010/api/v1/health | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 30

  # The web app behind nginx; only this port is published, and only on the server itself by default:
  # Caddy (HTTPS, your domain) forwards to it. See README.md.
  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/hasan9ibrahim}/sms-web:${IMAGE_TAG:-main}
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:80"
    environment:
      TEAM_USER: ${TEAM_USER:-team}
      TEAM_PASSWORD: ${TEAM_PASSWORD:-}
    depends_on:
      mock: { condition: service_healthy }

  # One-off: load the fake data. Resets all data. SEED_PROFILE=full (production-like, ~10 min) or small.
  seed:
    profiles: ["seed"]
    image: ${IMAGE_REGISTRY:-ghcr.io/hasan9ibrahim}/sms-mock:${IMAGE_TAG:-main}
    environment: *db-env
    command: ["sh", "-c", "node --max-old-space-size=6144 seed.mjs --profile ${SEED_PROFILE:-full}"]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

volumes:
  postgres-data:
  clickhouse-data:
  redis-data:
