# Installs a release and rolls it out one machine at a time (backend steps 8 and 14, README.md "Deploying"): the
# switch and the API on every machine (the API only answers on the servers), then on each server the TypeScript service
# and the screens.
#
#   ./build-release.sh                                         builds releases/{sms,service,web}-<commit>.tar.gz
#   ansible-playbook deploy.yml -e release=<commit>            the lab
#   ansible-playbook -i inventories/production deploy.yml -e release=<commit> --ask-vault-pass
#
# Rollback: the same with the previous release's id (it is still on the machines; nothing is uploaded again).
# Migrations run first, from the first server, before any machine runs the new code: they must work with the old
# version too (spec §14.1).
- name: Upload the release to every machine
  hosts: all
  roles: [settings]
  vars:
    release_dir: "{{ switch_root }}/releases/{{ release }}"
  tasks:
    - name: A release id is given
      ansible.builtin.assert:
        that: release is defined
        fail_msg: "-e release=<id> (see build-release.sh)"
      run_once: true

    - name: Already on the machine?
      ansible.builtin.stat: {path: "{{ release_dir }}/bin/sms"}
      register: present

    - name: Folder
      ansible.builtin.file: {path: "{{ release_dir }}", state: directory, owner: "{{ switch_user }}", group: "{{ switch_user }}", mode: "0750"}
      when: not present.stat.exists

    - name: Unpack
      ansible.builtin.unarchive:
        src: "releases/sms-{{ release }}.tar.gz"
        dest: "{{ release_dir }}"
        owner: "{{ switch_user }}"
        group: "{{ switch_user }}"
      when: not present.stat.exists

- name: Upload the TypeScript service and the screens to the servers
  hosts: servers
  roles: [settings]
  tasks:
    - name: Already on the server?
      ansible.builtin.stat: {path: "{{ item.dir }}/{{ release }}/{{ item.check }}"}
      register: parts
      loop:
        - {name: service, dir: "{{ switch_root }}/service/releases", check: server.mjs}
        - {name: web, dir: "{{ switch_root }}/web/releases", check: index.html}

    - name: Folders
      ansible.builtin.file: {path: "{{ item.item.dir }}/{{ release }}", state: directory, owner: "{{ switch_user }}", group: "{{ switch_user }}", mode: "0755"}
      loop: "{{ parts.results }}"
      when: not item.stat.exists

    - name: Unpack
      ansible.builtin.unarchive:
        src: "releases/{{ item.item.name }}-{{ release }}.tar.gz"
        dest: "{{ item.item.dir }}/{{ release }}"
        owner: "{{ switch_user }}"
        group: "{{ switch_user }}"
      loop: "{{ parts.results }}"
      when: not item.stat.exists

- name: Migrate the databases (once, from the first server)
  hosts: "{{ groups['servers'][0] }}"
  roles: [settings]
  tasks:
    - name: Migrations
      ansible.builtin.shell: |
        set -a; . /etc/sms/switch.env; set +a
        {{ switch_root }}/releases/{{ release }}/bin/sms eval 'IO.inspect(Sms.Core.Release.migrate())'
      become: true
      become_user: "{{ switch_user }}"
      register: migrated
      changed_when: "'postgres: []' not in migrated.stdout"

    - name: Applied
      ansible.builtin.debug: {var: migrated.stdout_lines}

- name: Which machines run the switch now
  hosts: servers:witness
  roles: [settings]
  tasks:
    - name: Running?
      ansible.builtin.command: systemctl is-active sms-switch
      register: active
      changed_when: false
      failed_when: false

    - name: Remember
      ansible.builtin.set_fact: {switch_was_running: "{{ active.stdout == 'active' }}"}

- name: Roll out, one server at a time, then the witness
  hosts: servers:witness
  roles: [settings]
  serial: 1
  order: inventory
  vars:
    others_running: >-
      {{ (groups['servers'] + groups['witness']) | difference([inventory_hostname])
         | map('extract', hostvars, 'switch_was_running') | map('bool') | select | list }}
  tasks:
    - name: Current release
      ansible.builtin.stat: {path: "{{ switch_root }}/current"}
      register: before

    - name: Stop (customers and vendors unbound cleanly; the other server carries the traffic)
      ansible.builtin.systemd_service: {name: sms-switch, state: stopped}
      when: before.stat.exists

    - name: Point to the release
      ansible.builtin.file:
        src: "{{ switch_root }}/releases/{{ release }}"
        dest: "{{ switch_root }}/current"
        state: link
        force: true
        owner: "{{ switch_user }}"
        group: "{{ switch_user }}"

    - name: Start
      ansible.builtin.systemd_service: {name: sms-switch, state: started, daemon_reload: true}

    - name: Healthy (every store and the bus answer)
      ansible.builtin.uri: {url: "http://127.0.0.1:{{ ports.switch_health | default(ports.switch_http) }}/health"}
      register: health
      retries: 60
      delay: 2
      until: health.status == 200

    # On a first install the other machines are not running the switch yet, so only the configuration is awaited.
    - name: Joined the cluster (when another machine runs it) and, on a server, has its routing configuration
      ansible.builtin.uri: {url: "http://127.0.0.1:{{ ports.switch_http }}/metrics", return_content: true}
      register: metrics
      retries: 60
      delay: 2
      until: >-
        metrics.status == 200
        and (others_running | length == 0 or metrics.content is search('sms_cluster_peers_connected [1-9]'))
        and (inventory_hostname in groups['witness'] or 'sms_config_loaded 1' in metrics.content)

- name: The TypeScript service and the screens, one server at a time
  hosts: servers
  roles: [settings]
  serial: 1
  order: inventory
  tasks:
    - name: Point the service to the release
      ansible.builtin.file:
        src: "{{ switch_root }}/service/releases/{{ release }}"
        dest: "{{ switch_root }}/service/current"
        state: link
        force: true
        owner: "{{ switch_user }}"
        group: "{{ switch_user }}"

    - name: Restart the service
      ansible.builtin.systemd_service: {name: sms-service, state: restarted, daemon_reload: true}

    - name: Healthy (answers)
      ansible.builtin.uri: {url: "http://127.0.0.1:{{ service_port }}/api/v1/health", return_content: true}
      register: service_health
      retries: 60
      delay: 2
      until: service_health.status == 200

    - name: Point the screens to the release (nginx serves the new files at once)
      ansible.builtin.file:
        src: "{{ switch_root }}/web/releases/{{ release }}"
        dest: "{{ switch_root }}/web/current"
        state: link
        force: true
        owner: "{{ switch_user }}"
        group: "{{ switch_user }}"

    - name: The screens answer through nginx and the API
      ansible.builtin.uri:
        url: "https://127.0.0.1/api/v1/health"
        headers: {Host: "{{ web_domain }}"}
        validate_certs: false
      register: web_health
      retries: 30
      delay: 2
      until: web_health.status == 200

- name: Keep the last five releases
  hosts: all
  roles: [settings]
  tasks:
    - name: Release folders
      ansible.builtin.set_fact:
        release_roots: >-
          {{ [switch_root ~ '/releases'] + ([switch_root ~ '/service/releases', switch_root ~ '/web/releases']
             if inventory_hostname in groups['servers'] else []) }}

    - name: Releases, oldest first
      ansible.builtin.shell: ls -1tr {{ item }}
      register: releases
      changed_when: false
      loop: "{{ release_roots }}"

    - name: Remove older ones (never the current one)
      ansible.builtin.file: {path: "{{ item.0.item }}/{{ item.1 }}", state: absent}
      loop: "{{ releases.results | subelements('stdout_lines') }}"
      loop_control: {label: "{{ item.0.item }}/{{ item.1 }}"}
      when: item.1 in (item.0.stdout_lines[:-5] | reject('equalto', release) | list)
