# The rehearsal lab (deploy/lab): three containers standing in for the two servers and the witness VM.
all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: "{{ inventory_dir }}/../../../lab/.ssh/id_ed25519"
  children:
    servers:
      hosts:
        srv-a: {ansible_host: 10.88.0.11, private_ip: 10.88.0.11, node_id: 1}
        srv-b: {ansible_host: 10.88.0.12, private_ip: 10.88.0.12, node_id: 2}
    witness:
      hosts:
        witness: {ansible_host: 10.88.0.13, private_ip: 10.88.0.13}
