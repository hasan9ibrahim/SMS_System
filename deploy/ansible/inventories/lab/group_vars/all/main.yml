# Lab only: containers cannot set the clock or kernel settings, and the hosts' docker network is the admin network.
lab: true
admin_cidrs: [10.88.0.0/24]
# Off-site backups go to the lab's S3 stand-in (self-signed certificate).
s3_endpoint: 10.88.0.20
s3_port: 9000
s3_region: us-east-1
s3_bucket: sms-backups
s3_verify_tls: false
# No real Telegram in the lab: alerts are kept in Alertmanager only.
telegram_chat_ids: []
# Lab disk is small: a day of recorded traffic here, a day off-site.
pcap_local_days: 1
pcap_offsite_days: 1
# The screens: the lab's own name (add it to the hosts file of the machine you browse from) and a self-signed
# certificate made by roles/web. Platform e-mail goes to a mail catcher on the lab host (deploy/lab/smtp-sink.py).
web_domain: sms.lab.test
smtp_from: platform@sms.lab.test
# SMS to voice on both servers (roles/asterisk). No real voice switch: any SIP test tool on the lab network (e.g. on
# the lab host, 10.88.0.1) stands in for it, as a voice gateway set on the Voice gateways page.
sms_voice_enabled: true
voice_switch_cidrs: [10.88.0.0/24]
