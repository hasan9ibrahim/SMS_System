vault_pg_app_password: lab-only-pg-app
vault_redis_password: lab-only-redis
vault_nats_password: lab-only-nats
vault_clickhouse_password: lab-only-ch
vault_s3_access_key: labbackup
vault_s3_secret_key: lab-only-s3-secret
