# FAKE lab-only secrets (CLAUDE.md rule 1). Production keeps its own in an ansible-vault encrypted file
# (inventories/production.example/group_vars/all/secrets.example.yml).
vault_release_cookie: lab-only-cookie-0f3c9a
vault_pg_superuser_password: lab-only-pg-super
