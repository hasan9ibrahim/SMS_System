vault_smtp_url: smtp://lab:lab-only-smtp@10.88.0.1:2525?secure=none
# SMS to voice: the switch's login to the local Asterisk manager interface (AMI, 127.0.0.1).
vault_asterisk_ami_secret: lab-only-asterisk-ami-4c7e
