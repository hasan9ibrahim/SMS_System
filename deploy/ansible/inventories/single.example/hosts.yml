# One server alone (copy this folder to inventories/production and fill it in): every part of the platform runs on
# this machine, each stored once. A second server and the witness VM are added later without code changes
# (docs/DEPLOY_SINGLE_SERVER.md, "Growing to two servers and the witness"). ansible_host is the server's public IP, the
# one the deploy machine reaches it on. private_ip is its address on the provider's private network (OVH vRack): set
# it up now, as the second server will reach this one there. Without a private network yet, put the public IP: the
# firewall keeps these ports closed to everyone else.
all:
  vars:
    ansible_user: root
  children:
    servers:
      hosts:
        srv-a: {ansible_host: 203.0.113.11, private_ip: 10.0.0.11, node_id: 1}
    # No witness yet; it comes with the second server.
    witness:
      hosts: {}
