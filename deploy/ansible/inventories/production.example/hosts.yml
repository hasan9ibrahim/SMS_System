# Production (copy this folder to inventories/production and fill it in). Two dedicated servers in two data centres of
# the same provider, and the witness VM at another provider (Q32). private_ip is the address the three machines use to
# reach each other (a private network or VPN between them); ansible_host is how the deploy machine reaches each.
all:
  vars:
    ansible_user: root
  children:
    servers:
      hosts:
        srv-a: {ansible_host: 203.0.113.11, private_ip: 10.0.0.11, node_id: 1}
        srv-b: {ansible_host: 203.0.113.12, private_ip: 10.0.0.12, node_id: 2}
    witness:
      hosts:
        witness: {ansible_host: 198.51.100.13, private_ip: 10.0.0.13}
