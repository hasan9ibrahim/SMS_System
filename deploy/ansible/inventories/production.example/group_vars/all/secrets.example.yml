# Copy to secrets.yml, fill in (openssl rand -hex 24 for each), then: ansible-vault encrypt secrets.yml
vault_release_cookie: CHANGE_ME
vault_pg_superuser_password: CHANGE_ME
vault_pg_replication_password: CHANGE_ME
vault_pg_app_password: CHANGE_ME
vault_redis_password: CHANGE_ME
vault_nats_password: CHANGE_ME
vault_clickhouse_password: CHANGE_ME
vault_s3_access_key: CHANGE_ME
vault_s3_secret_key: CHANGE_ME
# Encrypts the database backups at rest in the bucket; keep a copy outside the servers, or the backups are useless.
vault_pgbackrest_cipher_pass: CHANGE_ME
vault_grafana_admin_password: CHANGE_ME
# From @BotFather; the bot must be a member of each chat in telegram_chat_ids.
vault_telegram_bot_token: CHANGE_ME
# The API (backend step 9): the secret shared with the mock server, and Phoenix's key base (64+ characters).
vault_mock_proxy_secret: CHANGE_ME
vault_secret_key_base: CHANGE_ME_64_CHARACTERS_OR_MORE
# Encrypts stored trunk and mailbox passwords and authenticator secrets (TypeScript service and API alike).
vault_mock_secret_key: CHANGE_ME_32_CHARACTERS_OR_MORE
