# The switch's service and settings on every machine (backend step 8): the two servers run it with traffic, the
# witness runs the same release as SWITCH_ROLE=witness (no data store, no SMPP) to break ties between the servers
# (Sms.Switch.Vendor.Quorum). The release itself is installed by deploy.yml.
- name: sms user
  ansible.builtin.user: {name: "{{ switch_user }}", system: true, shell: /usr/sbin/nologin, home: "{{ switch_root }}", create_home: false}

- name: Folders
  ansible.builtin.file: {path: "{{ item }}", state: directory, owner: "{{ switch_user }}", group: "{{ switch_user }}", mode: "0750"}
  loop: ["{{ switch_root }}", "{{ switch_root }}/releases", /var/log/sms]

- name: Settings folder
  ansible.builtin.file: {path: /etc/sms, state: directory, owner: root, group: "{{ switch_user }}", mode: "0750"}

- name: Settings (secrets included; read by the service only)
  ansible.builtin.template: {src: switch.env.j2, dest: /etc/sms/switch.env, owner: root, group: "{{ switch_user }}", mode: "0640"}
  notify: switch restart

- name: Service
  ansible.builtin.template: {src: sms-switch.service.j2, dest: /etc/systemd/system/sms-switch.service, mode: "0644"}
  notify: switch restart

- name: Whether a release is installed yet
  ansible.builtin.stat: {path: "{{ switch_root }}/current/bin/sms"}
  register: current

- name: Enabled (started by deploy.yml once a release is installed)
  ansible.builtin.systemd_service: {name: sms-switch, enabled: true, daemon_reload: true}
