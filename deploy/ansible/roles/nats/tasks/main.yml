# NATS JetStream on the three machines: the event bus (BACKEND_PLAN §3). Every event is held by all three (stream
# replicas 3, set by the switch in production), so any one machine can be lost without losing an event; writes need
# 2 of 3, so a server cut off from both others stops accepting messages instead of diverging.
- name: nats user
  ansible.builtin.user: {name: nats, system: true, shell: /usr/sbin/nologin, home: /var/lib/nats, create_home: true}

- name: Installed version
  ansible.builtin.command: /usr/local/bin/nats-server --version
  register: installed
  changed_when: false
  failed_when: false

- name: nats-server {{ nats_version }}
  when: installed.rc != 0 or nats_version not in installed.stdout
  block:
    - name: Download
      ansible.builtin.unarchive:
        src: "https://github.com/nats-io/nats-server/releases/download/v{{ nats_version }}/nats-server-v{{ nats_version }}-linux-amd64.tar.gz"
        dest: /tmp
        remote_src: true
    - name: Install
      ansible.builtin.copy:
        src: "/tmp/nats-server-v{{ nats_version }}-linux-amd64/nats-server"
        dest: /usr/local/bin/nats-server
        mode: "0755"
        remote_src: true
      notify: nats restart

- name: Settings
  ansible.builtin.file: {path: /etc/nats, state: directory, owner: nats, group: nats, mode: "0750"}

- name: nats.conf
  ansible.builtin.template: {src: nats.conf.j2, dest: /etc/nats/nats.conf, owner: nats, group: nats, mode: "0640"}
  notify: nats reload

- name: Service
  ansible.builtin.template: {src: nats.service.j2, dest: /etc/systemd/system/nats.service, mode: "0644"}
  notify: nats restart

- name: Running
  ansible.builtin.systemd_service: {name: nats, enabled: true, state: started, daemon_reload: true}

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: JetStream cluster has a leader
  ansible.builtin.uri: {url: "http://127.0.0.1:{{ ports.nats_monitor }}/healthz?js-enabled-only=true", status_code: 200}
  register: healthz
  retries: 30
  delay: 2
  until: healthz.status == 200

- name: natscli (operations, and the leader check on the witness)
  ansible.builtin.unarchive:
    src: "https://github.com/nats-io/natscli/releases/download/v{{ natscli_version }}/nats-{{ natscli_version }}-linux-amd64.zip"
    dest: /tmp
    remote_src: true
    creates: "/tmp/nats-{{ natscli_version }}-linux-amd64/nats"

- name: natscli installed
  ansible.builtin.copy:
    src: "/tmp/nats-{{ natscli_version }}-linux-amd64/nats"
    dest: /usr/local/bin/nats
    mode: "0755"
    remote_src: true

# After a failure the raft groups may elect the witness as leader; every message would then cross to the witness's
# provider and back. Once a minute the witness hands any leadership it holds to one of the servers.
- name: Leader check (witness)
  when: inventory_hostname in groups['witness']
  block:
    - name: Script
      ansible.builtin.template: {src: nats-leaders.sh.j2, dest: /usr/local/bin/sms-nats-leaders, mode: "0750"}
    - name: Units
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        content: "{{ item.content }}"
      loop:
        - name: sms-nats-leaders.service
          content: "[Unit]\nDescription=Hand NATS leaderships held by the witness to a server\n[Service]\nType=oneshot\nExecStart=/usr/local/bin/sms-nats-leaders\n"
        - name: sms-nats-leaders.timer
          content: "[Unit]\nDescription=NATS leader check every minute\n[Timer]\nOnBootSec=2min\nOnUnitActiveSec=60\n[Install]\nWantedBy=timers.target\n"
    - name: Timer on
      ansible.builtin.systemd_service: {name: sms-nats-leaders.timer, enabled: true, state: started, daemon_reload: true}
