- name: node_exporter restart
  ansible.builtin.systemd_service: {name: prometheus-node-exporter, state: restarted}
- name: postgres_exporter restart
  ansible.builtin.systemd_service: {name: prometheus-postgres-exporter, state: restarted, daemon_reload: true}
- name: redis_exporter restart
  ansible.builtin.systemd_service: {name: prometheus-redis-exporter, state: restarted}
- name: prometheus reload
  ansible.builtin.systemd_service: {name: prometheus, state: reloaded}
- name: prometheus restart
  ansible.builtin.systemd_service: {name: prometheus, state: restarted}
- name: alertmanager restart
  ansible.builtin.systemd_service: {name: prometheus-alertmanager, state: restarted}
- name: grafana restart
  ansible.builtin.systemd_service: {name: grafana-server, state: restarted}
