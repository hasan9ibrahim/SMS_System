# Recorded SMPP traffic for 60 days (spec §9.2; plan §3.4): dumpcap writes 15-minute files in a ring outside the
# switch, so recording never slows the message path. The PCAP screens' extract job reads these files (phase B).
- name: dumpcap
  ansible.builtin.apt: {name: wireshark-common, update_cache: true, cache_valid_time: 3600}
  environment: {DEBIAN_FRONTEND: noninteractive}

- name: Folder
  ansible.builtin.file: {path: "{{ pcap_dir }}", state: directory, owner: root, group: root, mode: "0750"}

- name: Service
  ansible.builtin.template: {src: sms-pcap.service.j2, dest: /etc/systemd/system/sms-pcap.service, mode: "0644"}
  register: unit

- name: Running
  ansible.builtin.systemd_service: {name: sms-pcap, enabled: true, state: "{{ 'restarted' if unit.changed else 'started' }}", daemon_reload: true}
