# The screens (backend step 14): nginx on each server serves the built web app over HTTPS and sends /api to the
# API (apps/sms_api) and the live WebSocket to the TypeScript service. Both servers answer the same name; DNS (or the
# provider's failover address) points web_domain at them (docs/GO_LIVE.md).
web_root: "{{ switch_root }}/web"
# Certificate and key for web_domain (full chain), placed by the team or a certbot hook; the inventory may override.
web_tls_certfile: /etc/sms/tls/web.crt
web_tls_keyfile: /etc/sms/tls/web.key
# Or a free Let's Encrypt certificate for web_domain, renewed by itself (docs/DEPLOY_SINGLE_SERVER.md): needs DNS
# already pointing web_domain at the server and port 80 open to everyone (web_cidrs). The key is readable by the switch
# too, so smpp_tls_certfile / smpp_tls_keyfile may point at the same files.
web_letsencrypt: false
letsencrypt_email: ""
