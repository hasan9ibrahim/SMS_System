# The screens (backend step 14): nginx on each server serves the built web app over HTTPS and sends /api to the
# API (apps/sms_api) and the live WebSocket to the TypeScript service. Both servers answer the same name; DNS (or the
# provider's failover address) points web_domain at them (docs/GO_LIVE.md).
web_root: "{{ switch_root }}/web"
# Certificate and key for web_domain (full chain), placed by the team or a certbot hook; the inventory may override.
web_tls_certfile: /etc/sms/tls/web.crt
web_tls_keyfile: /etc/sms/tls/web.key
# Or a free Let's Encrypt certificate for web_domain, renewed by itself (docs/DEPLOY_SINGLE_SERVER.md): needs DNS
# already pointing web_domain at the server and port 80 open to everyone (web_cidrs). The key is readable by the switch
# too, so smpp_tls_certfile / smpp_tls_keyfile may point at the same files.
web_letsencrypt: false
letsencrypt_email: ""
# Content-Security-Policy (§14; deploy/ansible/README.md "Content-Security-Policy"). Sent report-only first: the
# browser only reports what the policy would block, to /api/v1/csp-reports (one line each in the service log). Set
# web_csp_enforce: true to send the same policy as Content-Security-Policy, which blocks. $host is nginx's (the name
# the browser used). style-src needs 'unsafe-inline' for the e-mail previews and designer (sandboxed srcdoc frames
# take this policy and e-mails are styled inline); the screens themselves set styles only through the DOM.
web_csp_enforce: false
web_csp_policy: >-
  default-src 'self';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob:;
  font-src 'self';
  connect-src 'self' wss://$host;
  frame-src 'none';
  frame-ancestors 'self';
  base-uri 'self';
  form-action 'self';
  object-src 'none';
  report-uri /api/v1/csp-reports;
  report-to csp-endpoint
