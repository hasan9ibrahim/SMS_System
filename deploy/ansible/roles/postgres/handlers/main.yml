- name: patroni reload
  ansible.builtin.systemd_service: {name: sms-patroni, state: reloaded}
  failed_when: false
- name: patroni restart
  ansible.builtin.systemd_service: {name: sms-patroni, state: restarted, daemon_reload: true}
- name: haproxy reload
  ansible.builtin.systemd_service: {name: haproxy, state: reloaded}
