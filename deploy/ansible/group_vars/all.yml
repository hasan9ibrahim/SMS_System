# Settings shared by every environment (backend step 8). The inventory's group_vars hold what differs (addresses,
# storage, alert targets) and the secrets.

# --- the machines
# Either the full cluster (two servers and the witness VM) or one server alone (inventories/single.example): the same
# roles, with the parts that need three machines (the NATS cluster, three copies of each event, the witness quorum,
# the standby alerts) left out. A second server and the witness are added later (docs/DEPLOY_SINGLE_SERVER.md).
witness_hosts: "{{ groups.get('witness', []) }}"
cluster_hosts: "{{ groups['servers'] + witness_hosts }}"
server_hosts: "{{ groups['servers'] }}"
single_server: "{{ cluster_hosts | length == 1 }}"
witness_host: "{{ witness_hosts[0] if witness_hosts else none }}"
cluster_ips: "{{ cluster_hosts | map('extract', hostvars, 'private_ip') | list }}"
server_ips: "{{ server_hosts | map('extract', hostvars, 'private_ip') | list }}"
witness_ip: "{{ hostvars[witness_host].private_ip if witness_hosts else none }}"
# Prometheus, Alertmanager and Grafana: on the witness (it survives either server failing), else on the one server.
monitoring_host: "{{ witness_hosts[0] if witness_hosts else groups['servers'][0] }}"
monitoring_ip: "{{ hostvars[monitoring_host].private_ip }}"
# Copies of each event on the bus (NATS JetStream): three across the cluster, one on a single server.
nats_replicas: "{{ 1 if single_server else 3 }}"
# Off-site storage (the S3 bucket: backups, EDRs after edr_hot_months, recordings after pcap_local_days). Until
# vault_s3_access_key is filled in, everything stays on the server: no off-site backups (PostgreSQL archives nothing,
# the backup and restore-test timers are off, their alerts too), EDRs and recordings are kept here only. Filling it in
# and running the setup again turns it all on (docs/DEPLOY_SINGLE_SERVER.md, step 6).
s3_enabled: "{{ (vault_s3_access_key | default('') | string | length) > 0 }}"
smpp_cidrs: [0.0.0.0/0]

# --- versions (pinned; upgraded on purpose, one at a time)
pg_version: 16
clickhouse_version: 24.8.14.39
nats_version: 2.14.8
natscli_version: 0.2.4
nats_exporter_version: 0.17.3

# --- ports
ports:
  pg: 5433              # PostgreSQL itself (Patroni)
  pg_primary: 5432      # HAProxy on each server: always the current primary
  patroni: 8008
  etcd_client: 2379
  etcd_peer: 2380
  redis: 6379
  sentinel: 26379
  nats: 4222
  nats_cluster: 6222
  nats_monitor: 8222
  ch_http: 8123
  ch_native: 9000
  ch_interserver: 9009
  ch_metrics: 9363
  keeper: 9181
  keeper_raft: 9234
  epmd: 4369
  erlang_dist: 9150
  switch_http: 9568
  api: 4100
  smpp: [2775]
  smpp_tls: [2776]
  node_exporter: 9100
  pg_exporter: 9187
  redis_exporter: 9121
  nats_exporter: 7777
  prometheus: 9090
  alertmanager: 9093
  grafana: 3000

# --- application
pg_database: sms_config
pg_app_user: sms
ch_database: sms_edr
ch_app_user: sms
# Retention (product owner 2026-10-27, docs/BACKEND_PLAN.md §3.7): detailed EDRs on the servers for edr_hot_months,
# then on the off-site bucket (ClickHouse tiered storage, roles/clickhouse) until edr_keep_months; the report totals
# are kept for ever. PCAP files on the servers for pcap_local_days, then off-site for pcap_offsite_days (roles/pcap).
edr_hot_months: 6
edr_keep_months: 12
pcap_local_days: 60
pcap_offsite_days: 60
redis_sentinel_group: sms
switch_user: sms
switch_root: /opt/sms
platform_currency: EUR

# The API (backend step 9, apps/sms_api): sign-in and the ported operations; every other call goes to the TypeScript
# service at mock_url on the same server. nginx (roles/web) sends /api to it on port ports.api (backend step 14).
api_enabled: true
mock_url: "http://127.0.0.1:{{ service_port }}"

# The TypeScript service (roles/service, backend step 14): only the API and nginx on the same server reach it.
service_port: 4010
# Times in reports, invoices and the daily jobs (PLATFORM_TIMEZONE, mock/src/platform.ts).
platform_timezone: UTC

# The screens over HTTPS (roles/web): nginx on both servers answers web_domain (set in the inventory, with the
# certificate paths web_tls_certfile / web_tls_keyfile when not the defaults).
web_enabled: true
# Who may open the screens: everyone by default, as customers use the portal (staff sign-in has a password and a code).
web_cidrs: [0.0.0.0/0]

# Platform e-mail: sign-in and password codes, alerts, reminders. The address the team's mail system accepts mail from;
# the server and its login are vault_smtp_url (smtp://user:password@host:587 or smtps://...:465).
smtp_from_name: Xpert
