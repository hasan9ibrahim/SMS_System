# NATS for the event bus (docs/BACKEND_PLAN.md). Development: one node. Production runs three (the 2 servers + the
# witness VM) as a JetStream cluster with replicas: 3; that config is added with the servers (build step 8).
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
  # Write every message to disk before acknowledging it: an acknowledged event survives a power cut.
  sync_interval: always
}
