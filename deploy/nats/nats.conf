# NATS for the event bus (docs/BACKEND_PLAN.md). Development: one node. Production runs three (the 2 servers + the
# witness VM) as a JetStream cluster with replicas: 3 (deploy/ansible/roles/nats, build step 8).
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
  # NATS default: written to disk every 2 minutes. Each event is held by more than one server (replicas), so one
  # server crashing loses nothing; the load test showed writing every event first halves capacity (product owner
  # 2026-10-25, backend step 7). Only a power cut of every server at once could lose the last 2 minutes.
}
