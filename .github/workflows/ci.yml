name: CI

# Once per change (team trial round 2): pull requests and main. A pushed branch is checked by its pull request,
# not a second time on the push; a newer push cancels the older run on the same branch or pull request.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Seeded PostgreSQL for the mock server's database-backed tests (values as in .env.example).
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: sms_config
          POSTGRES_USER: sms_dev
          POSTGRES_PASSWORD: sms_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sms_dev -d sms_config"
          --health-interval 5s
          --health-retries 20
      # EDR store: the tests check reports, alerts and invoices against the generated traffic.
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        env:
          CLICKHOUSE_DB: sms_edr
          CLICKHOUSE_USER: sms_dev
          CLICKHOUSE_PASSWORD: sms_dev_password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports: ["8123:8123"]
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint contract
        run: npm run lint:contract
      - name: Generated types match the contract
        run: npm run gen:check
      - run: npm run typecheck
      # The tests are written against the production-like set (30 days of EDRs), as on the trial server.
      - name: Seed fake data (full profile, with EDRs)
        run: npm run seed:full
      - run: npm test
      - run: npm run build
      - name: Server bundle (image build, deploy/Dockerfile.mock)
        run: npm run bundle -w mock
      - name: docker-compose file is valid
        run: docker compose config -q

  # The Elixir backend (backend/, docs/BACKEND_PLAN.md): format, unused deps, advisories, warnings as errors, Credo
  # strict, Dialyzer, and every test including the integration ones against real stores and NATS (90 % coverage).
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      MIX_ENV: test
      INTEGRATION: "1"
      POSTGRES_HOST: localhost
      POSTGRES_DB: sms_config
      POSTGRES_USER: sms_dev
      POSTGRES_PASSWORD: sms_dev_password
      CLICKHOUSE_DB: sms_edr
      CLICKHOUSE_USER: sms_dev
      CLICKHOUSE_PASSWORD: sms_dev_password
      NATS_HOSTS: localhost:4222
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: sms_config
          POSTGRES_USER: sms_dev
          POSTGRES_PASSWORD: sms_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sms_dev -d sms_config"
          --health-interval 5s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        env:
          CLICKHOUSE_DB: sms_edr
          CLICKHOUSE_USER: sms_dev
          CLICKHOUSE_PASSWORD: sms_dev_password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports: ["8123:8123"]
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      # NATS with JetStream and the repo's config (a service container cannot take a config file).
      - name: Start NATS JetStream
        working-directory: .
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 \
            -v "$PWD/deploy/nats/nats.conf:/etc/nats/nats.conf:ro" nats:2.14.8-alpine -c /etc/nats/nats.conf
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8222/healthz && exit 0; sleep 1; done; exit 1
      # The configuration schema the switch reads (customer trunks), from the same migrations the mock uses.
      - name: Apply the PostgreSQL schema
        working-directory: .
        env:
          PGHOST: localhost
          PGUSER: sms_dev
          PGPASSWORD: sms_dev_password
          PGDATABASE: sms_config
        run: |
          for f in db/postgres/init/*.sql db/postgres/migrations/*.sql; do
            psql -q -v ON_ERROR_STOP=1 -f "$f" > /dev/null
          done
      - uses: erlef/setup-beam@v1
        with:
          version-file: backend/.tool-versions
          version-type: strict
      - uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
            backend/priv/plts
          key: backend-${{ runner.os }}-${{ hashFiles('backend/.tool-versions', 'backend/mix.lock') }}
          restore-keys: backend-${{ runner.os }}-
      - run: mix deps.get
      - run: mix check
