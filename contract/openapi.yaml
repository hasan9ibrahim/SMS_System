          type: object
          required: [id, name, enterprise]
          properties:
            id:
              $ref: "#/components/schemas/Id"
            name:
              type: string
            enterprise:
              type: string
        translation:
          $ref: "#/components/schemas/TrunkRulesTestResult"
        sender:
          type: string
          description: After translation.
        receiver:
          type: string
          description: After translation.
        mccmnc:
          type: [string, "null"]
        destination:
          type: [string, "null"]
        encoding:
          $ref: "#/components/schemas/MessageEncoding"
        customerRate:
          oneOf:
            - type: object
              required: [rate, currency, platformRate, rateTableId, rateTable]
              properties:
                rate:
                  type: number
                currency:
                  type: string
                platformRate:
                  type: number
                  description: The rate in the platform currency.
                rateTableId:
                  $ref: "#/components/schemas/Id"
                rateTable:
                  type: string
            - type: "null"
        route:
          $ref: "#/components/schemas/RouteSimulation"
        vendorCost:
          oneOf:
            - type: object
              required: [rate, currency]
              properties:
                rate:
                  type: number
                currency:
                  type: string
                  description: The platform currency.
            - type: "null"
          description: Buy rate of the chosen vendor for the destination.
        marginPct:
          type: [number, "null"]
          description: (sell − cost) / sell per message, both in the platform currency.
        blocked:
          type: [string, "null"]
          description: Why the message would be rejected, if it would.
        testSms:
          oneOf:
            - type: object
              required: [messageId, status, detail]
              properties:
                messageId:
                  type: string
                status:
                  type: string
                  enum: [DELIVRD, UNDELIV, REJECTD, EXPIRED]
                detail:
                  type: string
            - type: "null"

