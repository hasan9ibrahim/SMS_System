          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        receiverConversion:
          type: [string, "null"]
          enum: [left_strip, right_strip, prepend, append, translation, regex_replace, null]
        receiverConversionValue:
          type: [string, "null"]
          maxLength: 200
        receiverConversionReplacement:
          type: [string, "null"]
          maxLength: 100
          description: regex_replace only - the text each match becomes ($1..$9 insert groups).
        senderTon:
          type: [integer, "null"]
          minimum: 0
          maximum: 6
        senderNpi:
          type: [integer, "null"]
          minimum: 0
          maximum: 18
        destTon:
