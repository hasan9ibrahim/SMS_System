      properties:
        record:
          $ref: "#/components/schemas/ReratingDetail"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    ReratingRequestPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/ReratingRequestFields"

    QbrStat:
      type: object
      required: [id, side, trunkId, trunk, enterpriseId, enterprise, destinationId, mccmnc, country, network, attempts, asr, dlr, addSeconds, trafficAsr, trafficDlr, trafficAddSeconds, overridden, updatedAt, updatedBy]
      properties:
        id:
