        liveLookups:
          type: integer
        cachedLookups:
          type: integer
        successPct:
          type: [number, "null"]
        avgResponseMs:
          type: [integer, "null"]
        cost:
          type: number
          description: Platform currency.
        ported:
          type: integer

    HlrProviderDetail:
      allOf:
        - $ref: "#/components/schemas/HlrProviderFields"
        - type: object
          required: [id, passwordSet, stats, rules, policies, updatedBy, updatedAt, archivedAt]
          properties:
            id:
              $ref: "#/components/schemas/Id"
            passwordSet:
              type: boolean
              description: The password is never returned (§13.22).
            stats:
              $ref: "#/components/schemas/HlrProviderStats"
            rules:
              type: integer
            policies:
              type: integer
            updatedBy:
              type: [string, "null"]
            updatedAt:
              $ref: "#/components/schemas/Timestamp"
            archivedAt:
              type: [string, "null"]
              format: date-time
      required: [name, providerType, url, username, extraHeaders, postData, currency, defaultRate, cacheDays, timeoutMs, dailyBudget, status, responseMapping]

    HlrProviderSaved:
