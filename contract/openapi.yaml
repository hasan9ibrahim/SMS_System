            providerName:
              type: string
            targets:
              type: array
              items:
                $ref: "#/components/schemas/HlrTarget"
            usedBy:
              type: integer
            updatedBy:
              type: [string, "null"]
            updatedAt:
              $ref: "#/components/schemas/Timestamp"
            archivedAt:
              type: [string, "null"]
