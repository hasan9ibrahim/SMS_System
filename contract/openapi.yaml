      required: [id, enterprise, type, accountManager, billingCycle, currency, customerBillable, customerAmount, vendorBillable, vendorAmount, invoicesIssued, invoicedAmount, paymentsReceived, paymentsMade, balance, creditLimit, creditUsePct, disputedInvoices, vendorInvoiceDifference, negativeMarginMessages, negativeMarginAmount, reratedAmount]
