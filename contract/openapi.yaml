    # ------------------------------------------------------------- Admin (§11, §13.28)
    EmailTemplateType:
      type: string
      enum:
      - customer_rate
      - invoice
      - low_balance
      - bind_down
      - customer_tech_info
      - trunk_change_info
      - soa_statement
      - rate_upload_notification
      - traffic_alert
      - auto_upload_rejected
      - trouble_ticket
      - send_soa
      - monitoring_alert
      description: Email Type (§11).
    UserFields:
      type: object
      required:
      - username
      - firstName
      - lastName
      - email
      - phone
      - departmentId
      - accessGroupId
      - businessCompanyId
      - managerId
      - userType
      - isAccountManager
      - isTeamLead
      - status
      - allowMultipleLogin
      - otpMethod
      - language
      - address1
      - address2
      - countryIso
      - state
      - city
      - zip
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
          pattern: ^[a-z0-9._-]+$
          description: Lower case letters, digits, dot, dash, underscore.
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          maxLength: 200
          format: email
        phone:
          type:
          - string
          - 'null'
          maxLength: 50
        departmentId: &id004
          $ref: '#/components/schemas/Id'
        accessGroupId: &id001
          oneOf: &id002
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        businessCompanyId: *id001
        managerId:
          oneOf: *id002
          description: Team lead the user reports to (§13.18).
        userType:
          type: string
          enum:
          - wholesale
          - api
          description: User Type - Wholesale (GUI) or Api User.
        isAccountManager: &id003
          type: boolean
        isTeamLead: *id003
        status:
          $ref: '#/components/schemas/RecordStatus'
        allowMultipleLogin: *id003
        otpMethod:
          type: string
          enum:
          - 'off'
          - email
          description: OTP verification at login, on top of 2FA (TOTP).
        language:
          type: string
          enum:
          - en
        address1:
          type: string
          minLength: 1
          maxLength: 200
        address2:
          type:
          - string
          - 'null'
          maxLength: 200
        countryIso:
          type: string
          pattern: ^[A-Z]{2}$
        state:
          type:
          - string
          - 'null'
          maxLength: 100
        city:
          type:
          - string
          - 'null'
          maxLength: 100
        zip:
          type:
          - string
          - 'null'
          maxLength: 20
    UserInput:
      allOf:
      - $ref: '#/components/schemas/UserFields'
      - type: object
        required: []
        properties:
          password:
            type:
            - string
            - 'null'
            maxLength: 200
            writeOnly: true
            description: Create only - the temporary password, valid 24 hours and changed at first login (§13.28). Never returned.
      unevaluatedProperties: false
    UserRow:
      allOf:
      - $ref: '#/components/schemas/UserFields'
      - type: object
        required:
        - id
        - displayName
        - department
        - accessGroup
        - businessCompany
        - manager
        - passwordChangedAt
        - passwordExpiresAt
        - passwordDaysLeft
        - passwordState
        - mustChangePassword
        - tempPasswordExpiresAt
        - totpEnabled
        - lastLoginAt
        - activeSessions
        - liveEnterprises
        - updatedBy
        - updatedAt
        - archivedAt
        properties:
          id: *id004
          displayName:
            type: string
          department:
            type:
            - string
            - 'null'
          accessGroup:
            type:
            - string
            - 'null'
          businessCompany:
            type:
            - string
            - 'null'
          manager:
            type:
            - string
            - 'null'
          passwordChangedAt: &id005
            $ref: '#/components/schemas/Timestamp'
          passwordExpiresAt: *id005
          passwordDaysLeft:
            type: integer
            description: Negative when expired.
          passwordState:
            type: string
            enum:
            - ok
            - expiring
            - expired
            - temporary
            - must_change
            description: Password column (§13.28) - expiring = 7 days or less left; temporary = admin-set, valid 24 h.
          mustChangePassword: *id003
          tempPasswordExpiresAt: &id006
            oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          totpEnabled: *id003
          lastLoginAt: *id006
          activeSessions: &id007
            type: integer
          liveEnterprises:
            type: integer
            description: Live enterprises this user is account manager of (blocks delete, §13.29).
          updatedBy: &id008
            type:
            - string
            - 'null'
          updatedAt: *id005
          archivedAt: *id006
    UserSaved:
      type: object
      required:
      - record
      - change
      properties:
        record:
          $ref: '#/components/schemas/UserRow'
        change:
          oneOf:
          - $ref: '#/components/schemas/Change'
          - type: 'null'
    TempPasswordInput:
      type: object
      description: 'Change Others Passwd (§11): a temporary password valid 24 hours that must be changed at first login (§13.28).'
      additionalProperties: false
      required:
      - password
      - confirmPassword
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 200
          writeOnly: true
        confirmPassword:
          type: string
          minLength: 1
          maxLength: 200
          writeOnly: true
    ForcePasswordChangeInput:
      type: object
      additionalProperties: false
      required:
      - ids
      properties:
        ids:
          type: array
          items: *id004
          minItems: 1
          maxItems: 500
          uniqueItems: true
    ForcePasswordChangeResult:
      type: object
      required:
      - updated
      - change
      properties:
        updated: *id007
        change:
          oneOf:
          - $ref: '#/components/schemas/Change'
          - type: 'null'
    TotpSetup:
      type: object
      required:
      - secret
      - otpauthUri
      properties:
        secret:
          type: string
          description: Base32 secret (fake in this phase).
        otpauthUri:
          type: string
          description: otpauth:// URI for the QR code.
    TotpConfirmInput:
      type: object
      additionalProperties: false
      required:
