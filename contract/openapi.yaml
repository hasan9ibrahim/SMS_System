        destinationId:
          $ref: "#/components/schemas/Id"
        asr:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        dlr:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        addSeconds:
          type: [number, "null"]
          minimum: 0
          maximum: 86400

    QbrStatSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/QbrStat"
        change:
          oneOf:
