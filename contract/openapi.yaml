        productCategory:
          type: [string, "null"]
        customerEnterpriseId:
          type: integer
        customerEnterprise:
          type: [string, "null"]
        customerTrunkId:
          type: integer
        customerTrunk:
          type: [string, "null"]
        customerIp:
          type: string
        customerPort:
          type: integer
        customerSessionId:
          type: string
          description: "SMPP session that submitted (§13.1)."
        customerBindType:
          type: string
          description: "TX, RX or TR."
        protocol:
          type: string
        customerMsgId:
          type: string
        srcTon:
          type: integer
        srcNpi:
          type: integer
        dstTon:
          type: integer
        dstNpi:
          type: integer
        coding:
          type: integer
          description: "data_coding (0 GSM 7-bit … 8 UCS-2)."
        senderId:
          type: string
          description: "SRC Addr."
        dnid:
          type: string
          description: "Dest Addr."
        routedDnid:
          type: string
          description: "Routed Dest Addr (after translation)."
        messageText:
          type: string
        customerMccmnc:
          type: string
        mcc:
          type: string
        mnc:
          type: string
        country:
          type: string
          description: "ISO code."
        customerBillingType:
          type: string
        customerRateTableId:
          type: integer
        customerRate:
          type: number
        customerCurrency:
          type: string
        customerSysRate:
          type: number
          description: "Rate in the base currency."
        translationRuleIds:
          type: array
          items:
            type: integer
          description: "Customer translation rules applied."
        customerMsgStatus:
          type: string
          description: "Status reported to the customer."
        vendorEnterpriseId:
          type: integer
          description: "0 = not routed."
        vendorEnterprise:
          type: [string, "null"]
        vendorTrunkId:
          type: integer
          description: "0 = not routed."
        vendorTrunk:
          type: [string, "null"]
        vendorIp:
          type: string
        vendorPort:
          type: integer
        vendorMsgId:
          type: string
        vendorMccmnc:
          type: string
        vendorBillingType:
          type: string
        vendorRateTableId:
          type: integer
        vendorRate:
          type: number
        vendorCurrency:
          type: string
        vendorSysRate:
          type: number
        vendorExRate:
          type: number
        vendorTranslationRuleIds:
          type: array
          items:
            type: integer
        routeRuleId:
          type: integer
        routeRuleGroupId:
          type: integer
        routeDecidedBy:
