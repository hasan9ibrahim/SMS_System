            - $ref: "#/components/schemas/Change"
            - type: "null"

    MoNumber:
      type: object
      required: [id, customerTrunkId, customerTrunk, enterpriseId, enterprise, number, keyword, rate, vendorRate, currency, destinationId, mccmnc, destination, setupCharge, fixCharge, createdAt, createdBy, updatedBy, updatedAt, archivedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        customerTrunkId:
          $ref: "#/components/schemas/Id"
        customerTrunk:
          type: string
        enterpriseId:
          $ref: "#/components/schemas/Id"
        enterprise:
          type: string
        number:
          type: string
          description: Long number (MSISDN, digits) or short code the MO traffic is sent to.
        keyword:
          type: [string, "null"]
          description: First word of the message that selects this entry; null = any message to the number.
        rate:
          type: number
          description: Charged to the customer per MO message.
        vendorRate:
          type: [number, "null"]
          description: Paid to the vendor per MO message; null when no vendor is involved.
        currency:
          type: string
          description: The customer trunk's currency (decided 2026-10-17); every amount of the entry is in it.
        destinationId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        mccmnc:
          type: [string, "null"]
        destination:
          type: [string, "null"]
          description: Country and network of the MCCMNC code.
        setupCharge:
          type: number
          description: One-off charge when the number is set up.
        fixCharge:
          type: number
          description: Fixed charge per billing cycle for the number.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        createdBy:
          type: [string, "null"]
        updatedBy:
          type: [string, "null"]
          description: Username of the last change; null for seeded records.
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        archivedAt:
          type: [string, "null"]
          format: date-time
          description: Set when deleted (archived, §13.29).

    MoNumberInput:
      type: object
      additionalProperties: false
      required: [customerTrunkId, number, keyword, rate, vendorRate, destinationId, setupCharge, fixCharge]
      properties:
        customerTrunkId:
          $ref: "#/components/schemas/Id"
        number:
          type: string
          pattern: "^[0-9]{3,20}$"
        keyword:
          type: [string, "null"]
          maxLength: 40
        rate:
          type: number
          minimum: 0
        vendorRate:
          type: [number, "null"]
          minimum: 0
        destinationId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        setupCharge:
          type: number
          minimum: 0
        fixCharge:
          type: number
          minimum: 0

    MoNumberSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/MoNumber"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    MoNumberPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/MoNumber"

    # ------------------------------------------------------------- Route map, Re-rating, QBR stats (§6.3)
    RouteMapStatus:
      type: string
      enum: [routed, blocked, no_vendor, no_rule]
      description: "routed: a rule picks a vendor; blocked: a block rule matches; no_vendor: rules match but no vendor qualifies; no_rule: no rule matches."

    RouteMapRow:
      type: object
      required: [id, mccmnc, country, network, allNetworks, sellRate, sellCurrency, sellRateConverted, rateTableId, rateTableName, status, ruleId, ruleName, rulePriority, routeType, vendorTrunkId, vendor, vendorCost, margin, marginPct, decidedBy, currency]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        mccmnc:
          type: string
        country:
          type: string
        network:
          type: string
        allNetworks:
          type: boolean
        sellRate:
          type: number
        sellCurrency:
          type: string
        sellRateConverted:
          type: number
          description: Sell rate in the platform currency (`currency`).
        rateTableId:
          $ref: "#/components/schemas/Id"
        rateTableName:
          type: string
        status:
          $ref: "#/components/schemas/RouteMapStatus"
        ruleId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        ruleName:
          type: [string, "null"]
        rulePriority:
          type: [integer, "null"]
        routeType:
          type: [string, "null"]
          enum: [static, dynamic, qbr, block, null]
        vendorTrunkId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        vendor:
          type: [string, "null"]
        vendorCost:
          type: [number, "null"]
          description: The routed vendor's buy rate, platform currency.
        margin:
          type: [number, "null"]
        marginPct:
          type: [number, "null"]
        decidedBy:
          type: [string, "null"]
          description: How the vendor was chosen (priority, percentage, least cost, quality …).
        currency:
          type: string
          description: Platform currency of the converted figures.

    RouteMapPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/RouteMapRow"

    ReratingInput:
      type: object
      additionalProperties: false
      required: [description, startDate, endDate, side, enterpriseIds, rateTableId, reason, mccmncs, senderId, noNote, priority]
      properties:
        description:
          type: [string, "null"]
          maxLength: 500
        startDate:
          type: string
          format: date
          description: First day, UTC.
        endDate:
          type: string
          format: date
          description: Last day (inclusive), UTC.
        side:
          type: string
          enum: [customer, vendor]
        enterpriseIds:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/Id"
        rateTableId:
          $ref: "#/components/schemas/Id"
          description: The corrected table; only EDRs billed with it are re-rated.
        reason:
          type: string
          enum: [rate_correction]
        mccmncs:
          type: array
          maxItems: 500
          description: Limit to these codes (a 3-digit code = the whole country); empty = all.
          items:
            type: string
            pattern: "^[0-9]{3,6}$"
        senderId:
          type: [string, "null"]
          maxLength: 20
        noNote:
          type: boolean
          description: "\"Don't add credit/debit note to transaction\": compute only."
        priority:
          type: string
          enum: [P1, P2, P3]

    ReratingDecline:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    ReratingSummaryRow:
      type: object
      required: [enterpriseId, enterpriseName, side, totalEdrs, oldAmount, newAmount, amount, currency, paymentType, transactionStatus, transactionId, startTime, endTime, updatedBy]
      properties:
        enterpriseId:
          $ref: "#/components/schemas/Id"
        enterpriseName:
          type: string
        side:
          type: string
          enum: [customer, vendor]
        totalEdrs:
          type: integer
        oldAmount:
          type: number
          description: Billed, in `currency` (the rate table's).
        newAmount:
          type: number
        amount:
          type: number
          description: newAmount - oldAmount.
        currency:
          type: string
        paymentType:
          type: [string, "null"]
          enum: [credit, debit, null]
          description: The note posted to the enterprise; null when there is no difference.
        transactionStatus:
          type: string
          enum: [pending, posted, not_posted, no_difference]
          description: "pending: not processed yet; not_posted: noNote was set."
        transactionId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        startTime:
          type: [string, "null"]
          format: date-time
        endTime:
          type: [string, "null"]
          format: date-time
        updatedBy:
          type: [string, "null"]

    ReratingPreview:
      type: object
      required: [totalEdrs, rows]
      properties:
        totalEdrs:
          type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ReratingSummaryRow"

    ReratingRequestFields:
      type: object
      required: [id, side, reprocessType, description, senderId, startDate, endDate, enterprises, rateTableId, rateTableName, reason, mccmncs, noNote, priority, requestStatus, reprocessStatus, requestedBy, requestedAt, decidedBy, decidedAt, declineReason, startedAt, finishedAt, totalEdrs, error, canDecide, canEdit, updatedBy, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        side:
          type: string
          enum: [customer, vendor]
        reprocessType:
          type: string
          enum: [manual, auto]
        description:
          type: [string, "null"]
        senderId:
          type: [string, "null"]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        enterprises:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                $ref: "#/components/schemas/Id"
              name:
                type: string
        rateTableId:
          $ref: "#/components/schemas/Id"
        rateTableName:
          type: string
        reason:
          type: string
          enum: [rate_correction]
        mccmncs:
          type: array
          items:
            type: string
        noNote:
          type: boolean
        priority:
          type: string
          enum: [P1, P2, P3]
        requestStatus:
          type: string
          enum: [pending_approval, approved, declined]
        reprocessStatus:
          type: string
          enum: [not_started, in_queue, in_process, completed, failed]
        requestedBy:
          type: string
        requestedAt:
          $ref: "#/components/schemas/Timestamp"
        decidedBy:
          type: [string, "null"]
        decidedAt:
          type: [string, "null"]
          format: date-time
        declineReason:
          type: [string, "null"]
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        totalEdrs:
          type: [integer, "null"]
        error:
          type: [string, "null"]
        canDecide:
          type: boolean
          description: The signed-in user may approve or decline (pending, and not the requester).
        canEdit:
          type: boolean
          description: The signed-in user may change it (pending, and the requester).
        updatedBy:
          type: [string, "null"]
        updatedAt:
          $ref: "#/components/schemas/Timestamp"

    ReratingDetail:
      allOf:
        - $ref: "#/components/schemas/ReratingRequestFields"
        - type: object
          required: [summary]
          properties:
            summary:
              type: array
              items:
                $ref: "#/components/schemas/ReratingSummaryRow"

    ReratingSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/ReratingDetail"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    ReratingRequestPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/ReratingRequestFields"

    QbrStat:
      type: object
      required: [id, side, trunkId, trunk, enterpriseId, enterprise, destinationId, mccmnc, country, network, attempts, asr, dlr, addSeconds, trafficAsr, trafficDlr, trafficAddSeconds, overridden, updatedAt, updatedBy]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        side:
          type: string
          enum: [customer, vendor]
        trunkId:
          $ref: "#/components/schemas/Id"
        trunk:
          type: string
        enterpriseId:
          $ref: "#/components/schemas/Id"
        enterprise:
          type: string
        destinationId:
          $ref: "#/components/schemas/Id"
        mccmnc:
          type: string
        country:
          type: string
        network:
          type: string
        attempts:
          type: integer
          description: EDRs in the last 24 hours behind the traffic figures.
        asr:
