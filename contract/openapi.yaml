      type: string
      description: "Master Report group-by fields (§13.15). destination = customer MCCMNC (country · network)."
      enum: [date, hour, week, month, customer, customerTrunk, customerIp, vendor, vendorTrunk, vendorIp, country, destination, vendorDestination, productCategory, senderId, routeRule, routeType, rateTable, accountManager, vendorAccountManager, businessCompany, currency, msgType, hlrProvider, errorCode, deliveryStatus]

    ReportMetric:
      type: string
      description: "Master Report metrics (§10, §13.15). Money in the platform currency; *Base in the base currency."
      enum: [attempts, successful, submitted, delivered, failedSubmits, billableCustomer, billableVendor, reportedCustomer, reportedVendor, asr, dlrCustomer, dlrVendor, deliveryDelayS, revenue, cost, margin, marginPct, avgRateCustomer, avgRateVendor, costAvg, revenueBase, costBase, hlrCached, hlrLive, hlrTotal, hlrAccomplished, hlrPorted, hlrCost, reroutes, moCount, tpsAvg, tpsPeak]

    ReportPeriod:
      type: string
      description: "Relative periods resolve in the report's time zone; custom uses from / to."
      enum: [today, yesterday, last_24_hours, last_7_days, this_week, last_week, this_month, last_month, custom]

    MasterReportSettings:
      type: object
      description: What a Master Report shows; also stored in saved views and scheduled reports.
      required: [groupBy, metrics, timezone, period]
      properties:
        groupBy:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ReportDimension"
        metrics:
          type: array
          minItems: 1
          maxItems: 40
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ReportMetric"
        timezone:
          type: string
          maxLength: 64
          description: IANA time zone, e.g. UTC or Etc/GMT-3 (= GMT+3).
        period:
          $ref: "#/components/schemas/ReportPeriod"
        from:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
          description: Custom period start (inclusive).
        to:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
          description: Custom period end (exclusive); at most 400 days after from.
        msgType:
          type: [string, "null"]
          enum: [MT, MO, null]
        compare:
          type: string
          enum: [none, previous_period, previous_week]
          default: none
        filter:
          $ref: "#/components/schemas/FilterGroup"

    MasterReportQuery:
      allOf:
        - $ref: "#/components/schemas/MasterReportSettings"
        - type: object
          properties:
            sort:
              type: array
              maxItems: 5
              items:
                $ref: "#/components/schemas/SortKey"
            limit:
              type: integer
              minimum: 1
              maximum: 4000
              default: 200
            cursor:
              type: [string, "null"]
      unevaluatedProperties: false

    MasterReportExportInput:
      type: object
      additionalProperties: false
      required: [query, fileType]
      properties:
        query:
          $ref: "#/components/schemas/MasterReportQuery"
        fileType:
          type: string
          enum: [csv, excel, pdf]

    MasterReportRow:
      type: object
      required: [key, dims, metrics, previous]
      properties:
        key:
          type: string
          description: Stable key of the group (its dimension IDs).
        dims:
          type: object
          description: Per group-by field, its ID (for drill-down and EDRs) and label.
          additionalProperties:
            type: object
            required: [id, label]
            properties:
              id:
                type: [string, number, "null"]
              label:
                type: string
        metrics:
          type: object
          additionalProperties:
            type: [number, "null"]
        previous:
          oneOf:
            - type: object
              additionalProperties:
                type: [number, "null"]
            - type: "null"
          description: The previous period's metrics when comparing.

    MasterReportPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows, totals, from, to, previousFrom, previousTo, timezone, currency, groupBy, metrics, tookMs]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/MasterReportRow"
            totals:
              type: object
              required: [metrics, previous]
              properties:
                metrics:
                  type: object
                  additionalProperties:
                    type: [number, "null"]
                previous:
