                    - type: "null"
            from:
              $ref: "#/components/schemas/Timestamp"
            to:
              $ref: "#/components/schemas/Timestamp"
            previousFrom:
              oneOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
            previousTo:
              oneOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
            timezone:
              type: string
            currency:
              type: string
              description: The platform currency of the money metrics.
            groupBy:
              type: array
              items:
                $ref: "#/components/schemas/ReportDimension"
            metrics:
              type: array
              items:
                $ref: "#/components/schemas/ReportMetric"
            tookMs:
              type: integer

