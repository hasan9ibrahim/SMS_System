              type: array
              items:
                $ref: "#/components/schemas/NumberList"

    NumberListEntry:
      type: object
      required: [id, numberListId, value, createdBy, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        numberListId:
          $ref: "#/components/schemas/Id"
        value:
          type: string
        createdBy:
          type: [string, "null"]
        createdAt:
          $ref: "#/components/schemas/Timestamp"

    NumberListEntryPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/NumberListEntry"

    NumberListEntriesInput:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: string
            minLength: 1
            maxLength: 64

    NumberListEntriesResult:
      type: object
