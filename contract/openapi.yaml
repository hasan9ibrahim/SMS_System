        trafficAsr:
          type: [number, "null"]
        trafficDlr:
          type: [number, "null"]
        trafficAddSeconds:
          type: [number, "null"]
        overridden:
          type: boolean
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        updatedBy:
          type: [string, "null"]
          description: Who set the override; null for traffic figures.

    QbrOverrideInput:
      type: object
      additionalProperties: false
      required: [vendorTrunkId, destinationId, asr, dlr, addSeconds]
