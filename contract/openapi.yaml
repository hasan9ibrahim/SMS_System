openapi: 3.1.0
info:
  title: SMS Aggregation Platform API
  version: 0.29.0
  summary: The single contract between the GUI and the backend.
  description: |
    The GUI talks to the backend only through this contract (CLAUDE.md rule 2).
    In the frontend phase the TypeScript mock server in `mock/` answers it; later the
    Elixir/Phoenix backend answers the same contract, with no screen changes.

    ## Conventions

    * All times are UTC, ISO 8601 (spec §1 "Global conventions").
    * Every record carries `updatedBy` / `updatedAt`; most carry `createdBy` / `createdAt`.
    * Errors use `application/problem+json` (RFC 9457), see `Problem`.
    * **Lists are server-side** (CLAUDE.md rule 3, spec §13.25, §14.2). Every list is read
      with `POST /{list}/query` and a `ListQuery` body: the filter tree, sort, quick search,
      a page size and an opaque cursor. The server filters, sorts and pages; the browser
      never loads all rows. Grids scroll with virtualisation and fetch the next page with
      `nextCursor` as the user scrolls.
    * The fields a list can be filtered and sorted on, including hidden columns, are
      described by `GET /meta/lists/{list}/fields`, so the filter builder needs no
      per-screen code.
    * Live data (dashboard, analytics, alerts, hover volumes) is not in this file; it is
      pushed over WebSocket as Phoenix Channels messages, see `contract/events/`.
servers:
  - url: /api/v1
    description: Same origin (web dev server proxies to the mock server)
tags:
  - name: system
    description: Health and server information
  - name: session
    description: The signed-in user
  - name: meta
    description: Field catalogue for grids and the filter builder (§13.25)
  - name: enterprises
    description: Partners - customers, vendors and reciprocals (§5)
  - name: trunks
    description: Customer and vendor trunks (§5.4, §5.5)
  - name: routing
    description: Route rules, route simulator (§6.3, §13.8–13.11, §13.27)
  - name: rates
    description: Rate tables, Rate Lookup, bulk rating and incoming vendor RNs (§6.2, §13.11, §13.12, §13.13, §13.16, §13.32)
  - name: users
    description: Staff users (§11), e.g. for sharing saved views
  - name: views
    description: Saved filter views of a list (§13.25)
  - name: history
    description: Change history and per-user undo (§13.10)
  - name: search
    description: Jump-to search across records (Ctrl K, §15.1)
  - name: reports
    description: Traffic reports from the EDR store (§10, §13.31)
  - name: finance
    description: Finance - transactions, invoices, vendor invoices and reconciliation, currencies and exchange rates, billing cycles, balances, charges (§7, §13.31, §13.33)
  - name: switch
    description: Switch rules - translation rules, number lists, HLR providers, rules and policies (§6.4, §6.5, §13.2, §13.24)
  - name: reference
    description: Product reference data - categories, countries, MCCMNC codes, Master Table, MO reference book (§6.1)
  - name: observation
    description: Observation Deck (§9) - EDR search, downloads, repush, network status, signaling, simulator, diagnosis.
  - name: admin
    description: Admin (§11, §13.28) - business companies, departments, users, access groups, sessions, audit trail, e-mail templates, customer portal.
  - name: monitoring
    description: Monitoring alerts (§13.6, §13.7) - alert rules evaluated on the server, incidents, e-mail alerts.

security:
  - sessionCookie: []

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness, versions and server time
      description: Used by the status bar for the server clock (UTC, §15.1) and by deploy checks.
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /me:
    get:
      tags: [session]
      operationId: getCurrentUser
      summary: The signed-in user, role and UI preferences
      description: |
        Drives the avatar menu (§3), the theme (§15.2) and which buttons are shown
        (GUI Access Group, §1). Authentication itself (login, 2FA, monthly password
        change, §13.28) is added in a later contract revision.
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/preferences:
    patch:
      tags: [session]
      operationId: updatePreferences
      summary: Change the signed-in user's UI preferences
      description: Theme (§15.2), open-in-new-tab (§13.5) and animations (§13.3). Only the fields sent change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesUpdate"
      responses:
        "200":
          description: The user with the new preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/workspace:
    get:
      tags: [session]
      operationId: getWorkspace
      summary: The user's open page tabs
      description: Restored after re-login, per user (§13.5). Empty for a new user.
      responses:
        "200":
          description: Open tabs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [session]
      operationId: saveWorkspace
      summary: Save the user's open page tabs
      description: Sent by the GUI (debounced) whenever tabs are opened, closed, moved or pinned (§13.5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Workspace"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /search:
    get:
      tags: [search]
      operationId: search
      summary: Jump-to search across records (Ctrl K)
      description: |
        Case-insensitive match on names, aliases, usernames and IDs of enterprises, trunks,
        rate tables, route rules and users (§15.1). Pages are searched in the GUI itself.
        Account manager masking (§13.17) applies: masked names are not searchable.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Best matches, grouped by kind in the GUI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /meta/lists/{list}/fields:
    get:
      tags: [meta]
      operationId: getListFields
      summary: Filterable and sortable fields of a list
      description: |
        Every column of a list page, including hidden ones, with its type and the
        operators allowed on it (§13.25). The grid builds its column filters and the
        multi-field filter builder from this.
      parameters:
        - $ref: "#/components/parameters/ListId"
      responses:
        "200":
          description: Field catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListFields"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /enterprises/query:
    post:
      tags: [enterprises]
      operationId: queryEnterprises
      summary: List enterprises (server-side filter, sort and paging)
      description: Enterprise list and the enterprise selector "Name – Alias (ID)" (§5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: One page of enterprises
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterprisePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /users/query:
    post:
      tags: [users]
      operationId: queryUsers
      summary: List users (server-side filter, sort and paging)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: One page of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /views:
    get:
      tags: [views]
      operationId: listViews
      summary: Saved views of a list visible to the user
      description: |
        The user's own views plus views other users shared with them (read-only),
        decided 2026-10-16 (§13.25).
      parameters:
        - name: list
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ListId"
      responses:
        "200":
          description: Views, own first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [views]
      operationId: createView
      summary: Save the current filters, sort and columns as a named view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedViewInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /views/{id}:
    put:
      tags: [views]
      operationId: updateView
      summary: Change a view (owner only)
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedViewInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [views]
      operationId: deleteView
      summary: Delete a view (owner only)
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /changes/query:
    post:
      tags: [history]
      operationId: queryChanges
      summary: Change history (server-side filter, sort and paging)
      description: |
        One row per save (§13.10). Filter on `entityType` + `entityId` for a record's
        History tab, on `userId` for "My changes".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: One page of changes, newest first by default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /changes/{id}/undo:
    post:
      tags: [history]
      operationId: undoChange
      summary: Undo one change (§13.10)
      description: |
        Restores only the fields that change touched, so other users' later edits to
        other fields are kept. If someone else has since changed one of those fields,
        the server answers 409 with both values; the GUI then asks the user to keep the
        current value, restore theirs, or cancel, and calls again with `resolution`.
        The undo is itself a change and is returned. Users may undo their own changes;
        undoing someone else's needs the "undo others' changes" permission (403 otherwise).
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UndoRequest"
      responses:
        "200":
          description: The new change that records the undo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A later change by someone else touched the same field(s)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/UndoConflict"
        "503":
          $ref: "#/components/responses/Unavailable"

  /meta/reference:
    get:
      tags: [meta]
      operationId: getReference
      summary: Small reference lists for forms
      description: |
        Business companies, countries, product categories (§6.1), currencies, billing cycles (§7),
        time zones and account managers, for the pickers in record forms.
      responses:
        "200":
          description: Reference data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /enterprises:
    post:
      tags: [enterprises]
      operationId: createEnterprise
      summary: Add an enterprise (§5.1)
      description: |
        The account manager given here opens the enterprise's AM history (§13.30). A name used by
        an archived enterprise stays reserved until that one is renamed (§13.29).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnterpriseInput"
      responses:
        "201":
          description: Created, with the change that records it (§13.10)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /enterprises/{id}:
    get:
      tags: [enterprises]
      operationId: getEnterprise
      summary: One enterprise
      description: |
        General Info tab (§5.1). Archived enterprises stay readable (§13.29).
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: The enterprise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [enterprises]
      operationId: updateEnterprise
      summary: Change a enterprise
      description: |
        Saves the whole record; the change lists only the fields that differ (§13.10).
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnterpriseInput"
      responses:
        "200":
          description: Saved, with the change (null when nothing differed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /enterprises/{id}/dependencies:
    get:
      tags: [enterprises]
      operationId: getEnterpriseDependencies
      summary: What depends on a enterprise (safe delete, §13.29)
      description: |
        Live binds, active trunks, rate tables and route rules using its trunks, unpaid invoices,
        unpaid balance, open disputes and traffic in the last 30 days.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Dependencies and whether they block archiving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dependencies"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /enterprises/{id}/archive:
    post:
      tags: [enterprises]
      operationId: archiveEnterprise
      summary: Archive (delete) a enterprise (§13.29)
      description: |
        Delete means archive: the record leaves lists, pickers and routing and stops carrying
        traffic, but nothing is removed. Blocking dependencies answer 409 unless an administrator
        sends `override` with a reason, which is logged.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveRequest"
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseSaved"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Blocked by dependencies that must be settled first
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ArchiveBlocked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /enterprises/{id}/restore:
    post:
      tags: [enterprises]
      operationId: restoreEnterprise
      summary: Restore an archived enterprise (§13.29)
      description: |
        Administrators only; the restore is logged.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /enterprises/{id}/billing:
    get:
      tags: [enterprises]
      operationId: getEnterpriseBilling
      summary: Billing tab (§5.3)
      description: |
        Customer and vendor billing settings with current balances, and the beneficiary.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Billing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseBilling"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [enterprises]
      operationId: updateEnterpriseBilling
      summary: Change billing settings (§5.3, §12.3)
      description: |
        A side (customer or vendor) is present when the enterprise type has that side.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnterpriseBillingInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /enterprises/{id}/account-managers:
    get:
      tags: [enterprises]
      operationId: getAccountManagerHistory
      summary: AM history (§13.30)
      description: |
        Who managed the account when; the open row is the current AM, a future row a scheduled handover.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Periods, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AmPeriod"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /enterprises/{id}/handover:
    post:
      tags: [enterprises]
      operationId: handOverEnterprise
      summary: Hand the account to another AM (§13.30)
      description: |
        Immediate or scheduled. Results before the effective time stay with the previous AM,
        because EDRs store the AM at send time. A scheduled handover replaces an earlier pending one.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoverRequest"
      responses:
        "200":
          description: The new history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoverSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /enterprises/{id}/docs:
    get:
      tags: [enterprises]
      operationId: listEnterpriseDocs
      summary: "Docs tab: contract and KYC files (§5.2)"
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Documents, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnterpriseDoc"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [enterprises]
      operationId: uploadEnterpriseDoc
      summary: Add a document (§5.2)
      description: |
        The file travels base64-encoded in JSON (at most 10 MB).
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnterpriseDocUpload"
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseDoc"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /enterprises/{id}/docs/{docId}:
    delete:
      tags: [enterprises]
      operationId: deleteEnterpriseDoc
      summary: Delete a document
      description: |
        Archives it (§13.29); it no longer lists.
      parameters:
        - $ref: "#/components/parameters/RecordId"
        - $ref: "#/components/parameters/DocId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /enterprises/{id}/docs/{docId}/file:
    get:
      tags: [enterprises]
      operationId: downloadEnterpriseDoc
      summary: Download a document
      description: |
        Saved as Docs_{enterpriseId}_{docId} with the original extension (§12.3).
      parameters:
        - $ref: "#/components/parameters/RecordId"
