      responses:
        "200":
          description: CSV file, UTF-8, header row
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /route-rules:
    post:
      tags: [routing]
      operationId: createRouteRule
      summary: "Add a route rule (§6.3)"
      description: |
        Every field of the rule, including vendors, warm-up thresholds and number whitelists (§13.27).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteRuleInput"
      responses:
        "201":
          description: Created, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteRuleSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /route-rules/{id}:
    get:
      tags: [routing]
      operationId: getRouteRule
      summary: "One route rule"
      description: |
        Conditions, vendors and settings of one rule, with names for every id (§15.4 detail panel).
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: The route rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteRuleDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [routing]
      operationId: updateRouteRule
      summary: "Change a route rule"
      description: |
        Saves the whole record; the change lists only the fields that differ (§13.10).
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteRuleInput"
      responses:
        "200":
          description: Saved, with the change (null when nothing differed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteRuleSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /route-rules/{id}/dependencies:
    get:
      tags: [routing]
      operationId: getRouteRuleDependencies
      summary: "What depends on a route rule (safe delete, §13.29)"
      description: |
        Traffic in the last 30 days and rules that hand over to its group. Nothing blocks archiving a
        rule; archived rules stop routing at once.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Dependencies and whether they block archiving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dependencies"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /route-rules/{id}/archive:
    post:
      tags: [routing]
      operationId: archiveRouteRule
      summary: "Archive (delete) a route rule (§13.29)"
      description: |
        Delete means archive: the record leaves lists, pickers and routing and stops carrying
        traffic, but nothing is removed. Blocking dependencies answer 409 unless an administrator
        sends `override` with a reason, which is logged.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveRequest"
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteRuleSaved"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Blocked by dependencies that must be settled first
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ArchiveBlocked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /route-rules/{id}/restore:
    post:
      tags: [routing]
      operationId: restoreRouteRule
      summary: "Restore an archived route rule (§13.29)"
      description: |
        Administrators only; the restore is logged.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteRuleSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /route-rules/{id}/clone:
    post:
      tags: [routing]
      operationId: cloneRouteRule
      summary: "Duplicate a route rule (D)"
      description: |
        The copy is inactive and named "<name> (copy)", so it never routes twice by accident.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "201":
          description: The copy, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteRuleSaved"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /route-rules/bulk:
    post:
      tags: [routing]
      operationId: bulkRouteRules
      summary: "Bulk operation on route rules (§6.3 Bulk Operation, §13.11)"
      description: |
        Enable, disable, set or shift priority, replace a vendor trunk or archive many rules. The whole
        operation is one change and is undone as one (§13.10).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteBulkRequest"
      responses:
        "200":
          description: Applied, with the change (null when nothing differed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteBulkSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /route-rules/{id}/traffic:
    get:
      tags: [routing]
      operationId: getRouteRuleTraffic
      summary: "Traffic of a rule per customer and vendor (§13.27)"
      description: |
        Volume, ASR, DLR and margin for the window, per customer trunk (hover breakdown) and per
        vendor trunk, with a time series for the trend line.
      parameters:
        - $ref: "#/components/parameters/RecordId"
        - $ref: "#/components/parameters/TrafficWindow"
      responses:
        "200":
          description: Traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteTraffic"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /route-rules/{id}/test:
    post:
      tags: [routing]
      operationId: testRouteRule
      summary: "Run a sample message through one rule (Test)"
      description: |
        Shows each condition's result and, when the rule matches, the vendor and what decided it:
        whitelist, warm-up threshold or the normal split (§13.27).
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteTestRequest"
      responses:
        "200":
          description: The decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /route-rules/simulate:
    post:
      tags: [routing]
      operationId: simulateRoute
      summary: "Route Simulator: run a sample message through all rules"
      description: |
        Rules are tried by priority; the first that matches decides (continue YES moves on). Takes a
        simulated TPS and revenue (§13.8, §13.9).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteTestRequest"
      responses:
        "200":
          description: The rules tried and the decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteSimulation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rate-lookup/destinations:
    get:
      tags: [rates]
      operationId: resolveLookupDestinations
      summary: "Rate Lookup: find destinations as you type (§13.16)"
      description: |
        `q` is a country, network, MCCMNC, dial code or a full phone number. A number is resolved
        to its network by the longest dial-code prefix, or by a (simulated) HLR lookup with
        `live=true`. Country matches list the country-level code ("505 · all") first.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: live
          in: query
          required: false
          description: Resolve a phone number by HLR instead of by prefix.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Matching destinations, best first (at most 20)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupResolution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rate-lookup:
    post:
      tags: [rates]
      operationId: lookupRates
      summary: "Rate Lookup easy mode: vendor costs and client rates for one destination"
      description: |
        Two panels (§13.16): every vendor trunk with a rate, cheapest first, and every customer
        trunk selling the destination with its margin against the best vendor and against the
        vendor routing would use for that trunk today (§6.3 rules). A network falls back to the
        country-level line ("all networks") when a table has no line for it; sender-ID lines
        are left out unless `senderId` is given.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateLookupRequest"
      responses:
        "200":
          description: The two panels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLookupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rate-lookup/matrix:
    post:
      tags: [rates]
      operationId: rateLookupMatrix
      summary: "Rate Lookup advanced mode: many destinations at once, paged"
      description: |
        Rows are destinations, paged with `limit` and `cursor`; columns depend on the view
        (§13.16): vendor trunks (cost comparison), customer trunks (client rates or margin
        matrix), or ranks 1..N (cheapest vendors with quality). At most 60 columns, the trunks
        covering most of the destinations first (`columnsTruncated` says when more exist).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateMatrixRequest"
      responses:
        "200":
          description: One page of the matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateMatrix"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rate-lookup/matrix/export:
    post:
      tags: [rates]
      operationId: exportRateLookupMatrix
      summary: "Export the whole advanced lookup as CSV (§13.16)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateMatrixRequest"
      responses:
        "200":
          description: CSV file, UTF-8, header row; every destination row (up to 20,000)
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rate-lookups:
    get:
      tags: [rates]
      operationId: listSavedLookups
      summary: Saved lookups visible to the user (own and shared with them)
      responses:
        "200":
          description: Saved lookups, own first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedLookup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [rates]
      operationId: createSavedLookup
      summary: "Save an advanced lookup, e.g. \"Ahmad's clients – GCC\" (§13.16)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedLookupInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedLookup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rate-lookups/{id}:
    put:
      tags: [rates]
      operationId: updateSavedLookup
      summary: Change a saved lookup (owner only)
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedLookupInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedLookup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [rates]
      operationId: deleteSavedLookup
      summary: Delete a saved lookup (owner only)
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"


components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sms_session
      description: Session cookie set at sign-in (login flow added in a later revision).

  parameters:
    TrafficWindow:
      name: window
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/TrafficWindow"
    RateView:
      name: view
      in: query
      required: false
      description: Which lines (§13.12 view tabs).
      schema:
        type: string
        enum: [current, scheduled, closed]
        default: current
    DocId:
      name: docId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    RecordId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ListId:
      name: list
      in: path
      required: true
      description: Identifier of a list page.
      schema:
        $ref: "#/components/schemas/ListId"

  responses:
    BadRequest:
      description: The request does not match the contract (e.g. unknown filter field or operator)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Not signed in, or not allowed by the user's GUI Access Group (§1)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such record
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Signed in, but this record or action belongs to someone else
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: |
        The data store behind this operation is not reachable. In the frontend phase this
        means the local databases are not running or not seeded (`npm run db:up`,
        `npm run seed:small`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    # ------------------------------------------------------------------ common
    Id:
      type: integer
      format: int64
      minimum: 1
      description: Numeric record ID, shown to users (e.g. "Name – Alias (ID)").

    Timestamp:
      type: string
      format: date-time
      description: UTC, ISO 8601.

    Audit:
      type: object
      description: Who changed the record and when (spec §1).
      required: [updatedBy, updatedAt]
      properties:
        createdBy:
          type: [string, "null"]
        createdAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        updatedBy:
          type: string
        updatedAt:
          $ref: "#/components/schemas/Timestamp"

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          description: Field-level errors, for forms and for invalid filters.
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
                description: JSON pointer into the request, e.g. `/filter/conditions/0/field`.
              message:
                type: string

    # ------------------------------------------------------------------ system
    Health:
      type: object
      required: [status, version, contractVersion, serverTime, backend]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: Build version of the server answering the contract.
        contractVersion:
          type: string
          description: The `info.version` of this contract the server implements.
        serverTime:
          $ref: "#/components/schemas/Timestamp"
        backend:
          type: string
          enum: [mock, elixir]
          description: Which implementation answers the contract.

    Theme:
      type: string
      enum: [light, dark]
      description: Colour theme (§15.2).

    CurrentUser:
      type: object
      required: [id, username, displayName, role, businessCompany, preferences, permissions]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        username:
          type: string
        displayName:
          type: string
        initials:
          type: string
          description: Shown in the avatar (§3).
        role:
          type: string
          description: e.g. Admin, NOC, Rates, Finance, Account Manager.
        businessCompany:
          type: string
          description: The selling entity the user belongs to.
        preferences:
          type: object
          required: [theme]
          properties:
            theme:
              $ref: "#/components/schemas/Theme"
            openInNewTab:
              type: boolean
              default: true
              description: Menu items open in a new tab or the current tab (§13.5).
            animations:
              type: boolean
              default: true
              description: Live value animations on/off (§13.3).
        permissions:
          type: array
          description: GUI Access Group permission keys; buttons not covered are hidden (§1).
          items:
            type: string

    PreferencesUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        theme:
          $ref: "#/components/schemas/Theme"
        openInNewTab:
          type: boolean
        animations:
          type: boolean

    WorkspaceTab:
      type: object
      description: One open page tab (§13.5). Per-tab page state (filters, scroll) stays in the browser.
      required: [id, path, title, pinned]
      additionalProperties: false
      properties:
        id:
          type: string
          maxLength: 64
        path:
          type: string
          maxLength: 2000
          description: GUI route of the page, with its query string.
        title:
          type: string
          maxLength: 200
        pinned:
          type: boolean

    Workspace:
      type: object
      required: [tabs, activeTabId]
      additionalProperties: false
      properties:
        tabs:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/WorkspaceTab"
        activeTabId:
          type: [string, "null"]

    SearchHit:
      type: object
      required: [kind, id, label]
      properties:
        kind:
          type: string
          enum: [enterprise, customer_trunk, vendor_trunk, rate_table, route_rule, user]
        id:
          $ref: "#/components/schemas/Id"
        label:
          type: string
          description: Display name, e.g. "Name – Alias (ID)" for enterprises.
        detail:
          type: [string, "null"]
          description: Secondary text, e.g. the trunk's enterprise or the rule's priority.

    SearchResults:
      type: object
      required: [hits]
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"

    # ------------------------------------------------------------------ users (§11)
    UserSummary:
      type: object
      required: [id, username, displayName, email, status, isAccountManager]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
        department:
          type: [string, "null"]
        accessGroup:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/RecordStatus"
        isAccountManager:
          type: boolean

    UserPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/UserSummary"

    # ------------------------------------------------------------- saved views (§13.25)
    ViewState:
      type: object
      description: What a saved view restores on a grid.
      additionalProperties: false
      properties:
        filter:
          $ref: "#/components/schemas/FilterGroup"
        search:
          type: string
          maxLength: 200
        sort:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/SortKey"
        columns:
          type: array
          description: Visible columns in display order (field names).
          maxItems: 200
          items:
            type: string

    SavedViewInput:
      type: object
      required: [list, name, state]
      additionalProperties: false
      properties:
        list:
          $ref: "#/components/schemas/ListId"
        name:
          type: string
          minLength: 1
          maxLength: 100
        sharedWithUserIds:
          type: array
          description: Colleagues who see the view read-only (decided 2026-10-16). Empty = private.
          maxItems: 200
          items:
            $ref: "#/components/schemas/Id"
        state:
          $ref: "#/components/schemas/ViewState"

    SavedView:
      type: object
      required: [id, list, name, owner, sharedWithUserIds, readOnly, state, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        list:
          $ref: "#/components/schemas/ListId"
        name:
          type: string
        owner:
          type: object
          required: [id, displayName]
          properties:
            id:
              $ref: "#/components/schemas/Id"
            displayName:
              type: string
        sharedWithUserIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        readOnly:
          type: boolean
          description: True when the view was shared with the user by someone else.
        state:
          $ref: "#/components/schemas/ViewState"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"

    # ------------------------------------------------------------- history and undo (§13.10)
    ChangeType:
      type: string
      enum: [create, edit, clone, delete, reorder, enable, disable, bulk, undo]

    ChangeField:
      type: object
      description: One field of one record, before and after the save.
      required: [entityId, field, before, after]
      properties:
        entityId:
          $ref: "#/components/schemas/Id"
        field:
          type: string
        before: {}
        after: {}

    Change:
      type: object
      required: [id, entityType, entityIds, changeType, diff, userId, userName, at, undoOfId, undoneById]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        entityType:
          type: string
          description: e.g. route_rule, rate_line, translation_rule, hlr_rule, customer_trunk.
        entityIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        changeType:
          $ref: "#/components/schemas/ChangeType"
        diff:
          type: array
          items:
            $ref: "#/components/schemas/ChangeField"
        note:
          type: [string, "null"]
        userId:
          $ref: "#/components/schemas/Id"
        userName:
          type: string
        ip:
          type: [string, "null"]
        at:
          $ref: "#/components/schemas/Timestamp"
        undoOfId:
          description: Set on an undo; the change it reverted.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        undoneById:
          description: Set when a later undo reverted this change.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"

    ChangePage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/Change"

    UndoRequest:
      type: object
      additionalProperties: false
      properties:
        resolution:
          type: string
          enum: [restore_mine, keep_current]
          description: |
            Answer to a 409. `restore_mine` overwrites the later values; `keep_current`
            undoes only the fields nobody changed since.
        note:
          type: string
          maxLength: 500

    UndoConflict:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [conflicts]
          properties:
            conflicts:
              type: array
              items:
                type: object
                required: [entityId, field, mine, current, changedBy, changedAt]
                properties:
                  entityId:
                    $ref: "#/components/schemas/Id"
                  field:
                    type: string
                  mine:
                    description: The value this change set (what undo would replace).
                  current:
                    description: The value set later by someone else.
                  changedBy:
                    type: string
                  changedAt:
                    $ref: "#/components/schemas/Timestamp"

    # ------------------------------------------------------------- reference data
    ReferenceData:
      type: object
      required: [businessCompanies, countries, productCategories, currencies, billingCycles, timezones, accountManagers, routeRuleGroups, numberLists]
      properties:
        businessCompanies:
          type: array
          items:
            type: object
            required: [id, name, baseCurrency]
            properties:
              id:
                $ref: "#/components/schemas/Id"
              name:
                type: string
              baseCurrency:
                type: string
        countries:
          type: array
          description: Sorted by name (§13.25).
          items:
            type: object
            required: [id, name, iso, dialCode]
            properties:
              id:
                $ref: "#/components/schemas/Id"
              name:
                type: string
              iso:
                type: string
              dialCode:
                type: string
        productCategories:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                $ref: "#/components/schemas/Id"
              name:
                type: string
        currencies:
          type: array
          items:
            type: object
            required: [iso, name, symbol]
            properties:
              iso:
                type: string
              name:
                type: string
              symbol:
                type: string
        billingCycles:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                $ref: "#/components/schemas/Id"
              name:
                type: string
        timezones:
          type: array
          items:
            type: string
        accountManagers:
          type: array
          items:
            type: object
            required: [id, displayName]
            properties:
              id:
                $ref: "#/components/schemas/Id"
              displayName:
                type: string
        routeRuleGroups:
          description: Route rule groups for chaining with Next group (§6.3, optional since §13.2).
          type: array
          items:
            $ref: "#/components/schemas/Named"
        numberLists:
          description: Number lists for sender, receiver and whitelist conditions (§6.4, §13.27).
          type: array
          items:
            type: object
            required: [id, name, listType]
            properties:
              id:
                $ref: "#/components/schemas/Id"
              name:
                type: string
              listType:
                type: string
                enum: [random, tag, sender_id_template]

    # ------------------------------------------------------------- safe delete (§13.29)
    Archived:
      description: Set when the record is archived (deleted, §13.29); null otherwise.
      oneOf:
        - type: object
          required: [at, by]
          properties:
            at:
              $ref: "#/components/schemas/Timestamp"
            by:
              type: [string, "null"]
        - type: "null"

    DependencyItem:
      type: object
      required: [key, label, count, blocking]
      properties:
        key:
          type: string
          description: e.g. live_binds, trunks, route_rules, unpaid_invoices, balance, disputes, traffic_30d.
        label:
          type: string
        count:
          type: [number, "null"]
          description: Number (or amount for balance); null when it could not be determined.
        blocking:
          type: boolean
          description: Must be settled before archiving (§13.29).
        detail:
          type: [string, "null"]

    Dependencies:
      type: object
      required: [blocked, items]
      properties:
        blocked:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/DependencyItem"

    ArchiveRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
        override:
          type: boolean
          description: Administrators only, with a reason. Archives despite blocking dependencies.

    ArchiveBlocked:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [dependencies]
          properties:
            dependencies:
              $ref: "#/components/schemas/Dependencies"

    # ------------------------------------------------------------- enterprise record (§5.1)
    Contact:
      type: object
      required: [emails]
      additionalProperties: false
      properties:
        name:
          type: [string, "null"]
          maxLength: 200
        phone:
          type: [string, "null"]
          maxLength: 50
        emails:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: email

    Contacts:
      type: object
      required: [commercial, technical, rates, finance]
      additionalProperties: false
      properties:
        commercial:
          $ref: "#/components/schemas/Contact"
        technical:
          $ref: "#/components/schemas/Contact"
        rates:
          $ref: "#/components/schemas/Contact"
        finance:
          $ref: "#/components/schemas/Contact"

    Address:
      type: object
      required: [line1]
      additionalProperties: false
      properties:
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: [string, "null"]
          maxLength: 200
        city:
          type: [string, "null"]
          maxLength: 100
        state:
          type: [string, "null"]
          maxLength: 100
        countryId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        zip:
          type: [string, "null"]
          maxLength: 20

    CreditAlertPercent:
      type: object
      required: [notice, warning, critical]
      additionalProperties: false
      description: Credit alert levels in % of the credit limit (defaults 50 / 70 / 90).
      properties:
        notice:
          type: integer
          minimum: 1
          maximum: 100
        warning:
          type: integer
          minimum: 1
          maximum: 100
        critical:
          type: integer
          minimum: 1
          maximum: 100

    EnterpriseInput:
      type: object
      description: Add/Edit form (§5.1). The account manager is set on create; later changes go through handover (§13.30).
      required: [name, alias, type, tier, status, businessCompanyId, address, contacts, creditAlertPercent]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        alias:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: "#/components/schemas/EnterpriseType"
        tier:
          $ref: "#/components/schemas/EnterpriseTier"
        status:
          $ref: "#/components/schemas/RecordStatus"
        businessCompanyId:
          $ref: "#/components/schemas/Id"
        accountManagerId:
          $ref: "#/components/schemas/Id"
          description: Required on create; ignored on update (use handover).
        bindAlert:
          type: boolean
        creditAlert:
          type: boolean
        creditAlertPercent:
          $ref: "#/components/schemas/CreditAlertPercent"
        address:
          $ref: "#/components/schemas/Address"
        website:
          type: [string, "null"]
          maxLength: 300
        fax:
          type: [string, "null"]
          maxLength: 50
        registrationNumber:
          type: [string, "null"]
          maxLength: 100
        vatNumber:
          type: [string, "null"]
          maxLength: 100
        billingTimezone:
          type: string
          description: Day and month totals are cut at midnight in this zone (§13.31).
        rateNoticeDays:
          type: integer
          minimum: 0
          maximum: 90
          description: Notice period for rate increases (§13.14, §13.32).
        contacts:
          $ref: "#/components/schemas/Contacts"

    EnterpriseDetail:
      allOf:
        - $ref: "#/components/schemas/Enterprise"
        - type: object
          required: [bindAlert, creditAlert, creditAlertPercent, address, contacts, billingTimezone, rateNoticeDays, archived, trunkCounts]
          properties:
            bindAlert:
              type: boolean
            creditAlert:
              type: boolean
            creditAlertPercent:
              $ref: "#/components/schemas/CreditAlertPercent"
            address:
              $ref: "#/components/schemas/Address"
            website:
              type: [string, "null"]
            fax:
              type: [string, "null"]
            registrationNumber:
              type: [string, "null"]
            vatNumber:
              type: [string, "null"]
            billingTimezone:
              type: string
            rateNoticeDays:
              type: integer
            contacts:
              $ref: "#/components/schemas/Contacts"
            archived:
              $ref: "#/components/schemas/Archived"
            trunkCounts:
              type: object
              required: [customer, vendor]
              properties:
                customer:
                  type: integer
                vendor:
                  type: integer

    EnterpriseSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/EnterpriseDetail"
        change:
          description: The change this save recorded, for the Undo toast (§13.10); null when nothing differed.
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    # ------------------------------------------------------------- billing (§5.3)
    BillingSideFields:
      type: object
      description: Shared fields of a billing side form and record.
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
        billingCycleId:
          $ref: "#/components/schemas/Id"
        timezone:
          type: string
        billingType:
          type: [string, "null"]
          enum: [prepaid, postpaid, null]
          description: Customer side only.
        creditLimit:
          type: [number, "null"]
          minimum: 0
          description: Customer side, postpaid.
        openingBalance:
          type: number
        autoInvoicing:
          type: boolean
          description: Customer side only.
        sendPaymentConfirmation:
          type: boolean
          description: Default for new payments (§13.33).
        description:
          type: [string, "null"]
          maxLength: 1000

    BillingSideInput:
      allOf:
        - $ref: "#/components/schemas/BillingSideFields"
      required: [currency, billingCycleId, timezone, openingBalance]
      unevaluatedProperties: false

    BillingSide:
      required: [currency, billingCycleId, timezone, openingBalance]
      allOf:
        - $ref: "#/components/schemas/BillingSideFields"
        - type: object
          required: [balance, billingCycleName, updatedBy, updatedAt]
          properties:
            balance:
              type: number
              description: Opening balance + usage charges − payments and credits + debits, in the side's currency.
            billingCycleName:
              type: string
            updatedBy:
              type: [string, "null"]
            updatedAt:
              $ref: "#/components/schemas/Timestamp"

    Beneficiary:
      type: object
      additionalProperties: false
      properties:
        beneficiaryName:
          type: [string, "null"]
        address:
          type: [string, "null"]
        bank:
          type: [string, "null"]
        bankAddress:
          type: [string, "null"]
        currency:
          type: [string, "null"]
        accountNumber:
          type: [string, "null"]
        iban:
          type: [string, "null"]
        swift:
          type: [string, "null"]
        walletAddress:
          type: [string, "null"]
          description: Crypto wallet.

    EnterpriseBilling:
      type: object
      required: [customer, vendor, beneficiary]
      properties:
        customer:
          oneOf:
            - $ref: "#/components/schemas/BillingSide"
            - type: "null"
        vendor:
          oneOf:
            - $ref: "#/components/schemas/BillingSide"
            - type: "null"
        beneficiary:
          $ref: "#/components/schemas/Beneficiary"

    EnterpriseBillingInput:
      type: object
      additionalProperties: false
      properties:
        customer:
          $ref: "#/components/schemas/BillingSideInput"
        vendor:
          $ref: "#/components/schemas/BillingSideInput"
        beneficiary:
          $ref: "#/components/schemas/Beneficiary"

    BillingSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/EnterpriseBilling"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    # ------------------------------------------------------------- AM handover (§13.30)
    AmPeriod:
      type: object
      required: [userId, userName, startsAt, endsAt, note]
      properties:
        userId:
          $ref: "#/components/schemas/Id"
        userName:
          type: string
        startsAt:
          $ref: "#/components/schemas/Timestamp"
        endsAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        note:
          type: [string, "null"]

    HandoverRequest:
      type: object
      required: [userId]
      additionalProperties: false
      properties:
        userId:
          $ref: "#/components/schemas/Id"
        effectiveAt:
          $ref: "#/components/schemas/Timestamp"
          description: Default now. A future time schedules the handover.
        note:
          type: string
          maxLength: 500

    HandoverSaved:
      type: object
      required: [periods, change]
      properties:
        periods:
          type: array
          items:
            $ref: "#/components/schemas/AmPeriod"
        change:
          $ref: "#/components/schemas/Change"

    # ------------------------------------------------------------- docs (§5.2)
    EnterpriseDoc:
      type: object
      required: [id, name, fileName, contentType, size, createdBy, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        fileName:
          type: string
        contentType:
          type: string
        size:
          type: integer
        createdBy:
          type: [string, "null"]
        createdAt:
          $ref: "#/components/schemas/Timestamp"

    EnterpriseDocUpload:
      type: object
      required: [name, fileName, dataBase64]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          maxLength: 100
        dataBase64:
          type: string
          maxLength: 14000000
          description: File content, base64 (at most 10 MB decoded).

    # ------------------------------------------------------------- trunks (§5.4, §5.5)
    TrunkProtocol:
      type: string
      enum: [smpp, http]
    BillingType:
      type: string
      enum: [attempt, submit, reported, delivery]
      description: The event that makes a message billable (§7).
    SslType:
      type: string
      enum: [none, tls1.2, tls1.3]
      description: TLS 1.2/1.3 replace the reference platform's SSLv2/SSLv3/TLSv1 (§16).
    LimitPeriod:
      type: string
      enum: [hour, day, week, month, billing_cycle]

    TrunkListRow:
      type: object
      required: [id, enterpriseId, enterpriseName, name, username, categoryId, category, protocol, tps, status, bindType, rulesCount, updatedBy, updatedAt, archived]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        enterpriseId:
          $ref: "#/components/schemas/Id"
        enterpriseName:
          type: string
        name:
          type: string
        username:
          type: string
        categoryId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        category:
          type: [string, "null"]
        protocol:
          $ref: "#/components/schemas/TrunkProtocol"
        tps:
          type: integer
        status:
          $ref: "#/components/schemas/RecordStatus"
        bindType:
          type: string
        rulesCount:
          type: integer
          description: Translation rules running on the trunk (replaces "Translation Rule Group", §13.2).
        updatedBy:
          type: [string, "null"]
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        archived:
          type: boolean

    CustomerTrunkPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/TrunkListRow"

    VendorTrunkPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/TrunkListRow"

    CustomerTrunkFields:
      description: Shared fields of the customer trunk form and record.
      type: object
      properties:
        enterpriseId:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          minLength: 1
          maxLength: 100
        protocol:
          $ref: "#/components/schemas/TrunkProtocol"
        categoryId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        billingType:
          $ref: "#/components/schemas/BillingType"
        status:
          $ref: "#/components/schemas/RecordStatus"
        bindType:
          type: string
          enum: [TX, RX, TR, AUTO]
        considerHlrRate:
          type: boolean
        serviceTypeRouting:
          type: boolean
        partWiseRouting:
          type: boolean
        hostIps:
          type: array
          minItems: 1
          maxItems: 50
          description: Allowed client IP addresses.
          items:
            anyOf:
              - type: string
                format: ipv4
              - type: string
                format: ipv6
        username:
          type: string
          minLength: 1
          maxLength: 16
          description: SMPP system_id.
        password:
          type: string
          minLength: 1
          maxLength: 9
          writeOnly: true
          description: SMPP password (system_id max 16, password max 9 characters in SMPP v3.4). Required on create; omit to keep.
        maxConnections:
          type: integer
          minimum: 1
          maximum: 10
        systemType:
          type: [string, "null"]
          maxLength: 13
        port:
          type: integer
          minimum: 1
          maximum: 65535
        sslType:
          $ref: "#/components/schemas/SslType"
        dlrPushUrl:
          type: [string, "null"]
          maxLength: 500
        moPushUrl:
          type: [string, "null"]
          maxLength: 500
        delayedSubmit:
          type: boolean
        sendBind:
          type: boolean
        dlrSessionAffinity:
          type: string
          enum: [strict, same_ip, same_trunk]
          description: Where receipts go when the submitting session is gone (§13.1).
        dlrHoldHours:
          type: integer
          minimum: 0
          maximum: 720
        tps:
          type: integer
          minimum: 1
          maximum: 100000
        overflowBuffer:
          type: integer
          minimum: 0
        loopDetection:
          type: boolean
        defaultCoding:
          type: integer
          enum: [0, 3]
        rateTableIds:
          type: array
          description: Rate tables in order; the first with a line for the destination wins (§5.4).
          maxItems: 20
          items:
            $ref: "#/components/schemas/Id"
        expressVendorTrunkId:
          description: Express vendor selection - bypass routing (§5.4).
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        expressMargin:
          type: [number, "null"]
        revenueLimit:
          type: [number, "null"]
          minimum: 0
        revenueLimitPeriod:
          oneOf:
            - $ref: "#/components/schemas/LimitPeriod"
            - type: "null"


    CustomerTrunkInput:
      description: Customer trunk form (§5.4) with session affinity (§13.1) and revenue limit (§13.26).
      allOf:
        - $ref: "#/components/schemas/CustomerTrunkFields"
      required: [enterpriseId, name, protocol, billingType, status, bindType, hostIps, username, maxConnections, port, tps]
      unevaluatedProperties: false

    TrunkDetailCommon:
      type: object
      required: [id, enterpriseName, passwordSet, archived, ownRateTableId]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        enterpriseName:
          type: string
        passwordSet:
          type: boolean
          description: Passwords are never shown (§16 rebuild notes).
        archived:
          $ref: "#/components/schemas/Archived"
        ownRateTableId:
          description: Vendor trunks own one buy table (§13.12); null for customer trunks.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"

    CustomerTrunkDetail:
      allOf:
        - $ref: "#/components/schemas/TrunkDetailCommon"
        - $ref: "#/components/schemas/CustomerTrunkFields"
        - $ref: "#/components/schemas/Audit"
      required: [enterpriseId, name, protocol, billingType, status, bindType, hostIps, username, maxConnections, port, tps]

    VendorTrunkFields:
      description: Shared fields of the vendor trunk form and record.
      type: object
      properties:
        enterpriseId:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          minLength: 1
          maxLength: 100
        protocol:
          $ref: "#/components/schemas/TrunkProtocol"
        categoryId:
          $ref: "#/components/schemas/Id"
        billingType:
          $ref: "#/components/schemas/BillingType"
        status:
          $ref: "#/components/schemas/RecordStatus"
        bindType:
          type: string
          enum: [TX, RX, TR]
        username:
          type: string
          minLength: 1
          maxLength: 16
        password:
          type: string
          minLength: 1
          maxLength: 9
          writeOnly: true
          description: Required on create; omit to keep.
        host:
          type: string
          minLength: 1
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
        sourceHost:
          type: [string, "null"]
          maxLength: 64
        maxConnections:
          type: integer
          minimum: 1
          maximum: 10
        systemType:
          type: [string, "null"]
          maxLength: 13
        serviceType:
          type: [string, "null"]
          maxLength: 6
        sslType:
          $ref: "#/components/schemas/SslType"
        submitIntervalMs:
          type: integer
          minimum: 0
        submitTimeoutS:
          type: integer
          minimum: 1
        enquireLinkTimeoutS:
          type: integer
          minimum: 1
        msgIdType:
          type: string
          enum: [default, decimal, hexadecimal]
        http:
          $ref: "#/components/schemas/VendorHttpSettings"
        tps:
          type: integer
          minimum: 1
          maximum: 100000
        overflowBuffer:
          type: integer
          minimum: 0
        windowSize:
          type: integer
          minimum: 1
          maximum: 1000
        allowedDataCodings:
          type: array
          items:
            type: integer
            enum: [0, 1, 2, 3, 4, 5, 6, 7, 8, 13, 14]
        rerouteOn:
          type: array
          items:
            type: string
            enum: [EXPIRED, DELETED, UNDELIV, UNKNOWN, REJECTD]
        allowedSrcTon:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
        allowedDstTon:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
        allowedSrcNpi:
          type: array
          items:
            type: integer
            enum: [0, 1, 3, 4, 6, 8, 9, 10, 14, 18]
        allowedDstNpi:
          type: array
          items:
            type: integer
            enum: [0, 1, 3, 4, 6, 8, 9, 10, 14, 18]
        maxMsgLen:
          type: integer
          minimum: 1
          maximum: 2000
        supportMultipart:
          type: boolean
        dlrTimeoutS:
          type: integer
          minimum: 0
        dlrTimeoutStat:
          type: string
          enum: [DELIVRD, EXPIRED, UNDELIV, REJECTD, UNKNOWN]
        bindAddrTon:
          type: integer
          minimum: 0
          maximum: 6
        bindAddrNpi:
          type: integer
          minimum: 0
          maximum: 18
        bindAddrRange:
          type: [string, "null"]
          maxLength: 41
        costLimit:
          type: [number, "null"]
          minimum: 0
        costLimitPeriod:
          oneOf:
            - $ref: "#/components/schemas/LimitPeriod"
            - type: "null"


    VendorTrunkInput:
      description: Vendor trunk form (§5.5) with cost limit (§13.26).
      allOf:
        - $ref: "#/components/schemas/VendorTrunkFields"
      required: [enterpriseId, name, protocol, categoryId, billingType, status, bindType, username, host, port, maxConnections, tps]
      unevaluatedProperties: false

    VendorHttpSettings:
      type: object
      description: Generic HTTP-API adapter (§5.5), used when protocol is http.
      additionalProperties: false
      properties:
        url:
          type: [string, "null"]
          maxLength: 1000
        receiverPort:
          type: [integer, "null"]
        successRegex:
          type: [string, "null"]
        messageIdRegex:
          type: [string, "null"]
        callbackUrl:
          type: [string, "null"]
        callbackIntervalS:
          type: [integer, "null"]
        dlrStatusRegex:
          type: [string, "null"]
        dlrMidRegex:
          type: [string, "null"]
        dlrSuccessStats:
          type: [string, "null"]
        dlrFailStats:
          type: [string, "null"]
        extraHeaders:
          type: [string, "null"]
        postData:
          type: [string, "null"]
        callbackExtraHeaders:
          type: [string, "null"]
        callbackPostData:
          type: [string, "null"]

    VendorTrunkDetail:
      allOf:
        - $ref: "#/components/schemas/TrunkDetailCommon"
        - $ref: "#/components/schemas/VendorTrunkFields"
        - $ref: "#/components/schemas/Audit"
      required: [enterpriseId, name, protocol, categoryId, billingType, status, bindType, username, host, port, maxConnections, tps]

    CustomerTrunkSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/CustomerTrunkDetail"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    VendorTrunkSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/VendorTrunkDetail"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    # ------------------------------------------------------------- trunk rules (§13.2)
    TrunkRule:
      type: object
      required: [ruleId, kind, name, source, position, enabled, continueAfter, ruleActive, detail]
      properties:
        ruleId:
          $ref: "#/components/schemas/Id"
        kind:
          type: string
          enum: [translation, hlr]
        name:
          type: string
        source:
          type: object
          description: How the rule reaches this trunk.
          required: [type, label]
          properties:
            type:
              type: string
              enum: [trunk, enterprise, category, all]
            label:
              type: string
        position:
          type: [integer, "null"]
          description: Position set on this trunk; null = default order.
        enabled:
          type: boolean
          description: Off for this trunk only.
        continueAfter:
          type: boolean
        ruleActive:
          type: boolean
          description: The rule's own status; inactive rules do not run anywhere.
        detail:
          type: [string, "null"]
          description: Short summary, e.g. action and patterns, or the HLR provider and DNID pattern.

    TrunkRules:
      type: object
      required: [translation, hlr]
      properties:
        translation:
          type: array
          items:
            $ref: "#/components/schemas/TrunkRule"
        hlr:
          type: array
          description: Customer trunks only; empty for vendor trunks.
          items:
            $ref: "#/components/schemas/TrunkRule"

    TrunkRuleSetting:
      type: object
      required: [ruleId, enabled]
      additionalProperties: false
      properties:
        ruleId:
          $ref: "#/components/schemas/Id"
        enabled:
          type: boolean
        continueAfter:
          type: boolean

    TrunkRulesInput:
      type: object
      additionalProperties: false
      properties:
        translation:
          type: array
          description: The new order (positions 1..n) and on/off per rule.
          items:
            $ref: "#/components/schemas/TrunkRuleSetting"
        hlr:
          type: array
          items:
            $ref: "#/components/schemas/TrunkRuleSetting"
        detachTranslationRuleIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        detachHlrRuleIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"

    TrunkRulesSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/TrunkRules"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    # ------------------------------------------------------------- rate tables (§6.2, §13.12)
    RateTableRow:
      type: object
      required: [id, name, kind, categoryId, category, currency, vendorTrunkId, vendorTrunkName, trunkCount, activeLines, updatedAt, description, trunkNames, enterpriseNames, scheduledChanges, nextChangeAt, negativeMarginLines, avgMarginPct, moneyToday, updatedBy, archived]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        kind:
          type: string
          enum: [customer, vendor]
        categoryId:
          $ref: "#/components/schemas/Id"
        category:
          type: string
        currency:
          type: string
        vendorTrunkId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        vendorTrunkName:
          type: [string, "null"]
        trunkCount:
          type: integer
          description: Customer trunks using the table.
        activeLines:
          type: integer
          description: Lines valid now.
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        description:
          type: [string, "null"]
        trunkNames:
          type: array
          description: Up to five customer trunks using the table (§13.12 "trunks using it").
          items:
            type: string
        enterpriseNames:
          type: array
          description: Up to five clients using the table, or the vendor.
          items:
            type: string
        scheduledChanges:
          type: integer
          description: Lines starting later.
        nextChangeAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        negativeMarginLines:
          type: [integer, "null"]
          description: Current sell rates below the best buy rate; null for vendor tables.
        avgMarginPct:
          type: [number, "null"]
          description: Margin of today's traffic, weighted by volume; null without traffic or EDR store.
        moneyToday:
          type: [number, "null"]
          description: Today's revenue (customer table) or cost (vendor table) in the table currency.
        updatedBy:
          type: [string, "null"]
        archived:
          type: boolean

    RateTablePage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/RateTableRow"

    # ------------------------------------------------------------- Rate Manager (§13.12)
    RateTableInput:
      type: object
      description: New customer (sell) rate table (§6.2 Add form).
      required: [name, categoryId, currency]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        categoryId:
          $ref: "#/components/schemas/Id"
        currency:
          type: string
          minLength: 3
          maxLength: 3
        description:
          type: [string, "null"]
          maxLength: 500
        copyFrom:
          description: Copy Rate From Vendor Rate (§6.2) - the vendor trunk's current rates plus a margin.
          type: object
          required: [vendorTrunkId, marginPct]
          additionalProperties: false
          properties:
            vendorTrunkId:
              $ref: "#/components/schemas/Id"
            marginPct:
              type: number
              minimum: -50
              maximum: 500

    RateTableUpdate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
          maxLength: 500

    RateTableTrunk:
      type: object
      required: [id, name, kind, enterpriseId, enterpriseName, status]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        kind:
          type: string
          enum: [customer, vendor]
        enterpriseId:
          $ref: "#/components/schemas/Id"
        enterpriseName:
          type: string
        status:
          $ref: "#/components/schemas/RecordStatus"

    RateTableSummary:
      type: object
      description: Summary cards (§13.12). Traffic figures are null when the EDR store does not answer.
      required: [activeRates, countries, scheduledChanges, nextChangeAt, scheduledIncreases, closedLines, negativeMarginLines, avgMarginPct, moneyToday, messagesToday]
      properties:
        activeRates:
          type: integer
        countries:
          type: integer
        scheduledChanges:
          type: integer
        nextChangeAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        scheduledIncreases:
          type: integer
        closedLines:
          type: integer
        negativeMarginLines:
          type: [integer, "null"]
          description: Current sell rates below the best buy rate; null for vendor tables.
        avgMarginPct:
          type: [number, "null"]
          description: Margin of today's traffic priced by this table, weighted by volume.
        moneyToday:
          type: [number, "null"]
          description: Today's revenue (customer table) or cost (vendor table), in the table currency.
        messagesToday:
          type: [integer, "null"]

    RateTableDetail:
      allOf:
        - type: object
          required: [id, name, kind, categoryId, category, currency, description, vendorTrunkId, vendorTrunkName, trunks, lastImport, archived, summary]
          properties:
            id:
              $ref: "#/components/schemas/Id"
            name:
              type: string
            kind:
              type: string
              enum: [customer, vendor]
            categoryId:
              $ref: "#/components/schemas/Id"
            category:
              type: string
            currency:
              type: string
            description:
              type: [string, "null"]
            vendorTrunkId:
              oneOf:
                - $ref: "#/components/schemas/Id"
                - type: "null"
            vendorTrunkName:
              type: [string, "null"]
            trunks:
              type: array
              description: Customer trunks using the table, or the vendor trunk that owns it.
              items:
                $ref: "#/components/schemas/RateTableTrunk"
            lastImport:
              oneOf:
                - type: object
                  required: [at, by, fileName, operation, status]
                  properties:
                    at:
                      $ref: "#/components/schemas/Timestamp"
                    by:
                      type: [string, "null"]
                    fileName:
                      type: string
                    operation:
                      type: string
                    status:
                      type: string
                - type: "null"
            archived:
              $ref: "#/components/schemas/Archived"
            summary:
              $ref: "#/components/schemas/RateTableSummary"
        - $ref: "#/components/schemas/Audit"

    RateTableSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/RateTableDetail"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    RateLineRow:
      type: object
      required: [id, rateTableId, mccmncId, mccmnc, country, countryIso, network, dialCode, senderId, rate, sysRate, currency, bestBuy, bestVendorTrunkId, bestVendor, margin, marginPct, changeType, changePct, validFrom, validTo, statedValidFrom, nextRate, nextFrom, isBlocked, rateNote, updatedBy, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        rateTableId:
          $ref: "#/components/schemas/Id"
        mccmncId:
          $ref: "#/components/schemas/Id"
        mccmnc:
          type: string
          description: A 3-digit code is the country's All networks line (§6.1).
        country:
          type: string
        countryIso:
          type: string
        network:
          type: string
        dialCode:
          type: [string, "null"]
        senderId:
          type: [string, "null"]
        rate:
          type: number
        sysRate:
          type: number
          description: The rate in the base currency (USD).
        currency:
          type: string
        bestBuy:
          type: [number, "null"]
          description: Cheapest current vendor rate for the destination and product category, in the table currency.
        bestVendorTrunkId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        bestVendor:
          type: [string, "null"]
        margin:
          type: [number, "null"]
          description: rate - bestBuy (customer tables).
        marginPct:
          type: [number, "null"]
          description: margin / rate x 100.
        changeType:
          type: string
          enum: [new, same, increase, decrease, closed]
        changePct:
          type: [number, "null"]
          description: Change against the previous version, in %.
        validFrom:
          $ref: "#/components/schemas/Timestamp"
        validTo:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        statedValidFrom:
          description: The vendor RN's stated date when it was back-dated (§13.32).
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        nextRate:
          type: [number, "null"]
          description: The next scheduled rate of the destination, if any.
        nextFrom:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        isBlocked:
          type: boolean
        rateNote:
          type: [string, "null"]
        updatedBy:
          type: [string, "null"]
        updatedAt:
          $ref: "#/components/schemas/Timestamp"

    RateLinePage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/RateLineRow"

    RateLineEdit:
      type: object
      description: |
        One edit. `set`: a new rate from `effectiveFrom` for an existing line (`lineId`) or for a
        destination (`mccmnc`, optional `senderId`). `close`: end the line at `at` (default now; a
        scheduled line is removed). `block`: block or unblock the line (§6.2 IsBlock).
      required: [action]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [set, close, block]
        lineId:
          $ref: "#/components/schemas/Id"
        mccmnc:
          type: string
          pattern: "^[0-9]{3,6}$"
        senderId:
          type: [string, "null"]
          maxLength: 20
        rate:
          type: number
          minimum: 0
        effectiveFrom:
          $ref: "#/components/schemas/Timestamp"
        at:
          $ref: "#/components/schemas/Timestamp"
        blocked:
          type: boolean
        rateNote:
          type: [string, "null"]
          maxLength: 500

    RateLineChanges:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: "#/components/schemas/RateLineEdit"
        note:
          type: string
          maxLength: 500
        acceptNoticeBreach:
          type: boolean
          description: Apply increases that start sooner than a client's notice period (§13.14).

    RateLineChangesSaved:
      type: object
      required: [change, applied, skipped]
      properties:
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"
        applied:
          type: integer
          description: Edits that changed something.
        skipped:
          type: integer
          description: Edits that changed nothing (e.g. the same rate).

    NoticeBreach:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [breaches]
          properties:
            breaches:
              type: array
              items:
                type: object
                required: [mccmnc, currentRate, newRate, effectiveFrom, noticeDays, earliestAllowed, enterpriseName]
                properties:
                  mccmnc:
                    type: string
                  currentRate:
                    type: number
                  newRate:
                    type: number
                  effectiveFrom:
                    $ref: "#/components/schemas/Timestamp"
                  noticeDays:
                    type: integer
                  earliestAllowed:
                    $ref: "#/components/schemas/Timestamp"
                  enterpriseName:
                    type: string

    Destination:
      type: object
      required: [id, mccmnc, mcc, mnc, country, countryIso, network, allNetworks]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        mccmnc:
          type: string
        mcc:
          type: string
        mnc:
          type: string
        country:
          type: string
        countryIso:
          type: string
        network:
          type: string
        allNetworks:
          type: boolean

    DestinationPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/Destination"

    # ------------------------------------------------------------- Route rules (§6.3, §13.8–13.11, §13.24, §13.27, §15.4)
    TrafficWindow:
      type: string
      enum: [15m, 1h, 24h, 7d, 30d]
      description: Time frame for traffic figures (§13.27).

    CompareOp:
      type: string
      enum: [">", ">=", "=", "<=", "<", between]

    MatchMode:
      type: string
      enum: [all, inclusive, exclusive]
      description: All, only the listed ones (inclusive) or all but them (exclusive).

    TpsCondition:
      type: object
      description: Live TPS condition (§13.8).
      required: [op, value, scope]
      additionalProperties: false
      properties:
        op:
          $ref: "#/components/schemas/CompareOp"
        value:
          type: number
          minimum: 0
        value2:
          type: [number, "null"]
          description: Upper bound for between.
        tolerancePct:
          type: number
          minimum: 0
          maximum: 50
          description: "± margin for =, default 5 %."
        scope:
          type: string
          enum: [customer_trunk, customer_enterprise, destination, sender_id, rule]
        windowS:
          type: integer
          enum: [1, 5, 10, 60]
        holdS:
          type: integer
          minimum: 0
          maximum: 3600
          description: Must stay past the value this long before switching (hysteresis).
        releasePct:
          type: number
          minimum: 0
          maximum: 100
          description: Back past the value by this % before switching back.

    RevenueCondition:
      type: object
      description: Revenue condition (§13.9), base currency.
      required: [type, op, value]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [per_message, accumulated]
        op:
          $ref: "#/components/schemas/CompareOp"
        value:
          type: number
          minimum: 0
        value2:
          type: [number, "null"]
        scope:
          type: string
          enum: [customer_trunk, customer_enterprise, destination, sender_id, rule]
          description: Accumulated only.
        period:
          type: string
          enum: [15m, 60m, today, week, month, billing_cycle]
          description: Accumulated only.
        minMargin:
          type: [number, "null"]
          description: Also require at least this margin for the chosen vendor.
        minMarginUnit:
          type: string
          enum: [amount, percent]

    HlrAction:
      type: object
      description: Do HLR with a policy for the chosen customer trunks of the rule (§13.24); empty list = all of them.
      required: [policy, customerTrunkIds]
      additionalProperties: false
      properties:
        policy:
          type: string
          minLength: 1
          maxLength: 100
        customerTrunkIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"

    RouteVendor:
      type: object
      description: One vendor on a route level (§6.3) with an optional warm-up threshold (§13.27).
      required: [level, vendorTrunkId]
      additionalProperties: false
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 10
        vendorTrunkId:
          $ref: "#/components/schemas/Id"
        sharePct:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: Percentage hunt policy; shares of a level add up to 100.
        isBackup:
          type: boolean
        warmupCount:
          type: [integer, "null"]
          minimum: 1
          description: Send the first N messages to this vendor before the normal split.
        warmupReset:
          type: [string, "null"]
          enum: [hour, day, week, null]
        warmupPer:
          type: [string, "null"]
          enum: [rule, customer_trunk, null]

    RouteWhitelist:
      type: object
      description: Numbers pinned to one vendor of the rule (§13.27); checked before warm-up and split.
      required: [vendorTrunkId, numbers]
      additionalProperties: false
      properties:
        vendorTrunkId:
          $ref: "#/components/schemas/Id"
        numberListId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        numbers:
          type: array
          maxItems: 10000
          items:
            type: string
            pattern: "^[0-9]{5,15}$"

    RouteRuleFields:
      type: object
      description: Shared fields of the route rule form and record (§6.3 General Information and Route Information).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        priority:
          type: integer
          minimum: 1
          maximum: 100
          description: Evaluation order, low first.
        status:
          $ref: "#/components/schemas/RecordStatus"
        startsAt:
          $ref: "#/components/schemas/Timestamp"
        stopsAt:
          $ref: "#/components/schemas/Timestamp"
        groupId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        nextGroupId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        continueRouting:
          type: string
          enum: ["yes", stop, next]
          description: YES keeps evaluating, STOP ends, NEXT jumps to the next group.
        matchMode:
          type: string
          enum: [all, any]
          description: All conditions must match, or any one.
        comment:
          type: [string, "null"]
          maxLength: 1000
        categoryMode:
          $ref: "#/components/schemas/MatchMode"
        categoryIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        customerTrunkMode:
          $ref: "#/components/schemas/MatchMode"
        customerTrunkIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        mccmncMode:
          $ref: "#/components/schemas/MatchMode"
        mccmncs:
          type: array
          description: Codes; a 3-digit code is the whole country (§13.21).
          items:
            type: string
            pattern: "^[0-9]{3,6}$"
        mccmncPattern:
          type: [string, "null"]
          maxLength: 200
          description: Dynamic regular expression on the MCCMNC (§13.21).
        senderPattern:
          type: [string, "null"]
          maxLength: 200
        senderPatternNegate:
          type: boolean
        receiverPattern:
          type: [string, "null"]
          maxLength: 200
        receiverPatternNegate:
          type: boolean
        contentPattern:
          type: [string, "null"]
          maxLength: 200
        contentPatternNegate:
          type: boolean
        senderListId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        receiverListId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        tps:
          oneOf:
            - $ref: "#/components/schemas/TpsCondition"
            - type: "null"
        revenue:
          oneOf:
            - $ref: "#/components/schemas/RevenueCondition"
            - type: "null"
        hlrPorted:
          type: [boolean, "null"]
          description: Match only ported (true) or not-ported (false) numbers; null = either.
        routeType:
          type: string
          enum: [block, static, dynamic, qbr]
          description: Block, Static (fixed vendors), Dynamic (least cost) or QBR (quality).
        huntPolicy:
          type: string
          enum: [top_down, round_robin, percentage]
        enableBackupRoutes:
          type: boolean
        vendorCategoryMode:
          $ref: "#/components/schemas/MatchMode"
        vendorCategoryIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        vendorTrunkMode:
          $ref: "#/components/schemas/MatchMode"
        vendorTrunkIds:
          type: array
          description: Vendor scope of dynamic and QBR routing.
          items:
            $ref: "#/components/schemas/Id"
        maxRouteLevel:
          type: integer
          minimum: 1
          maximum: 10
        margin:
          type: number
          description: Margin (Flat) - vendors leaving less are skipped.
        qbrFormula:
          type: [string, "null"]
          maxLength: 500
        skipVendorAtTpsPct:
