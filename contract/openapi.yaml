    HlrLiveStatus:
      type: string
      enum: [up, slow, down, inactive]
      description: "From the last 24 hours: down = success under 50 % (or no answer), slow = average response over 80 % of the timeout, inactive = switched off."

    HlrResponseMapping:
      type: object
      additionalProperties: false
      description: Where each value is found in the provider's response (§6.5 response-mapping captions); a JSON path or a field name. Null = not provided.
      required: [mcc, mnc, mccmnc, oldMcc, oldMnc, oldMccmnc, ported, errorCode, errorString, successCodes, numberCheck, dnidScore]
      properties:
        mcc:
          type: string
          minLength: 1
          maxLength: 100
        mnc:
          type: string
          minLength: 1
          maxLength: 100
        mccmnc:
          type: string
          minLength: 1
          maxLength: 100
        oldMcc:
          type: [string, "null"]
          maxLength: 100
        oldMnc:
          type: [string, "null"]
          maxLength: 100
        oldMccmnc:
          type: [string, "null"]
          maxLength: 100
        ported:
          type: [string, "null"]
          maxLength: 100
        errorCode:
          type: [string, "null"]
          maxLength: 100
        errorString:
          type: [string, "null"]
          maxLength: 100
        successCodes:
          type: [string, "null"]
          maxLength: 200
          description: Comma-separated codes that mean a successful lookup, e.g. "0,1".
        numberCheck:
          type: [string, "null"]
          maxLength: 100
        dnidScore:
          type: [string, "null"]
          maxLength: 100

