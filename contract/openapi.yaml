    post:
      tags: [finance]
      operationId: previewVendorInvoiceEmail
      summary: "Preview the acceptance or rejection e-mail"
      description: |
        Recipients (the partner's billing contacts), subject and body with invoice number, period, amounts
        and, for a rejection, the note and our figures.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInvoiceEmailInput"
      responses:
        "200":
          description: The e-mail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /vendor-invoices/{id}/dependencies:
    get:
      tags: [finance]
      operationId: getVendorInvoiceDependencies
      summary: "What depends on a vendor invoice (safe delete, §13.29)"
      description: |
        An accepted invoice counts in the partner's balance and SOA, which blocks deleting it.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Dependencies and whether they block archiving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dependencies"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /vendor-invoices/{id}/archive:
    post:
      tags: [finance]
      operationId: archiveVendorInvoice
      summary: "Delete (archive) a vendor invoice (§13.29)"
      description: |
        Blocked while accepted (409) unless an administrator overrides with a reason. One undoable change.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveRequest"
      responses:
        "200":
          description: Archived, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorInvoiceSaved"
