      type: object
      required: [id, name, priority, routeType, status, categoryLabel, customerTrunksLabel, customerTrunkNames, customerTrunkCount, destinationLabel, vendorsLabel, messages, asr, dlr, dlrTarget, dlrTargetSource, margin, startsAt, stopsAt, groupName, updatedBy, updatedAt, archived]
      properties:
