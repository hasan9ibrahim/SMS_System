      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/HlrProviderRate"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    HlrTargetInput:
      type: object
      additionalProperties: false
      required: [type, id]
      description: What an HLR rule applies to (customer trunks only, §13.24).
      properties:
        type:
          type: string
          enum: [trunk, enterprise, category, all]
        id:
          description: Customer trunk, enterprise or product category ID; null for all.
