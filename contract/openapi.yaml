          type: integer
          minimum: 0
          maximum: 6
        sourceNpi:
          type: integer
          minimum: 0
          maximum: 18
        destTon:
          type: integer
          minimum: 0
          maximum: 6
        destNpi:
          type: integer
          minimum: 0
          maximum: 18
