            - type: "null"

    HlrRuleRow:
      type: object
      required: [id, name, providerId, provider, providerType, dnidPattern, status, appliesTo, usedBy, updatedBy, updatedAt, archivedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        providerId:
          $ref: "#/components/schemas/Id"
        provider:
          type: string
        providerType:
          $ref: "#/components/schemas/HlrProviderType"
        dnidPattern:
          type: string
        status:
          $ref: "#/components/schemas/RecordStatus"
        appliesTo:
          type: string
        usedBy:
          type: integer
        updatedBy:
          type: [string, "null"]
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        archivedAt:
          type: [string, "null"]
          format: date-time

    HlrRulePage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/HlrRuleRow"

    HlrPolicyEntry:
      type: object
      additionalProperties: false
      required: [code, mode, providerIds, minSuccessPct, cacheHoursPorted, cacheHoursNotPorted]
      description: One destination of a policy (§13.24).
      properties:
        code:
          type: [string, "null"]
          pattern: "^[0-9]{3,6}$"
          description: MCCMNC code, or a 3-digit MCC for the whole country; null = every other destination.
        mode:
          type: string
          enum: [ordered, auto]
          description: "ordered: try the providers in order, the next on error or timeout; auto: the cheapest provider meeting minSuccessPct first, then the others by price."
        providerIds:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/Id"
        minSuccessPct:
          type: [number, "null"]
          minimum: 0
          maximum: 100
          description: auto only.
        cacheHoursPorted:
          type: integer
          minimum: 0
          maximum: 720
          description: How long a "ported" answer is reused (cached lookups are free and instant).
        cacheHoursNotPorted:
          type: integer
          minimum: 0
          maximum: 720

    HlrPolicyFields:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: "#/components/schemas/RecordStatus"
        entries:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/HlrPolicyEntry"

    HlrPolicyInput:
      allOf:
        - $ref: "#/components/schemas/HlrPolicyFields"
      required: [name, status, entries]
      unevaluatedProperties: false

    HlrPolicyDetail:
      allOf:
        - $ref: "#/components/schemas/HlrPolicyFields"
        - type: object
          required: [id, providers, usedBy, updatedBy, updatedAt, archivedAt]
          properties:
            id:
              $ref: "#/components/schemas/Id"
            providers:
              type: array
              description: Names of the providers the entries use.
              items:
                $ref: "#/components/schemas/Named"
            usedBy:
              type: integer
              description: Live route rules whose HLR action uses the policy.
            updatedBy:
              type: [string, "null"]
            updatedAt:
              $ref: "#/components/schemas/Timestamp"
            archivedAt:
              type: [string, "null"]
              format: date-time
      required: [name, status, entries]

    HlrPolicySaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/HlrPolicyDetail"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    HlrPolicyRow:
      type: object
      required: [id, name, status, destinations, hasCatchAll, providerNames, usedBy, updatedBy, updatedAt, archivedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        status:
          $ref: "#/components/schemas/RecordStatus"
        destinations:
          type: integer
          description: Entries with a code.
        hasCatchAll:
          type: boolean
        providerNames:
          type: string
        usedBy:
          type: integer
        updatedBy:
          type: [string, "null"]
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        archivedAt:
          type: [string, "null"]
          format: date-time

    HlrPolicyPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/HlrPolicyRow"

    HlrPolicyTestInput:
      type: object
      additionalProperties: false
      required: [receiver]
      properties:
        receiver:
          type: string
          pattern: "^\\+?[0-9]{5,15}$"

    HlrPolicyTestResult:
      type: object
      required: [mccmnc, destination, entry, providers]
      properties:
        mccmnc:
          type: [string, "null"]
        destination:
          type: [string, "null"]
        entry:
          description: The entry that applies; null = the policy has none for this number (no HLR).
          oneOf:
            - $ref: "#/components/schemas/HlrPolicyEntry"
            - type: "null"
        providers:
          type: array
          description: In the order they would be tried.
          items:
            type: object
            required: [providerId, name, rate, currency, successPct, liveStatus, skipped]
            properties:
              providerId:
                $ref: "#/components/schemas/Id"
              name:
                type: string
              rate:
                type: number
                description: Price per live lookup for this destination.
              currency:
                type: string
              successPct:
                type: [number, "null"]
              liveStatus:
                $ref: "#/components/schemas/HlrLiveStatus"
              skipped:
                type: [string, "null"]
                description: Why the provider would be skipped (inactive, down, under the minimum success rate), else null.

    # ------------------------------------------------------------- Finance (§7, §13.33)
    PaymentMode:
      type: string
      enum: [cash, cheque, bank_transfer, paypal, credit_card, debit_card, wire_transfer, crypto]

    TransactionType:
      type: string
      enum: [receipt, adjustment, dispute, credit_note, bank_charges, bill_payment, reprocess]
      description: reprocess = posted by a re-rating request (§12.2), not entered by hand.

    TransactionInput:
      type: object
      additionalProperties: false
      required: [side, enterpriseId, invoiceId, paymentMode, transactionType, paymentType, paymentDate, amount, currency, description, sendConfirmation, includeInSoa, excludeReason]
      properties:
        side:
          type: string
          enum: [customer, vendor]
          description: Enterprise Type.
        enterpriseId:
          $ref: "#/components/schemas/Id"
        invoiceId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        paymentMode:
          description: Mode of Payment; required except for reprocess notes.
          oneOf:
            - $ref: "#/components/schemas/PaymentMode"
            - type: "null"
        transactionType:
          $ref: "#/components/schemas/TransactionType"
        paymentType:
          type: string
          enum: [credit, debit]
        paymentDate:
          type: string
          format: date
        amount:
          type: number
          exclusiveMinimum: 0
          maximum: 100000000
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Source Currency.
        description:
          type: [string, "null"]
          maxLength: 500
        sendConfirmation:
          type: boolean
          description: Send the payment confirmation on save (§13.33); default from the partner's billing settings.
        includeInSoa:
          type: boolean
        excludeReason:
          type: [string, "null"]
          maxLength: 300
          description: Required when includeInSoa is false.

    TransactionRow:
      type: object
      required: [id, side, enterpriseId, enterprise, paymentMode, paymentType, transactionType, amount, currency, amountBase, baseCurrency, paymentDate, transactionTime, invoiceId, invoiceNumber, description, sendConfirmation, confirmationStatus, includeInSoa, excludeReason, updatedBy, updatedAt, archivedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        side:
          type: string
          enum: [customer, vendor]
        enterpriseId:
          $ref: "#/components/schemas/Id"
        enterprise:
          type: string
        paymentMode:
          oneOf:
            - $ref: "#/components/schemas/PaymentMode"
            - type: "null"
        paymentType:
          type: string
          enum: [credit, debit]
        transactionType:
          $ref: "#/components/schemas/TransactionType"
        amount:
          type: [number, "null"]
        currency:
          type: string
        amountBase:
          type: [number, "null"]
          description: Final Amount in the business company base currency at the payment date.
        baseCurrency:
          type: string
        paymentDate:
          type: string
          format: date
        transactionTime:
          $ref: "#/components/schemas/Timestamp"
        invoiceId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        invoiceNumber:
          type: [string, "null"]
        description:
          type: [string, "null"]
        sendConfirmation:
          type: boolean
        confirmationStatus:
          type: string
          enum: [sent, not_sent, failed]
        includeInSoa:
          type: boolean
        excludeReason:
          type: [string, "null"]
        updatedBy:
          type: [string, "null"]
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        archivedAt:
          type: [string, "null"]
          format: date-time

    TransactionPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/TransactionRow"

    TransactionDetail:
      allOf:
        - $ref: "#/components/schemas/TransactionRow"
        - type: object
          required: [exRate, confirmationSentAt, confirmationRecipients, createdBy]
          properties:
            exRate:
              type: number
              description: Base currency units per unit of the source currency.
            confirmationSentAt:
              type: [string, "null"]
              format: date-time
            confirmationRecipients:
              type: array
              items:
                type: string
            createdBy:
              type: [string, "null"]

    TransactionSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/TransactionDetail"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    ConfirmationPreview:
      type: object
      required: [recipients, subject, body, balanceAfter, currency]
      properties:
        recipients:
          type: array
          items:
            type: string
          description: The partner's billing contacts; empty = nobody to send to.
        subject:
          type: string
        body:
          type: string
        balanceAfter:
          type: number
          description: The side's balance after this payment, in the billing currency.
        currency:
          type: string

    TransactionBulkInput:
      type: object
      additionalProperties: false
      required: [ids, action]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: "#/components/schemas/Id"
        action:
          type: string
          enum: [include_in_soa, exclude_from_soa, send_confirmation]
        reason:
          type: [string, "null"]
          maxLength: 300
          description: Required for exclude_from_soa.

    ConvertInput:
      type: object
      additionalProperties: false
      required: [enterpriseId, amount, currency, date]
      properties:
        enterpriseId:
          $ref: "#/components/schemas/Id"
        amount:
          type: number
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        date:
          type: string
          format: date

    ConvertResult:
      type: object
      required: [baseCurrency, exRate, amountBase]
      properties:
        baseCurrency:
          type: string
        exRate:
          type: number
        amountBase:
          type: number

    CurrencyRow:
      type: object
