    CurrencyRateSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/CurrencyRateRow"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    CurrencySyncResult:
      type: object
      required: [updated, change]
      properties:
