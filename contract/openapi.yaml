        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /mo-numbers/{id}/restore:
    post:
      tags: [reference]
      operationId: restoreMoNumber
