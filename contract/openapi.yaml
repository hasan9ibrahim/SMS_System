      tags: [observation]
      operationId: sendTroubleTicket
      summary: "Trouble Ticket: e-mail selected EDRs to a partner (§9.1)"
      description: |
        Ticket Send To (Customer / Vendor), Vendor Trunk (vendor tickets), Trouble Ticket Template, Email Subject,
        Attachment, Email Columns. The EDRs go in the body and as a CSV attachment; logged in Email Logs (type
        trouble_ticket).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TroubleTicketInput"
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TroubleTicketResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /edrs/repush:
    post:
      tags: [observation]
      operationId: repushEdrs
      summary: "EDR Repush: re-send selected EDRs to another vendor trunk (§9.1)"
      description: |
        Creates a Repush Request. Each message is sent again on the chosen vendor trunk as a new attempt that carries
        the request ID (`repushRequestId`), so the new attempts show in EDR Search. Only final attempts of messages that
        were not delivered can be repushed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepushInput"
      responses:
        "201":
          description: The repush request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepushRequestRow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /repush-requests/query:
    post:
      tags: [observation]
      operationId: queryRepushRequests
      summary: "List repush requests (server-side filter, sort and paging)"
      description: |
        Repush Request (§9.2): Info ID, Total EDR Count, vendor trunk, outcome, Created By, Created Time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: One page of repush requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepushRequestPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /edr-templates/query:
    post:
      tags: [observation]
      operationId: queryEdrTemplates
      summary: "List EDR templates (server-side filter, sort and paging)"
      description: |
        EDR Template (§9.2): Info ID, Name, columns, Updated By / Time. A template is a saved EDR column set used by EDR
        Search, EDR Download and Trouble Ticket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: One page of EDR templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdrTemplatePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /edr-templates:
    post:
      tags: [observation]
      operationId: createEdrTemplate
      summary: "Add an EDR template"
      description: |
        Name and Column Selection (any EDR column). One undoable change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdrTemplateInput"
      responses:
        "201":
          description: Created, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdrTemplateSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /edr-templates/{id}:
    get:
      tags: [observation]
      operationId: getEdrTemplate
      summary: "One EDR template"
      description: |
        Name and columns.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: The template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdrTemplateRow"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [observation]
      operationId: updateEdrTemplate
      summary: "Change an EDR template"
      description: |
        One undoable change.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdrTemplateInput"
      responses:
        "200":
          description: Saved, with the change (null when nothing differed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdrTemplateSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /edr-templates/{id}/archive:
    post:
      tags: [observation]
      operationId: archiveEdrTemplate
      summary: "Delete (archive) an EDR template (§13.29)"
      description: |
        Downloads already requested keep their columns. One undoable change.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveRequest"
      responses:
        "200":
          description: Archived, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdrTemplateSaved"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /edr-templates/{id}/restore:
    post:
      tags: [observation]
      operationId: restoreEdrTemplate
      summary: "Restore an EDR template"
      description: |
        One undoable change.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Restored, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdrTemplateSaved"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /edr-downloads:
    post:
      tags: [observation]
      operationId: requestEdrDownload
      summary: "EDR Request / Failed EDR Request: queue a background export (§9.2, §12.4)"
      description: |
        The EDR Search (or Failed EDR Search) filters, Download FileType (csv / xlsx) and the EDR Template or an explicit
        column list. Runs in the background: pending, inprogress (with progress), success, failed or cancelled. At most
        1,000,000 rows (xlsx: 1,048,575).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdrDownloadInput"
      responses:
        "201":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdrDownloadRow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /edr-downloads/query:
    post:
      tags: [observation]
      operationId: queryEdrDownloads
      summary: "List EDR downloads (server-side filter, sort and paging)"
      description: |
        EDR Download and Failed EDR Download (§9.2): EDR No, Status, File, File Type, Progress, Request Start / End Time,
        Error, Requested By. Filter `kind` eq edr or failed_edr.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: One page of EDR downloads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdrDownloadPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /edr-downloads/{id}/cancel:
    post:
      tags: [observation]
      operationId: cancelEdrDownload
      summary: "Cancel a pending or running download"
      description: |
        Finished downloads cannot be cancelled (409).
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdrDownloadRow"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /edr-downloads/{id}/file:
    get:
      tags: [observation]
      operationId: downloadEdrFile
      summary: "The exported file"
      description: |
        CSV (UTF-8, header row) or xlsx (Excel 2003 XML spreadsheet, .xls).
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: The file
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.ms-excel:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /failed-edrs/query:
    post:
      tags: [observation]
      operationId: queryFailedEdrs
      summary: "List failed EDRs (server-side filter, sort and paging)"
      description: |
