              - type: string
                format: ipv6
        username:
          type: string
          minLength: 1
          maxLength: 16
          description: SMPP system_id.
        password:
          type: string
          minLength: 1
          maxLength: 9
          writeOnly: true
          description: SMPP password (system_id max 16, password max 9 characters in SMPP v3.4). Required on create; omit to keep.
        maxConnections:
          type: integer
          minimum: 1
          maximum: 10
        systemType:
          type: [string, "null"]
          maxLength: 13
        port:
          type: integer
          minimum: 1
          maximum: 65535
        sslType:
          $ref: "#/components/schemas/SslType"
        dlrPushUrl:
          type: [string, "null"]
          maxLength: 500
        moPushUrl:
          type: [string, "null"]
          maxLength: 500
        delayedSubmit:
          type: boolean
        sendBind:
          type: boolean
        dlrSessionAffinity:
          type: string
          enum: [strict, same_ip, same_trunk]
          description: Where receipts go when the submitting session is gone (§13.1).
        dlrHoldHours:
          type: integer
          minimum: 0
          maximum: 720
        tps:
          type: integer
          minimum: 1
          maximum: 100000
        overflowBuffer:
