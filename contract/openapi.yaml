              properties:
                customerTrunks:
                  type: array
                  items:
                    $ref: "#/components/schemas/Named"
                categories:
                  type: array
                  items:
                    $ref: "#/components/schemas/Named"
                vendorTrunks:
                  type: array
                  items:
                    $ref: "#/components/schemas/Named"
                numberLists:
                  type: array
                  items:
                    $ref: "#/components/schemas/Named"
                groups:
                  type: array
                  items:
                    $ref: "#/components/schemas/Named"
            archived:
              $ref: "#/components/schemas/Archived"
        - $ref: "#/components/schemas/Audit"

