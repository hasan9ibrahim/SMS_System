      description: Info, Warning, Critical - each with its own colour and sound (§13.6).
    AlertMetric:
      type: string
      enum:
      - attempts
      - submitted
      - delivered
      - tps
      - asr
      - dlr
      - margin
      - margin_pct
      - revenue
      - avg_delivery_delay
      - bind_status
      description: Volume (attempts, submitted, delivered), TPS, ASR %, DLR %, margin (amount, %), revenue, average delivery delay (s), bind status.
    AlertScope:
      type: object
      additionalProperties: false
      required:
      - kind
      - ids
      - values
      properties:
        kind:
          type: string
          enum:
          - all
          - customer
          - customer_trunk
          - vendor
          - vendor_trunk
          - country
          - mccmnc
          - sender_id
          - product_category
          description: all = every customer trunk together. customer / vendor are enterprises.
        ids:
          type: array
          items: &id002
            $ref: '#/components/schemas/Id'
          maxItems: 200
          uniqueItems: true
          description: Enterprise or trunk IDs (customer, customer_trunk, vendor, vendor_trunk, product_category); empty = each one with traffic.
        values:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 40
          maxItems: 200
          uniqueItems: true
          description: Country ISO codes, MCCMNC codes or sender IDs (country, mccmnc, sender_id).
    AlertCondition:
      type: object
      additionalProperties: false
      required:
      - type
      - value
      - baseline
      properties:
        type:
          type: string
          enum:
          - above
          - below
          - increase_pct
          - decrease_pct
          - started
          - stopped
          - bind_down
          description: Above / below a fixed value; increase / decrease by X % against a baseline; started sending; stopped sending (no traffic for the window); a bind of the scope is down.
        value:
          type:
          - number
          - 'null'
          description: The fixed value or the % change; null for started / stopped / bind_down.
        baseline:
          type:
          - string
          - 'null'
          enum:
          - previous_window
          - yesterday
          - last_week
          - null
          description: 'For increase / decrease: the previous window, the same time yesterday or the same weekday last week.'
    AlertActiveHours:
      type: object
      additionalProperties: false
      required:
      - always
      - days
      - fromHour
      - toHour
      properties:
        always: &id001
          type: boolean
        days:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          maxItems: 7
          uniqueItems: true
          description: 0 = Sunday.
        fromHour:
          type: integer
          minimum: 0
          maximum: 23
        toHour:
          type: integer
          minimum: 1
          maximum: 24
          description: Exclusive; UTC.
    AlertChannels:
      type: object
      additionalProperties: false
      required:
      - popup
      - sound
      - email
      properties:
        popup: *id001
        sound: *id001
        email: *id001
    AlertRuleFields:
      type: object
      required:
      - name
      - status
      - description
      - scope
      - metric
      - condition
      - windowMinutes
      - minSample
      - activeHours
      - severity
      - notifyUserIds
      - notifyDepartmentIds
      - channels
      - emailAddresses
      - partnerContactType
      - repeatMinutes
      - cooldownMinutes
      - recoveryNotice
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: '#/components/schemas/RecordStatus'
        description:
          type:
          - string
          - 'null'
          maxLength: 500
        scope:
          $ref: '#/components/schemas/AlertScope'
        metric:
          $ref: '#/components/schemas/AlertMetric'
        condition:
          $ref: '#/components/schemas/AlertCondition'
        windowMinutes:
          type: integer
          enum:
          - 1
          - 5
          - 15
          - 30
          - 60
        minSample:
          type: integer
          minimum: 0
          maximum: 10000000
          description: Evaluate only with at least this many messages in the window.
        activeHours:
          $ref: '#/components/schemas/AlertActiveHours'
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        notifyUserIds:
          type: array
          items: *id002
          maxItems: 200
          uniqueItems: true
        notifyDepartmentIds:
          type: array
          items: *id002
          maxItems: 50
          uniqueItems: true
          description: Users and departments notified in the GUI; both empty = everyone.
        channels:
          $ref: '#/components/schemas/AlertChannels'
        emailAddresses:
          type: array
          items:
            type: string
            maxLength: 200
            format: email
          maxItems: 50
          description: Extra recipients besides the notified users (§13.7).
        partnerContactType:
          type:
          - string
          - 'null'
          enum:
          - commercial
          - technical
          - rates
          - finance
          - null
          description: Also e-mail this contact type of the partner the incident is about (partner-facing alerts).
        repeatMinutes:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 1440
          description: Re-alert while the condition lasts; null = once.
        cooldownMinutes:
          type: integer
          minimum: 0
          maximum: 1440
          description: Quiet period after recovery.
        recoveryNotice:
          type: boolean
          description: Send an OK notice when the metric is back to normal.
    AlertRuleInput:
      allOf:
      - $ref: '#/components/schemas/AlertRuleFields'
