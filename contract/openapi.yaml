        enterprise, enterprise type, billing type, status, error and remarks. Auto invoicing adds one
        request per enterprise at the end of each billing cycle (§7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: One page of invoice requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceRequestPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /invoice-requests:
    post:
      tags: [finance]
      operationId: createInvoiceRequest
      summary: "Generate Request (§12.3 /invoices/manualrequest)"
      description: |
        One request per enterprise, run in the background: pending, inprogress, then completed (with the
        invoice) or failed (with the error). Traffic invoices take usage from the EDR store for the period in
        the chosen time zone; proforma invoices take the amount and volume given. An enterprise already
        invoiced for an overlapping period fails with the invoice number (use Regenerate).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceRequestInput"
      responses:
        "202":
          description: The requests, pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceRequestCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /invoice-requests/{id}:
    get:
      tags: [finance]
      operationId: getInvoiceRequest
      summary: "One invoice request (poll for its status)"
      description: |
        Status, error and the invoice it made.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: The request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceRequestRow"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /vendor-invoices/query:
