            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceCharges"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /invoices/{id}/pdf:
    get:
      tags: [finance]
      operationId: downloadInvoicePdf
      summary: "Download the invoice PDF (§7 PDF column)"
      description: |
        Made from the invoice and the business company's details. Saved as {invoiceNumber}.pdf.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: The invoice as PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /invoices/{id}/regenerate:
    post:
      tags: [finance]
      operationId: regenerateInvoice
      summary: "Regenerate an invoice (per-row action)"
      description: |
        Starts an invoice request that recomputes usage, balances and due amount for the same enterprise,
        period and number. Runs in the background like Generate Request; the invoice shows Inprogress until
        it is done. Not for invoices with payments linked.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "202":
          description: The request, pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceRequestRow"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /invoices/send:
    post:
      tags: [finance]
      operationId: sendInvoices
      summary: "Send Invoice: e-mail invoices to the partners' billing contacts"
      description: |
        Uses the business company's Invoice e-mail template and attaches the PDF (the mock records it as
        sent). Invoices that are not completed or whose partner has no billing contact are skipped and
        listed. One undoable change of the e-mail status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceIdsInput"
      responses:
        "200":
          description: What was sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceSendResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /invoices/mark:
    post:
      tags: [finance]
      operationId: markInvoices
      summary: "Mark: set payment or e-mail status of many invoices (§7)"
      description: |
        One undoable change for all of them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceMarkInput"
      responses:
        "200":
          description: The change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /invoices/{id}/dependencies:
    get:
      tags: [finance]
      operationId: getInvoiceDependencies
      summary: "What depends on an invoice (safe delete, §13.29)"
      description: |
        Payments linked to the invoice block deleting it; a sent invoice is reported but does not block.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Dependencies and whether they block archiving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dependencies"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /invoices/{id}/archive:
    post:
      tags: [finance]
      operationId: archiveInvoice
      summary: "Delete (archive) an invoice (§13.29)"
      description: |
        The invoice leaves balances and lists; it is never removed. Blocked while payments are linked (409)
        unless an administrator overrides with a reason. One undoable change.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveRequest"
      responses:
        "200":
          description: Archived, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceSaved"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Blocked by dependencies that must be settled first
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ArchiveBlocked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /invoices/{id}/restore:
