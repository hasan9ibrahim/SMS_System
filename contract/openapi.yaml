        symbol:
          type: string
          minLength: 1
          maxLength: 8

    CurrencyInput:
      type: object
      additionalProperties: false
      required: [name, symbol, iso, ratePerUsd]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        symbol:
          type: string
          minLength: 1
          maxLength: 8
        iso:
          type: string
          pattern: "^[A-Z]{3}$"
        ratePerUsd:
          type: number
          exclusiveMinimum: 0
          description: First exchange rate, units per 1 USD.

    CurrencySaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/CurrencyRow"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    CurrencyRateRow:
      type: object
      required: [id, iso, currency, ratePerUsd, validFrom, updatedBy, previousRate]
      properties:
        id:
          $ref: "#/components/schemas/Id"
          description: The currency's ID (one row per currency).
        iso:
          type: string
        currency:
          type: string
        ratePerUsd:
          type: number
          description: Units of the currency per 1 USD (USD = 1).
        validFrom:
          type: [string, "null"]
          format: date-time
        updatedBy:
          type: [string, "null"]
          description: Null = market feed or seed data.
        previousRate:
          type: [number, "null"]

    CurrencyRatePage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/CurrencyRateRow"

    CurrencyRateInput:
