        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /mo-numbers/import:
    post:
      tags: [reference]
      operationId: importMoNumbers
      summary: "Import MO reference book entries from CSV (dry run first)"
      description: |
        "MO Reference Book Import" (§6.1). Columns: `customer_trunk` (name), `number`, `keyword`, `rate`,
        `vendor_rate`, `mccmnc`, `setup_charge`, `fix_charge`. Amounts are in the customer trunk's currency; an
        optional `currency` column must match it.
        Rows are matched by number + keyword. `replace` archives entries missing from the file. All or
        nothing; one undoable change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "200":
          description: What the import adds, changes and reports; `applied` says whether it was saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /mo-numbers/export:
    post:
      tags: [reference]
      operationId: exportMoNumbers
      summary: "Export the filtered MO reference book entries as CSV"
      description: |
        Same filter, search and sort as the grid; every matching row. The file can be imported again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: CSV file, UTF-8, header row
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /route-map/query:
    post:
      tags: [routing]
      operationId: queryRouteMap
      summary: "Route map of a customer trunk (server-side filter, sort and paging)"
      description: |
        Which rule and vendor each destination the trunk sells gets today (§6.3 Route map, scope decided
        2026-10-17): every destination with a sell rate in the trunk's rate tables, run through the
        live route rules in order as a message without receiver or content (steady state: no warm-up, no
        number whitelists). The `customerTrunkId` filter (eq) is required. Filter, sort and paging work on
        every column, including the routed vendor, cost and margin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: One page of destinations with their route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteMapPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /route-map/export:
    post:
      tags: [routing]
      operationId: exportRouteMap
      summary: "Export a trunk's route map as CSV"
      description: |
        Same filter (with `customerTrunkId`), search and sort as the grid; every matching row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: CSV file, UTF-8, header row
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rerating-requests/query:
    post:
      tags: [routing]
      operationId: queryReratingRequests
      summary: "List re-rating requests (server-side filter, sort and paging)"
      description: |
        Re-Rating (§6.3, §12.2): requests to recompute charges on past EDRs after a rate correction, with
        their request status (maker-checker) and reprocess status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: One page of re-rating requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReratingRequestPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rerating-requests/preview:
    post:
      tags: [routing]
      operationId: previewRerating
      summary: "Estimate a re-rating before requesting it"
      description: |
        Runs the computation without saving: EDRs in scope and the difference per enterprise between the
        billed amount and the amount at the rate table's rates valid at send time (a back-dated line counts
        from its stated date, §13.32).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReratingInput"
      responses:
        "200":
          description: The estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReratingPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rerating-requests:
    post:
      tags: [routing]
      operationId: createReratingRequest
      summary: "Request a re-rating (§12.2 Re-Rating Request)"
      description: |
        Saved as Pending Approval. Another user approves or declines it (maker-checker); nothing is
        re-rated before that. One undoable change while pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReratingInput"
      responses:
        "201":
          description: Created, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReratingSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rerating-requests/{id}:
    get:
      tags: [routing]
      operationId: getReratingRequest
      summary: "One re-rating request with its summary (§12.2 Re-Rating view)"
      description: |
        The request fields, statuses and times, and the Re-Rating Summary per enterprise.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: The request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReratingDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [routing]
      operationId: updateReratingRequest
      summary: "Change a pending re-rating request"
      description: |
        Only the requester, and only while it is Pending Approval (409 otherwise). One undoable change.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReratingInput"
      responses:
        "200":
          description: Saved, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReratingSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rerating-requests/{id}/approve:
    post:
      tags: [routing]
      operationId: approveReratingRequest
      summary: "Approve a re-rating request (checker)"
      description: |
        Another user than the requester (403 otherwise). The request is queued and processed in the
        background: In Queue, In Process, then Completed (or Failed). Unless `noNote` is set, each
        enterprise with a difference gets a credit or debit note in Transactions (type Reprocess). EDRs
        keep the amounts they were billed at (§13.29).
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Approved, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReratingSaved"
