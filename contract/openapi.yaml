          type: string

    RouteCandidate:
      type: object
      required: [vendorTrunkId, name, level, cost, margin, note]
      properties:
        vendorTrunkId:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        level:
          type: integer
        cost:
          type: [number, "null"]
          description: Buy rate for the destination in the platform currency.
        margin:
          type: [number, "null"]
        note:
          type: [string, "null"]

    RouteDecision:
      type: object
      required: [ruleId, matched, checks, outcome, vendor, candidates, mccmnc, destination, sellRate]
      properties:
        ruleId:
          $ref: "#/components/schemas/Id"
        matched:
          type: boolean
        checks:
          type: array
          items:
            $ref: "#/components/schemas/RouteCheck"
        outcome:
          type: string
          enum: [route, block, no_vendor, not_matched]
        vendor:
          oneOf:
            - type: object
              required: [vendorTrunkId, name, level, decidedBy]
              properties:
                vendorTrunkId:
                  $ref: "#/components/schemas/Id"
                name:
                  type: string
                level:
                  type: integer
                decidedBy:
                  type: string
                  enum: [whitelist, warmup, percentage, top_down, round_robin, lcr, qbr]
            - type: "null"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/RouteCandidate"
        mccmnc:
          type: [string, "null"]
        destination:
          type: [string, "null"]
          description: Country · network of the destination.
        sellRate:
          type: [number, "null"]
