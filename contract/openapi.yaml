            id:
              $ref: "#/components/schemas/Id"
            targets:
              type: array
              items:
                $ref: "#/components/schemas/TranslationTarget"
            usedBy:
              type: integer
              description: Trunks the rule touches.
            createdBy:
              type: [string, "null"]
            updatedBy:
              type: [string, "null"]
            updatedAt:
              $ref: "#/components/schemas/Timestamp"
            archivedAt:
              type: [string, "null"]
              format: date-time
      required: [name, direction, action, status, continueAfter, senderPattern, senderPatternNegate, receiverPattern, receiverPatternNegate, mccmncs, mccmncNegate, contentPattern, contentPatternNegate, senderListId, senderListNegate, receiverListId, receiverListNegate, senderConversion, senderConversionValue, senderConversionReplacement, senderConversionListId, receiverConversion, receiverConversionValue, receiverConversionReplacement, senderTon, senderNpi, destTon, destNpi, billingType, registeredDelivery, dlrMap, contentRegex, contentRegexIndex, contentReplacement, msgTemplate, senderMinLength, senderMaxLength, receiverMinLength, receiverMaxLength, startsAt, stopsAt, insertAt]

