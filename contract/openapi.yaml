      properties:
        ratePerUsd:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000

    CurrencyRateSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/CurrencyRateRow"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    CurrencySyncResult:
      type: object
      required: [updated, change]
      properties:
        updated:
          type: integer
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    CurrencyRateHistoryRow:
      type: object
      required: [id, iso, currency, ratePerUsd, validFrom, updatedBy]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        iso:
          type: string
        currency:
          type: string
        ratePerUsd:
          type: number
        validFrom:
          $ref: "#/components/schemas/Timestamp"
        updatedBy:
          type: [string, "null"]

    CurrencyRateHistoryPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/CurrencyRateHistoryRow"

    BillingCycleInput:
      type: object
      additionalProperties: false
      required: [name, billingType, weekDay, usageDays, dueDays]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        billingType:
          type: string
          enum: [custom, daily, weekly, fortnightly, monthly]
        weekDay:
          type: [string, "null"]
          enum: [MON, TUE, WED, THU, FRI, SAT, SUN, null]
          description: Weekly and fortnightly cycles start on this day.
        usageDays:
          type: integer
          minimum: 1
          maximum: 366
        dueDays:
          type: integer
          minimum: 0
          maximum: 180

    BillingCycleRow:
      type: object
      required: [id, name, billingType, weekDay, usageDays, dueDays, enterprises, updatedBy, updatedAt, archivedAt]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        billingType:
          type: string
          enum: [custom, daily, weekly, fortnightly, monthly]
        weekDay:
          type: [string, "null"]
          enum: [MON, TUE, WED, THU, FRI, SAT, SUN, null]
          description: Weekly and fortnightly cycles start on this day.
        usageDays:
          type: integer
          minimum: 1
          maximum: 366
        dueDays:
          type: integer
          minimum: 0
          maximum: 180
        id:
          $ref: "#/components/schemas/Id"
        enterprises:
          type: integer
        updatedBy:
          type: [string, "null"]
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        archivedAt:
          type: [string, "null"]
          format: date-time

    BillingCyclePage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/BillingCycleRow"

    BillingCycleSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/BillingCycleRow"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    EnterpriseBalanceRow:
      type: object
      required: [id, enterprise, enterpriseType, customerBalance, customerCurrency, vendorBalance, vendorCurrency, netBalance, accountManager, billingType, creditLimit, creditUsedPct, billingCycle, currency]
      properties:
        id:
          $ref: "#/components/schemas/Id"
          description: The enterprise's ID.
        enterprise:
          type: string
        enterpriseType:
          type: string
        customerBalance:
          type: [number, "null"]
          description: Customer balance in the customer billing currency; positive = the client's credit, negative = what the client owes us; null = no customer billing.
        customerCurrency:
          type: [string, "null"]
        vendorBalance:
          type: [number, "null"]
          description: Vendor balance in the vendor billing currency; positive = the vendor's credit with us (we paid ahead), negative = what we owe the vendor.
        vendorCurrency:
          type: [string, "null"]
        netBalance:
          type: number
          description: Customer − vendor, in `currency` (the vendor side converted at the latest rate); negative = the partner owes us after offsetting.
        accountManager:
          type: [string, "null"]
        billingType:
          type: [string, "null"]
          enum: [prepaid, postpaid, null]
        creditLimit:
          type: [number, "null"]
          description: Customer Credit.
        creditUsedPct:
          type: [number, "null"]
          description: What the client owes us as a share of the credit limit (postpaid); 0 when the client is in credit.
        billingCycle:
          type: [string, "null"]
        currency:
          type: string
          description: Customer billing currency, else the vendor's.

    EnterpriseBalancePage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/EnterpriseBalanceRow"

    ChargesInput:
      type: object
      additionalProperties: false
      required: [enterpriseId, from, to]
      properties:
        enterpriseId:
          description: One enterprise; null = all with traffic in the period (Select All).
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        from:
          type: string
          format: date
        to:
          type: string
          format: date
          description: Inclusive; at most 366 days after `from`.

    ChargesResult:
      type: object
      required: [from, to, rows, totalPlatform, platformCurrency]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        rows:
          type: array
          items:
            type: object
            required: [enterpriseId, enterprise, side, currency, timezone, messages, amount, amountPlatform]
            properties:
              enterpriseId:
                $ref: "#/components/schemas/Id"
              enterprise:
                type: string
              side:
                type: string
                enum: [customer, vendor]
              currency:
                type: string
              timezone:
                type: string
              messages:
                type: integer
              amount:
                type: number
                description: Usage charges in the trunk currency (revenue for customers, cost for vendors).
              amountPlatform:
                type: number
        totalPlatform:
          type: object
          required: [customer, vendor]
          properties:
            customer:
              type: number
            vendor:
              type: number
        platformCurrency:
          type: string

    # ------------------------------------------------------------- Invoices (§7, §12.3)
    InvoiceRow:
      type: object
      required: [id, invoiceNumber, enterpriseId, enterprise, enterpriseType, businessCompany, invoiceType, kind, billingType, currency, timezone, invoiceDate, usageStart, usageEnd, dueDate, openingBalance, usageCharges, closingBalance, dueAmount, messageCount, status, paymentStatus, emailStatus, emailSentAt, remarks, archivedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        invoiceNumber:
          type: string
        enterpriseId:
          $ref: "#/components/schemas/Id"
        enterprise:
          type: string
        enterpriseType:
          type: string
        businessCompany:
          type: string
        invoiceType:
          type: string
          enum: [auto, manual]
          description: auto = made by Auto Invoicing at the end of the billing cycle; manual = Generate Request.
        kind:
          type: string
          enum: [traffic, proforma]
          description: Traffic invoices bill usage; proforma invoices ask for an amount in advance and leave balances alone.
        billingType:
          type: string
          enum: [prepaid, postpaid]
        currency:
          type: string
        timezone:
          type: string
          description: Usage days are cut at midnight in this zone (§13.31).
        invoiceDate:
          type: string
          format: date
        usageStart:
          type: string
          format: date
        usageEnd:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        openingBalance:
          type: number
          description: Customer balance before the usage, same sign as every balance (positive = the client's credit, negative = owed).
        usageCharges:
          type: number
        closingBalance:
          type: number
          description: Opening balance − usage charges.
        dueAmount:
          type: number
          description: What the client must pay, never negative (the owed part of the closing balance).
        messageCount:
          type: integer
        status:
          type: string
          enum: [pending, inprogress, completed, failed]
        paymentStatus:
          type: string
          enum: [unpaid, partial, paid]
        emailStatus:
          type: string
          enum: [unsent, sent]
        emailSentAt:
          type: [string, "null"]
          format: date-time
        remarks:
          type: [string, "null"]
        archivedAt:
          type: [string, "null"]
          format: date-time

    InvoicePage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
