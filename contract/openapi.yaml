      tags: [observation]
      operationId: querySignalingCaptures
      summary: "List signaling captures (server-side filter, sort and paging)"
      description: |
        Signaling Deck and PCAP Trace (§9.2): captured SMPP trace files with Sr. No., File Name, File Size, status and
        Update Time (UTC).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: One page of signaling captures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalingCapturePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

