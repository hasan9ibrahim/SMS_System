          conditionLabel:
            type: string
            description: e.g. DLR % decrease 20 % vs previous window, 15 min, ≥ 500 msgs.
          lastTriggeredAt: &id004
            oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          openIncidents: &id003
            type: integer
          incidents30d: *id003
          updatedBy:
            type:
            - string
            - 'null'
          updatedAt: &id005
            $ref: '#/components/schemas/Timestamp'
          archivedAt: *id004
    AlertRuleSaved:
      type: object
