          enum: [enable, disable, set_priority, shift_priority, replace_vendor, archive]
        priority:
          type: integer
          minimum: 1
          maximum: 100
        shift:
          type: integer
          minimum: -99
          maximum: 99
        fromVendorTrunkId:
          $ref: "#/components/schemas/Id"
        toVendorTrunkId:
          $ref: "#/components/schemas/Id"
        note:
          type: string
          maxLength: 500

    RouteBulkSaved:
      type: object
