  /network-binds/export:
    post:
      tags: [observation]
      operationId: exportNetworkBinds
      summary: "Network Status CSV / Excel"
      description: |
        Same filter and sort as the list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkExportInput"
      responses:
        "200":
          description: The file
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.ms-excel:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /network-binds/{side}/{id}/sessions:
    get:
      tags: [observation]
      operationId: listBindSessions
      summary: "SMPP sessions of a trunk (§13.1)"
      description: |
        Each bound session: session ID, remote IP and port, bind type, bound since, messages submitted and receipts
        waiting for that session (receipts go back on the session and IP the message came from).
      parameters:
        - name: side
          in: path
          required: true
          schema:
            type: string
            enum: [customer, vendor]
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: The sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindSessionList"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /network-binds/{side}/{id}/start:
    post:
      tags: [observation]
      operationId: startTrunkBind
      summary: "Start: bind a vendor trunk, or let a customer bind again"
      description: |
        Vendor: the switch opens its connections. Customer: binds are accepted again (the customer reconnects).
      parameters:
        - name: side
          in: path
          required: true
          schema:
            type: string
            enum: [customer, vendor]
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: The new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkBindRow"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /network-binds/{side}/{id}/stop:
    post:
      tags: [observation]
      operationId: stopTrunkBind
      summary: "Stop: unbind a vendor trunk, or kick a customer's sessions"
      description: |
        Stopped trunks stay stopped until Start. Messages waiting in a vendor queue are re-routed.
      parameters:
        - name: side
          in: path
          required: true
          schema:
            type: string
            enum: [customer, vendor]
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: The new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkBindRow"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /signaling-captures/query:
