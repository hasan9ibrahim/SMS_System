        Customer IP, Customer Msg ID, sender, DNID, destination, Error Code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: One page of failed EDRs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailedEdrPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /network-binds/query:
    post:
      tags: [observation]
      operationId: queryNetworkBinds
      summary: "List trunk bind status (server-side filter, sort and paging)"
      description: |
        Network Status (§9.2, §12.4): Customer / Vendor tabs (filter `side`): Enterprise ID, trunk ID, Enterprise Name,
        Trunk Name, IP Address, Number of Connections, Status (online / offline / stopped), and for vendors the Queue
        (messages waiting).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: One page of trunk bind status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkBindPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
