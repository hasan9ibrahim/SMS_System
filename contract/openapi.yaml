      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslationRuleInput"
      responses:
        "201":
          description: Created, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslationRuleSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /translation-rules/{id}:
    get:
      tags: [switch]
      operationId: getTranslationRule
      summary: "One translation rule"
      description: |
        Every field of the form, its targets with labels, and how many trunks it touches.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: The rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslationRuleDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [switch]
      operationId: updateTranslationRule
      summary: "Change a translation rule"
