            - $ref: "#/components/schemas/Change"
            - type: "null"

    InvoiceMarkInput:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: "#/components/schemas/Id"
        paymentStatus:
          type: [string, "null"]
          enum: [unpaid, partial, paid, null]
        emailStatus:
          type: [string, "null"]
          enum: [unsent, sent, null]
          description: At least one of paymentStatus and emailStatus.

    InvoiceRequestInput:
      type: object
      additionalProperties: false
      required: [kind, enterpriseIds, timezone, usageStart, usageEnd, dueDateType, dueDate, invoiceNumber, amount, volume, currency, invoiceDate, remarks]
      properties:
        kind:
          type: string
          enum: [traffic, proforma]
          description: Invoice Type (Traffic / Proforma).
        enterpriseIds:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/Id"
        timezone:
          type: [string, "null"]
          description: IANA zone; null = each enterprise's billing time zone.
        usageStart:
          type: string
          format: date
        usageEnd:
          type: string
          format: date
          description: Inclusive; at most 366 days after usageStart.
        dueDateType:
          type: string
          enum: [auto, manual]
          description: auto = invoice date + the billing cycle's due days.
        dueDate:
          type: [string, "null"]
          format: date
          description: Required when dueDateType is manual.
        invoiceNumber:
          type: [string, "null"]
          maxLength: 40
          description: One enterprise only; null = the business company's next number.
        amount:
          type: [number, "null"]
          minimum: 0
          description: Proforma only (required there).
        volume:
          type: [integer, "null"]
          minimum: 0
          description: Proforma only.
        currency:
          type: [string, "null"]
          pattern: "^[A-Z]{3}$"
          description: Proforma only; null = the customer billing currency. Traffic invoices use the billing currency.
        invoiceDate:
          type: [string, "null"]
          format: date
          description: null = today.
        remarks:
          type: [string, "null"]
          maxLength: 500

    InvoiceRequestRow:
      type: object
      required: [id, requestNo, kind, invoiceType, regenerate, enterpriseId, enterprise, enterpriseType, billingType, timezone, usageStart, usageEnd, status, error, remarks, invoiceId, invoiceNumber, startedAt, finishedAt, createdBy, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        requestNo:
          type: string
        kind:
          type: string
          enum: [traffic, proforma]
        invoiceType:
          type: string
          enum: [auto, manual]
        regenerate:
          type: boolean
          description: Made by Regenerate on an existing invoice.
        enterpriseId:
          $ref: "#/components/schemas/Id"
        enterprise:
          type: string
        enterpriseType:
          type: string
        billingType:
          type: [string, "null"]
          enum: [prepaid, postpaid, null]
        timezone:
          type: string
        usageStart:
          type: string
          format: date
        usageEnd:
          type: string
          format: date
        status:
          type: string
          enum: [pending, inprogress, completed, failed]
        error:
          type: [string, "null"]
        remarks:
          type: [string, "null"]
        invoiceId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        invoiceNumber:
          type: [string, "null"]
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        createdBy:
          type: [string, "null"]
          description: Null = Auto Invoicing.
        createdAt:
          $ref: "#/components/schemas/Timestamp"

    InvoiceRequestPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/InvoiceRequestRow"

    InvoiceRequestCreated:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceRequestRow"

    # ------------------------------------------------------------- Vendor invoices (§7, §13.31)
    ReconComparison:
      type: [string, "null"]
      enum: [match, mismatch, no_data, null]
      description: Result of the last check; no_data = the EDR store does not hold the whole period; null = not checked yet.

    ReconStatus:
      type: string
      enum: [pending, accepted, disputed, rejected]
      description: pending = waiting for a check or decision; disputed = did not match and is kept pending with a note.

    VendorInvoiceLine:
      type: object
      additionalProperties: false
      required: [mccmnc, volume, amount]
      properties:
        mccmnc:
          type: string
          pattern: "^[0-9]{5,6}$"
        volume:
          type: [integer, "null"]
          minimum: 0
        amount:
          type: number

    VendorInvoiceInput:
      type: object
      additionalProperties: false
      required: [enterpriseId, invoiceNumber, chargeVolume, chargeAmount, currency, invoiceDate, dueDate, periodFrom, periodTo, timezone, remarks]
      properties:
        enterpriseId:
          $ref: "#/components/schemas/Id"
        invoiceNumber:
          type: string
          minLength: 1
          maxLength: 60
        chargeVolume:
          type: [integer, "null"]
          minimum: 0
        chargeAmount:
          type: number
          minimum: 0
          maximum: 100000000
        currency:
          type: [string, "null"]
          pattern: "^[A-Z]{3}$"
          description: null = the partner's vendor billing currency.
        invoiceDate:
          type: string
          format: date
        dueDate:
          type: [string, "null"]
          format: date
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
        timezone:
          type: [string, "null"]
          description: null = the partner's billing time zone.
        remarks:
          type: [string, "null"]
          maxLength: 500
        lines:
          type: array
          maxItems: 5000
          description: Per-destination lines from the invoice, when it has them. Omitted on update = kept.
          items:
            $ref: "#/components/schemas/VendorInvoiceLine"

    VendorInvoiceRow:
      type: object
      required: [id, enterpriseId, enterprise, accountManager, invoiceNumber, currency, chargeVolume, chargeAmount, ourVolume, ourAmount, disputeAmount, differencePct, volumeDifference, invoiceDate, dueDate, periodFrom, periodTo, timezone, comparison, status, emailStatus, source, lineCount, remarks, checkedAt, inputFrom, inputTo, createdBy, createdAt, updatedAt, archivedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        enterpriseId:
          $ref: "#/components/schemas/Id"
        enterprise:
          type: string
        accountManager:
          type: [string, "null"]
        invoiceNumber:
          type: string
        currency:
          type: string
        chargeVolume:
          type: [integer, "null"]
        chargeAmount:
          type: [number, "null"]
        ourVolume:
          type: [integer, "null"]
          description: Our billable vendor messages for the period; null = not checked.
        ourAmount:
          type: [number, "null"]
          description: Our vendor cost for the period in the invoice currency.
        disputeAmount:
          type: [number, "null"]
          description: Dispute Amount = their amount − ours.
        differencePct:
          type: [number, "null"]
          description: Dispute amount as a share of our amount.
        volumeDifference:
          type: [integer, "null"]
        invoiceDate:
          type: string
          format: date
        dueDate:
          type: [string, "null"]
          format: date
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
        timezone:
          type: string
        comparison:
          $ref: "#/components/schemas/ReconComparison"
        status:
          $ref: "#/components/schemas/ReconStatus"
        emailStatus:
          type: string
          enum: [none, waiting, sent, failed]
          description: Acceptance or rejection e-mail; waiting = queued under "confirm before sending".
        source:
          type: string
          enum: [manual, import, email]
        lineCount:
          type: integer
        remarks:
          type: [string, "null"]
        checkedAt:
          type: [string, "null"]
          format: date-time
        inputFrom:
          type: [string, "null"]
          format: date-time
          description: |
            Input From (§7, decided 2026-10-17): start of the window our figures were counted for, as a UTC instant =
            midnight of the invoice From date in the invoice time zone. Null = not counted (not checked yet, or the
            EDR store does not hold the whole period).
        inputTo:
          type: [string, "null"]
          format: date-time
          description: Input To, exclusive end of that window (midnight after the invoice To date in the invoice time zone).
        createdBy:
          type: [string, "null"]
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        archivedAt:
          type: [string, "null"]
          format: date-time

    VendorInvoicePage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/VendorInvoiceRow"

    VendorInvoiceEvent:
      type: object
      required: [id, kind, statusFrom, statusTo, note, emailTo, user, at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        kind:
          type: string
          enum: [created, edited, checked, status, note, email]
        statusFrom:
          type: [string, "null"]
        statusTo:
          type: [string, "null"]
        note:
          type: [string, "null"]
        emailTo:
          type: array
          items:
            type: string
        user:
          type: [string, "null"]
          description: Null = the platform (automatic check or e-mail).
        at:
          $ref: "#/components/schemas/Timestamp"

    VendorInvoiceDetail:
      allOf:
        - $ref: "#/components/schemas/VendorInvoiceRow"
        - type: object
          required: [reasons, rule, inSoa, events]
          properties:
            reasons:
              type: array
              items:
                type: string
              description: Why the last check matched or not, one line per check.
            rule:
              description: The rule the last check used (a copy; later rule changes do not alter it).
              oneOf:
                - $ref: "#/components/schemas/ReconRuleValues"
                - type: "null"
            inSoa:
              type: string
              enum: [included, disputed_block, excluded]
              description: How the invoice shows on the partner's SOA (§13.31).
            events:
              type: array
              items:
                $ref: "#/components/schemas/VendorInvoiceEvent"

    VendorInvoiceSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/VendorInvoiceDetail"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    VendorInvoiceComparison:
      type: object
      required: [invoiceId, currency, timezone, from, to, coverage, edrFrom, edrTo, rows]
      properties:
        invoiceId:
          $ref: "#/components/schemas/Id"
        currency:
          type: string
        timezone:
          type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        coverage:
          type: string
          enum: [full, partial, none]
        edrFrom:
          type: [string, "null"]
          format: date-time
        edrTo:
          type: [string, "null"]
          format: date-time
        rows:
          type: array
          items:
            type: object
            required: [mccmnc, country, network, theirVolume, theirAmount, ourVolume, ourAmount, difference, differencePct, flagged]
            properties:
              mccmnc:
                type: string
              country:
                type: [string, "null"]
              network:
                type: [string, "null"]
              theirVolume:
                type: [integer, "null"]
              theirAmount:
                type: [number, "null"]
              ourVolume:
                type: integer
              ourAmount:
                type: number
              difference:
                type: [number, "null"]
                description: Their amount − ours; null when the invoice has no lines.
              differencePct:
                type: [number, "null"]
              flagged:
                type: boolean
                description: Off by more than the rule's per-destination tolerance.

    VendorInvoiceDecision:
      type: object
      additionalProperties: false
      required: [action, note, sendEmail]
      properties:
        action:
          type: string
          enum: [accept, reject, keep_pending, send_acceptance]
        note:
          type: [string, "null"]
          maxLength: 1000
        sendEmail:
          type: boolean
          description: accept and reject only; send_acceptance always sends.

    VendorInvoiceNote:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 1000

    VendorInvoiceEmailInput:
      type: object
      additionalProperties: false
      required: [kind, note]
      properties:
        kind:
          type: string
          enum: [acceptance, rejection]
        note:
          type: [string, "null"]
          maxLength: 1000

    EmailPreview:
      type: object
      required: [recipients, subject, body]
      properties:
        recipients:
          type: array
          items:
            type: string
          description: Empty = the partner has no billing contact.
        subject:
          type: string
        body:
          type: string

    VendorInvoiceSummaryInput:
      type: object
      additionalProperties: false
      required: [fromMonth, toMonth, enterpriseId, accountManagerId]
      properties:
        fromMonth:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
        toMonth:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
          description: Inclusive; at most 36 months.
        enterpriseId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        accountManagerId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"

    VendorInvoiceSummary:
      type: object
      required: [platformCurrency, rows]
      properties:
        platformCurrency:
          type: string
        rows:
          type: array
          items:
            type: object
            required: [month, invoices, match, mismatch, noData, unchecked, pending, accepted, disputed, rejected, theirAmount, ourAmount, difference]
            properties:
              month:
                type: string
                description: Invoice month, YYYY-MM.
              invoices:
                type: integer
              match:
                type: integer
              mismatch:
                type: integer
              noData:
                type: integer
              unchecked:
                type: integer
              pending:
                type: integer
              accepted:
                type: integer
              disputed:
                type: integer
              rejected:
                type: integer
              theirAmount:
                type: number
                description: Platform currency at each invoice date's rate.
              ourAmount:
                type: number
              difference:
                type: number

    # ------------------------------------------------------------- Reconciliation rules (§13.31)
    ReconRuleValues:
      type: object
      required: [amountPct, amountFixed, amountCombine, countPct, countFixed, countCombine, destinationPct, autoSend, disputedInSoa]
      properties:
        amountPct:
          type: [number, "null"]
          minimum: 0
          maximum: 100
          description: Amount matches when the difference is at most this share of our amount; null = no percentage check.
        amountFixed:
          type: [number, "null"]
          minimum: 0
          description: ... or at most this amount in the invoice currency; null = no fixed check.
        amountCombine:
          type: string
          enum: [stricter, looser]
          description: With both set, stricter = both must hold, looser = either is enough.
        countPct:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        countFixed:
          type: [integer, "null"]
          minimum: 0
          description: Messages.
        countCombine:
          type: string
          enum: [stricter, looser]
        destinationPct:
          type: [number, "null"]
          minimum: 0
          maximum: 100
          description: Flag any destination off by more than this share even when the total matches; null = off.
        autoSend:
          type: string
          enum: [auto, confirm]
          description: Acceptance e-mail on a match - sent at once, or queued until confirmed.
        disputedInSoa:
          type: string
          enum: [exclude, separate_block]
          description: Rejected and pending invoices are left off the SOA or shown in a separate "disputed" block.

    ReconRuleInput:
      type: object
      additionalProperties: false
      required: [enterpriseId, amountPct, amountFixed, amountCombine, countPct, countFixed, countCombine, destinationPct, autoSend, disputedInSoa]
      properties:
        enterpriseId:
          description: The partner; null only for the default rule (which already exists).
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        amountPct:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        amountFixed:
          type: [number, "null"]
          minimum: 0
        amountCombine:
          type: string
          enum: [stricter, looser]
        countPct:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        countFixed:
          type: [integer, "null"]
          minimum: 0
        countCombine:
          type: string
          enum: [stricter, looser]
        destinationPct:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        autoSend:
          type: string
          enum: [auto, confirm]
        disputedInSoa:
          type: string
          enum: [exclude, separate_block]

    ReconRuleRow:
      allOf:
        - $ref: "#/components/schemas/ReconRuleValues"
        - type: object
          required: [id, enterpriseId, enterprise, currency, invoices, updatedBy, updatedAt, archivedAt]
          properties:
            id:
              $ref: "#/components/schemas/Id"
            enterpriseId:
              oneOf:
                - $ref: "#/components/schemas/Id"
                - type: "null"
            enterprise:
              type: [string, "null"]
              description: Null = the default rule for partners without their own.
            currency:
              type: [string, "null"]
              description: The partner's vendor billing currency (for the fixed amount).
            invoices:
              type: integer
              description: Vendor invoices of the partner (all partners without a rule, for the default).
            updatedBy:
              type: [string, "null"]
            updatedAt:
              $ref: "#/components/schemas/Timestamp"
            archivedAt:
              type: [string, "null"]
              format: date-time

    ReconRulePage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/ReconRuleRow"

    ReconRuleSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/ReconRuleRow"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    # ------------------------------------------------------------- SOA (§7, §13.31, §13.33)
    SoaInvoiceType:
      type: string
      enum: [all, auto, manual]
      description: Invoice Type filter of the SOA form; applies to customer invoices.

    SoaQuery:
      type: object
      additionalProperties: false
      required: [enterpriseIds, invoiceType, from, to]
      properties:
        enterpriseIds:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/Id"
        invoiceType:
          $ref: "#/components/schemas/SoaInvoiceType"
        from:
          type: string
          format: date
        to:
          type: string
          format: date
          description: Inclusive; at most 3 years after `from`.

    SoaStatementQuery:
      type: object
      additionalProperties: false
      required: [enterpriseId, invoiceType, from, to]
      properties:
        enterpriseId:
          $ref: "#/components/schemas/Id"
        invoiceType:
          $ref: "#/components/schemas/SoaInvoiceType"
        from:
          type: string
          format: date
        to:
          type: string
          format: date

    SoaSideSummary:
      type: object
      required: [side, currency, openingBalance, closingBalance, systemBalance, lines, excludedPayments, disputed]
      properties:
        side:
          type: string
          enum: [customer, vendor]
        currency:
          type: string
        openingBalance:
          type: number
        closingBalance:
          type: number
          description: Opening + the statement's lines.
        systemBalance:
          type: number
          description: The balance the system holds at the end of the period (§7 sign).
        lines:
          type: integer
        excludedPayments:
          type: integer
        disputed:
          type: integer

    SoaSearchRow:
      type: object
      required: [enterpriseId, enterprise, enterpriseType, recipients, sides, lastSentAt]
      properties:
        enterpriseId:
          $ref: "#/components/schemas/Id"
        enterprise:
          type: string
        enterpriseType:
          type: string
        recipients:
          type: array
          items:
            type: string
          description: Billing contacts; empty = Send Email fails for this enterprise.
        sides:
          type: array
          items:
            $ref: "#/components/schemas/SoaSideSummary"
        lastSentAt:
          type: [string, "null"]
          format: date-time

    SoaSearchResult:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SoaSearchRow"

    SoaLine:
      type: object
      required: [key, date, kind, reference, description, amount, balance, source, status, note, refType, refId, adjustmentId]
      properties:
        key:
          type: string
          description: Stable key, e.g. invoice:12, vendor_invoice:7, transaction:91, entry:3.
        date:
          type: string
          format: date
        kind:
          type: string
          enum: [opening, invoice, vendor_invoice, receipt, adjustment, dispute, credit_note, bank_charges, bill_payment, reprocess, manual_payment, manual_credit_note, manual_adjustment, manual_opening]
        reference:
          type: [string, "null"]
          description: Invoice number or transaction reference.
        description:
          type: string
        amount:
          type: number
          description: Signed like the balance - positive raises it (payments in, credits), negative lowers it (invoices).
        balance:
          type: [number, "null"]
          description: Running balance after the line; main lines only.
        source:
          type: string
          enum: [auto, manual]
        status:
          type: [string, "null"]
          description: Vendor invoice status (pending, accepted, disputed, rejected) or invoice payment status.
        note:
          type: [string, "null"]
          description: Reason of a manual add or remove, or why a payment is left off.
        refType:
          type: string
          enum: [invoice, vendor_invoice, transaction, entry, opening]
        refId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        adjustmentId:
          description: The manual add, remove or entry behind the line; null for automatic lines.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"

    SoaSide:
      type: object
      required: [side, currency, openingBalance, lines, closingBalance, systemBalance, difference, disputedBlock, disputed, excludedPayments, removed]
      properties:
        side:
          type: string
          enum: [customer, vendor]
        currency:
          type: string
        openingBalance:
          type: number
          description: System balance at the start of the period (§7 sign).
        lines:
          type: array
          items:
            $ref: "#/components/schemas/SoaLine"
        closingBalance:
          type: number
        systemBalance:
          type: number
        difference:
          type: number
          description: closingBalance − systemBalance; explained by lines left off, removed or added by hand.
        disputedBlock:
          type: boolean
          description: The partner's rule shows non-accepted vendor invoices in a separate block (§13.31).
        disputed:
          type: array
          items:
            $ref: "#/components/schemas/SoaLine"
        excludedPayments:
          type: array
          items:
            $ref: "#/components/schemas/SoaLine"
        removed:
          type: array
          items:
            $ref: "#/components/schemas/SoaLine"

    SoaStatement:
      type: object
      required: [enterpriseId, enterprise, businessCompany, timezone, from, to, invoiceType, recipients, sides, net]
      properties:
        enterpriseId:
          $ref: "#/components/schemas/Id"
        enterprise:
          type: string
        businessCompany:
          type: string
        timezone:
          type: string
          description: The partner's billing time zone, printed on the SOA.
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        invoiceType:
          $ref: "#/components/schemas/SoaInvoiceType"
        recipients:
          type: array
          items:
            type: string
        sides:
          type: array
          items:
            $ref: "#/components/schemas/SoaSide"
        net:
          description: Customer − vendor closing balance for reciprocal partners, in the customer currency.
          oneOf:
            - type: object
              required: [amount, currency]
              properties:
                amount:
                  type: number
                currency:
                  type: string
            - type: "null"

    SoaAdjustmentInput:
      type: object
      additionalProperties: false
      required: [enterpriseId, action, note]
      properties:
        enterpriseId:
          $ref: "#/components/schemas/Id"
        action:
          type: string
          enum: [include_vendor_invoice, exclude_invoice, exclude_vendor_invoice, entry]
        invoiceId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        vendorInvoiceId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        entry:
          description: For action entry.
          oneOf:
            - type: object
              additionalProperties: false
              required: [side, kind, date, amount, description]
              properties:
                side:
                  type: string
                  enum: [customer, vendor]
                kind:
                  type: string
                  enum: [payment, credit_note, adjustment, opening_balance]
                date:
                  type: string
                  format: date
                amount:
                  type: number
                  description: Signed like the balance (positive raises it).
                currency:
                  type: [string, "null"]
                  pattern: "^[A-Z]{3}$"
                  description: Must be the side's billing currency; null = that currency.
                description:
                  type: string
                  minLength: 1
                  maxLength: 300
                affectsBalance:
                  type: boolean
                  description: |
                    Changes the balance (decided 2026-10-17): also records a real transaction (payment → Receipt or Bill
                    Payment, credit note → Credit Note, adjustment and opening balance → Adjustment) dated and signed like
                    the entry. False or omitted = the line shows on the SOA only.
            - type: "null"
        note:
          type: [string, "null"]
          maxLength: 500
          description: Required to remove an automatic line.

