    # ------------------------------------------------------------- LCR (§13.23)
    LcrWeights:
      type: object
      description: Weights of the quality-weighted score (§13.23); relative, need not add up to 100.
      additionalProperties: false
      required:
      - cost
      - asr
      - dlr
      - delay
      properties:
        cost:
          type: number
          minimum: 0
          maximum: 100
        asr:
          type: number
          minimum: 0
          maximum: 100
        dlr:
          type: number
          minimum: 0
          maximum: 100
        delay:
          type: number
          minimum: 0
          maximum: 100
    LcrProfileFields:
      type: object
      required:
      - name
      - description
      - status
      - vendorTrunkMode
      - vendorTrunkIds
      - tiers
      - minAsr
      - minDlr
      - maxDelayS
      - maxRate
      - vendorCount
      - split
      - shares
      - tieBreaker
      - excludeAtTpsLimit
      - qualityWeighted
      - weights
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type:
          - string
          - 'null'
          maxLength: 500
        status:
          $ref: '#/components/schemas/RecordStatus'
        vendorTrunkMode:
          type: string
          enum:
          - all
          - inclusive
          - exclusive
        vendorTrunkIds:
          type: array
          items: &id002
            $ref: '#/components/schemas/Id'
          maxItems: 500
          uniqueItems: true
        tiers:
          type: array
          items:
            type: string
            enum:
            - tier1
            - tier2
            - tier3
          maxItems: 3
          uniqueItems: true
          description: Vendor tiers allowed; empty = all.
        minAsr: &id001
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
        minDlr: *id001
        maxDelayS:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 3600
        maxRate:
          type:
          - number
          - 'null'
          minimum: 0
          description: Highest cost allowed, platform currency.
        vendorCount:
          type: integer
          minimum: 1
          maximum: 10
          description: Number of vendors to use.
        split:
          type: string
          enum:
          - top_down
          - percentage
        shares:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 100
          maxItems: 10
          description: Percentage split, one share per vendor position, adding up to 100.
        tieBreaker:
          type: string
          enum:
          - quality
          - cost
          description: 'Equal score or cost: the better DLR (quality) or the lower cost first.'
        excludeAtTpsLimit:
          type: boolean
          description: Leave out vendors at their TPS limit now.
        qualityWeighted:
          type: boolean
          description: Rank by the quality-weighted score instead of cost.
        weights:
          $ref: '#/components/schemas/LcrWeights'
    LcrProfileInput:
      allOf:
      - $ref: '#/components/schemas/LcrProfileFields'
      unevaluatedProperties: false
    LcrProfileRow:
      allOf:
      - $ref: '#/components/schemas/LcrProfileFields'
      - type: object
        required:
        - id
        - ruleCount
        - updatedBy
        - updatedAt
        - archivedAt
        properties:
          id: *id002
          ruleCount:
            type: integer
            description: Route rules of type Least cost using it.
          updatedBy:
            type:
            - string
            - 'null'
          updatedAt: &id004
            $ref: '#/components/schemas/Timestamp'
          archivedAt: &id005
            oneOf: &id003
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    LcrProfileSaved:
      type: object
      required:
      - record
      - change
      properties:
        record:
          $ref: '#/components/schemas/LcrProfileRow'
        change:
          oneOf:
          - $ref: '#/components/schemas/Change'
          - type: 'null'
    LcrProfilePage:
      allOf:
      - $ref: '#/components/schemas/ListPageMeta'
      - type: object
        required:
        - rows
        properties:
          rows:
            type: array
            items:
              $ref: '#/components/schemas/LcrProfileRow'
    LcrWhatIf:
      type: object
      additionalProperties: false
      required: []
      properties:
        remove:
          type: array
          items: *id002
          maxItems: 100
          uniqueItems: true
          description: Vendor trunks taken out.
        rates:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - vendorTrunkId
            - rate
            properties:
              vendorTrunkId: *id002
              rate:
                type: number
                minimum: 0
          maxItems: 100
          description: New cost (platform currency) for a vendor, or an offer from a vendor without a rate here.
    LcrQuery:
      type: object
      additionalProperties: false
      required:
      - mccmnc
      properties:
        mccmnc:
          type: string
          pattern: ^[0-9]{3,6}$
        at:
          oneOf: *id003
          description: 'Point in time: past or future (scheduled vendor changes applied); null = now.'
        profileId: &id014
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        qualityWeighted:
          type: boolean
          description: Overrides the profile; without a profile, false = rank by cost.
        weights:
          $ref: '#/components/schemas/LcrWeights'
        whatIf:
          $ref: '#/components/schemas/LcrWhatIf'
    LcrRow:
      type: object
      required:
      - rank
      - vendorTrunkId
      - vendorTrunk
      - vendor
      - tier
      - status
      - rate
      - currency
      - cost
      - effectiveFrom
      - nextRate
      - nextFrom
      - asr
      - dlr
      - delayS
      - attempts
      - tpsNow
      - tpsLimit
      - atLimit
      - routedNow
      - score
      - excluded
      - pick
      - share
      - whatIf
      - baselineRank
      properties:
        rank:
          type: &id007
          - integer
          - 'null'
          description: Position among the eligible vendors; null when the profile leaves the vendor out.
        vendorTrunkId: *id002
        vendorTrunk:
          type: string
        vendor:
          type: string
        tier:
          type: string
        status:
          type: string
        rate: &id011
          type: number
        currency:
          type: string
        cost:
          type: number
          description: Platform currency.
        effectiveFrom: *id004
        nextRate: &id006
          type: &id008
          - number
          - 'null'
        nextFrom: *id005
        asr: *id006
        dlr: *id006
        delayS: *id006
        attempts:
          type: integer
          description: QBR sample behind ASR / DLR.
        tpsNow: *id006
        tpsLimit: &id009
          type: *id007
        atLimit: &id015
          type: boolean
        routedNow:
          type: integer
          description: Client trunks routed to this vendor for the destination now.
        score:
          type: *id008
          description: Quality-weighted score, 0–100 (higher is better).
        excluded:
          type: &id012
          - string
          - 'null'
          description: Why the profile leaves it out.
        pick:
          type: boolean
          description: Within the profile's number of vendors.
        share: *id009
        whatIf:
          type:
          - string
          - 'null'
          enum:
          - removed
          - changed
          - added
          - null
        baselineRank:
          type: *id007
          description: Rank before the what-if changes.
    LcrImpact:
