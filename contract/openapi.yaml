        mccmncPattern:
          type: [string, "null"]
          maxLength: 200
          description: Dynamic regular expression on the MCCMNC (§13.21).
        senderPattern:
          type: [string, "null"]
          maxLength: 200
        senderPatternNegate:
          type: boolean
        receiverPattern:
          type: [string, "null"]
          maxLength: 200
        receiverPatternNegate:
          type: boolean
        contentPattern:
          type: [string, "null"]
          maxLength: 200
        contentPatternNegate:
          type: boolean
        senderListId:
