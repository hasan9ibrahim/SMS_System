        updatedBy:
          type: [string, "null"]
        updatedAt:
          $ref: "#/components/schemas/Timestamp"

    CurrencyPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/CurrencyRow"

    CurrencyUpdate:
      type: object
      additionalProperties: false
      required: [name, symbol]
      properties:
        name:
          type: string
          minLength: 1
