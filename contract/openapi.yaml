              items:
                type: object
                required: [id, paymentDate, transactionType, paymentType, amount, currency]
                properties:
                  id:
                    $ref: "#/components/schemas/Id"
                  paymentDate:
                    type: string
                    format: date
                  transactionType:
                    $ref: "#/components/schemas/TransactionType"
                  paymentType:
                    type: string
                    enum: [credit, debit]
                  amount:
                    type: number
                  currency:
                    type: string
            createdBy:
              type: [string, "null"]
            createdAt:
              $ref: "#/components/schemas/Timestamp"
            updatedBy:
              type: [string, "null"]
            updatedAt:
              $ref: "#/components/schemas/Timestamp"

    InvoiceUpdate:
      type: object
      additionalProperties: false
      required: [dueDate, remarks]
      properties:
        dueDate:
          type: string
          format: date
        remarks:
          type: [string, "null"]
          maxLength: 500

    InvoiceSaved:
