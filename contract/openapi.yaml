      additionalProperties: false
      required:
      - others
      - own
      properties:
        others:
          $ref: '#/components/schemas/VisibilityMode'
        own:
          $ref: '#/components/schemas/VisibilityMode'
    VisibilityItems:
      type: object
      description: The items that can be hidden (§13.17 table).
      additionalProperties: false
      required:
      - margin
      - revenue
      - cost
      - sellRates
      - balances
