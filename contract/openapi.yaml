          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    CurrencyRateHistoryRow:
      type: object
      required: [id, iso, currency, ratePerUsd, validFrom, updatedBy]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        iso:
          type: string
        currency:
          type: string
        ratePerUsd:
          type: number
        validFrom:
          $ref: "#/components/schemas/Timestamp"
        updatedBy:
          type: [string, "null"]

    CurrencyRateHistoryPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/CurrencyRateHistoryRow"

    BillingCycleInput:
      type: object
      additionalProperties: false
