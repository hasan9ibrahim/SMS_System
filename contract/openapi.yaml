          description: Duplicate to trunk - the copy targets only this trunk and is active.
          properties:
            kind:
              type: string
              enum: [customer, vendor]
            id:
              $ref: "#/components/schemas/Id"

    TestMessage:
      type: object
      additionalProperties: false
      required: [sender, receiver, text]
      properties:
        sender:
          type: string
          maxLength: 32
        receiver:
          type: string
          maxLength: 32
        text:
          type: string
          maxLength: 2000
        senderTon:
          oneOf:
            - type: integer
            - type: "null"
        senderNpi:
          oneOf:
            - type: integer
            - type: "null"
        dlrStatus:
          type: [string, "null"]
          maxLength: 10
          description: A vendor DLR stat to run through the DLR conversion.
        dlrError:
          type: [string, "null"]
          maxLength: 10

    TranslationTestInput:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          $ref: "#/components/schemas/TestMessage"
        rule:
          $ref: "#/components/schemas/TranslationRuleInput"
          description: The unsaved form, to test before saving; the saved rule when omitted.

    MessageState:
      type: object
      required: [sender, receiver, text, senderTon, senderNpi, destTon, destNpi, billingType, registeredDelivery, dlrStatus, dlrError, mccmnc]
      properties:
        sender:
          type: string
        receiver:
          type: string
        text:
          type: string
        senderTon:
          type: [integer, "null"]
        senderNpi:
          type: [integer, "null"]
        destTon:
          type: [integer, "null"]
        destNpi:
          type: [integer, "null"]
        billingType:
          type: [string, "null"]
        registeredDelivery:
          type: [integer, "null"]
        dlrStatus:
          type: [string, "null"]
        dlrError:
          type: [string, "null"]
        mccmnc:
          type: [string, "null"]
          description: Network of the receiver by dial-code prefix ("All" profile).

    TranslationStep:
      type: object
      required: [ruleId, name, matched, fired, blocked, checks, changes, continueAfter]
      properties:
        ruleId:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        matched:
          type: boolean
        fired:
          type: boolean
          description: Matched and changed or blocked the message.
        blocked:
          type: boolean
        checks:
          type: array
          items:
            type: object
            required: [condition, ok, detail]
            properties:
              condition:
                type: string
              ok:
                type: boolean
              detail:
                type: string
        changes:
          type: array
          description: Field, before, after.
          items:
            type: object
            required: [field, before, after]
            properties:
              field:
                type: string
              before:
                type: [string, "null"]
              after:
                type: [string, "null"]
        continueAfter:
          type: boolean

    TranslationTestResult:
      type: object
      required: [before, after, blocked, steps]
      properties:
        before:
          $ref: "#/components/schemas/MessageState"
        after:
          $ref: "#/components/schemas/MessageState"
        blocked:
          type: boolean
        steps:
          type: array
          items:
            $ref: "#/components/schemas/TranslationStep"

    TrunkRulesTestInput:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          $ref: "#/components/schemas/TestMessage"

    TrunkRulesTestResult:
      allOf:
        - $ref: "#/components/schemas/TranslationTestResult"
        - type: object
          required: [hlr]
          properties:
            hlr:
              description: Customer trunks - the first HLR rule whose DNID pattern matches the (translated) receiver.
              oneOf:
                - type: object
                  required: [ruleId, ruleName, providerId, providerName]
                  properties:
                    ruleId:
                      $ref: "#/components/schemas/Id"
                    ruleName:
                      type: string
                    providerId:
                      $ref: "#/components/schemas/Id"
                    providerName:
                      type: string
                - type: "null"

    # ------------------------------------------------------------- HLR (§6.5, §13.24)
    HlrProviderType:
      type: string
      enum: [hlr, mnp, number_check]
      description: "hlr: live HLR lookup; mnp: number portability (MNP / NPQ); number_check: validity check."

    HlrLiveStatus:
      type: string
      enum: [up, slow, down, inactive]
      description: "From the last 24 hours: down = success under 50 % (or no answer), slow = average response over 80 % of the timeout, inactive = switched off."

    HlrResponseMapping:
      type: object
      additionalProperties: false
      description: Where each value is found in the provider's response (§6.5 response-mapping captions); a JSON path or a field name. Null = not provided.
      required: [mcc, mnc, mccmnc, oldMcc, oldMnc, oldMccmnc, ported, errorCode, errorString, successCodes, numberCheck, dnidScore]
      properties:
        mcc:
          type: string
          minLength: 1
          maxLength: 100
        mnc:
          type: string
          minLength: 1
          maxLength: 100
        mccmnc:
          type: string
          minLength: 1
          maxLength: 100
        oldMcc:
          type: [string, "null"]
          maxLength: 100
        oldMnc:
          type: [string, "null"]
          maxLength: 100
        oldMccmnc:
          type: [string, "null"]
          maxLength: 100
        ported:
          type: [string, "null"]
          maxLength: 100
        errorCode:
          type: [string, "null"]
          maxLength: 100
        errorString:
          type: [string, "null"]
          maxLength: 100
        successCodes:
          type: [string, "null"]
          maxLength: 200
          description: Comma-separated codes that mean a successful lookup, e.g. "0,1".
        numberCheck:
          type: [string, "null"]
          maxLength: 100
        dnidScore:
          type: [string, "null"]
          maxLength: 100

    HlrProviderFields:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        providerType:
          $ref: "#/components/schemas/HlrProviderType"
        url:
          type: string
          minLength: 1
          maxLength: 500
          description: Request template; {DNID} is replaced by the number.
        username:
          type: [string, "null"]
          maxLength: 100
        extraHeaders:
          type: [string, "null"]
          maxLength: 2000
          description: 'One "Name: value" per line.'
        postData:
          type: [string, "null"]
          maxLength: 4000
          description: POST body template ({DNID} is replaced); null = GET.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        defaultRate:
          type: number
          minimum: 0
          maximum: 1
          description: Price per live lookup for destinations without their own price.
        cacheDays:
          type: integer
          minimum: 0
          maximum: 7
          description: Enable Caching (0-7 days); a policy can set its own cache times.
        timeoutMs:
          type: integer
          minimum: 100
          maximum: 30000
        dailyBudget:
          type: [number, "null"]
          minimum: 0
          description: Spend per day after which the provider is skipped (null = no limit).
        status:
          $ref: "#/components/schemas/RecordStatus"
        responseMapping:
          $ref: "#/components/schemas/HlrResponseMapping"

    HlrProviderInput:
      allOf:
        - $ref: "#/components/schemas/HlrProviderFields"
        - type: object
          properties:
            password:
              type: [string, "null"]
              maxLength: 200
              description: "Write-only. Null keeps the stored password; an empty string clears it."
      required: [name, providerType, url, username, extraHeaders, postData, currency, defaultRate, cacheDays, timeoutMs, dailyBudget, status, responseMapping, password]
      unevaluatedProperties: false

    HlrProviderStats:
      type: object
      description: Last 24 hours of EDRs (ending at the newest EDR).
      required: [liveStatus, lookups, liveLookups, cachedLookups, successPct, avgResponseMs, cost, ported]
      properties:
        liveStatus:
          $ref: "#/components/schemas/HlrLiveStatus"
        lookups:
