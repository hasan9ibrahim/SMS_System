components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sms_session
      description: Session cookie set at sign-in (login flow added in a later revision).

  parameters:
    RateView:
      name: view
      in: query
      required: false
      description: Which lines (§13.12 view tabs).
      schema:
        type: string
        enum: [current, scheduled, closed]
        default: current
    DocId:
      name: docId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    RecordId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ListId:
      name: list
      in: path
      required: true
      description: Identifier of a list page.
      schema:
        $ref: "#/components/schemas/ListId"

  responses:
    BadRequest:
      description: The request does not match the contract (e.g. unknown filter field or operator)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Not signed in, or not allowed by the user's GUI Access Group (§1)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such record
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Signed in, but this record or action belongs to someone else
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: |
        The data store behind this operation is not reachable. In the frontend phase this
        means the local databases are not running or not seeded (`npm run db:up`,
        `npm run seed:small`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    # ------------------------------------------------------------------ common
    Id:
      type: integer
      format: int64
      minimum: 1
      description: Numeric record ID, shown to users (e.g. "Name – Alias (ID)").

    Timestamp:
      type: string
      format: date-time
      description: UTC, ISO 8601.

    Audit:
      type: object
      description: Who changed the record and when (spec §1).
      required: [updatedBy, updatedAt]
      properties:
        createdBy:
          type: [string, "null"]
        createdAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        updatedBy:
          type: string
        updatedAt:
          $ref: "#/components/schemas/Timestamp"

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          description: Field-level errors, for forms and for invalid filters.
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
                description: JSON pointer into the request, e.g. `/filter/conditions/0/field`.
              message:
                type: string

    # ------------------------------------------------------------------ system
    Health:
      type: object
      required: [status, version, contractVersion, serverTime, backend]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: Build version of the server answering the contract.
        contractVersion:
          type: string
          description: The `info.version` of this contract the server implements.
        serverTime:
          $ref: "#/components/schemas/Timestamp"
        backend:
          type: string
          enum: [mock, elixir]
          description: Which implementation answers the contract.

    Theme:
      type: string
      enum: [light, dark]
      description: Colour theme (§15.2).

    CurrentUser:
      type: object
      required: [id, username, displayName, role, businessCompany, preferences, permissions]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        username:
          type: string
        displayName:
          type: string
        initials:
          type: string
          description: Shown in the avatar (§3).
        role:
          type: string
          description: e.g. Admin, NOC, Rates, Finance, Account Manager.
        businessCompany:
          type: string
          description: The selling entity the user belongs to.
        preferences:
          type: object
          required: [theme]
          properties:
            theme:
              $ref: "#/components/schemas/Theme"
            openInNewTab:
              type: boolean
              default: true
              description: Menu items open in a new tab or the current tab (§13.5).
            animations:
              type: boolean
              default: true
              description: Live value animations on/off (§13.3).
        permissions:
          type: array
          description: GUI Access Group permission keys; buttons not covered are hidden (§1).
          items:
            type: string

    PreferencesUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        theme:
          $ref: "#/components/schemas/Theme"
        openInNewTab:
          type: boolean
        animations:
          type: boolean

    WorkspaceTab:
      type: object
      description: One open page tab (§13.5). Per-tab page state (filters, scroll) stays in the browser.
      required: [id, path, title, pinned]
      additionalProperties: false
      properties:
        id:
          type: string
          maxLength: 64
        path:
          type: string
          maxLength: 2000
          description: GUI route of the page, with its query string.
        title:
          type: string
          maxLength: 200
        pinned:
          type: boolean

    Workspace:
      type: object
      required: [tabs, activeTabId]
      additionalProperties: false
      properties:
        tabs:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/WorkspaceTab"
        activeTabId:
          type: [string, "null"]

    SearchHit:
      type: object
      required: [kind, id, label]
      properties:
        kind:
          type: string
          enum: [enterprise, customer_trunk, vendor_trunk, rate_table, route_rule, user]
        id:
          $ref: "#/components/schemas/Id"
        label:
          type: string
          description: Display name, e.g. "Name – Alias (ID)" for enterprises.
        detail:
          type: [string, "null"]
          description: Secondary text, e.g. the trunk's enterprise or the rule's priority.

    SearchResults:
      type: object
      required: [hits]
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"

    # ------------------------------------------------------------------ users (§11)
    UserSummary:
      type: object
      required: [id, username, displayName, email, status, isAccountManager]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
        department:
          type: [string, "null"]
        accessGroup:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/RecordStatus"
        isAccountManager:
          type: boolean

    UserPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/UserSummary"

    # ------------------------------------------------------------- saved views (§13.25)
    ViewState:
      type: object
      description: What a saved view restores on a grid.
      additionalProperties: false
      properties:
        filter:
          $ref: "#/components/schemas/FilterGroup"
        search:
          type: string
          maxLength: 200
        sort:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/SortKey"
        columns:
          type: array
          description: Visible columns in display order (field names).
          maxItems: 200
          items:
            type: string

    SavedViewInput:
      type: object
      required: [list, name, state]
      additionalProperties: false
      properties:
        list:
          $ref: "#/components/schemas/ListId"
        name:
          type: string
          minLength: 1
          maxLength: 100
        sharedWithUserIds:
          type: array
          description: Colleagues who see the view read-only (decided 2026-10-16). Empty = private.
          maxItems: 200
          items:
            $ref: "#/components/schemas/Id"
        state:
          $ref: "#/components/schemas/ViewState"

    SavedView:
      type: object
      required: [id, list, name, owner, sharedWithUserIds, readOnly, state, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        list:
          $ref: "#/components/schemas/ListId"
        name:
          type: string
        owner:
          type: object
          required: [id, displayName]
          properties:
            id:
              $ref: "#/components/schemas/Id"
            displayName:
              type: string
        sharedWithUserIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        readOnly:
          type: boolean
          description: True when the view was shared with the user by someone else.
        state:
          $ref: "#/components/schemas/ViewState"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"

    # ------------------------------------------------------------- history and undo (§13.10)
    ChangeType:
      type: string
      enum: [create, edit, clone, delete, reorder, enable, disable, bulk, undo]

    ChangeField:
      type: object
      description: One field of one record, before and after the save.
      required: [entityId, field, before, after]
      properties:
        entityId:
          $ref: "#/components/schemas/Id"
        field:
          type: string
        before: {}
        after: {}

    Change:
      type: object
      required: [id, entityType, entityIds, changeType, diff, userId, userName, at, undoOfId, undoneById]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        entityType:
          type: string
          description: e.g. route_rule, rate_line, translation_rule, hlr_rule, customer_trunk.
        entityIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        changeType:
          $ref: "#/components/schemas/ChangeType"
        diff:
          type: array
          items:
            $ref: "#/components/schemas/ChangeField"
        note:
          type: [string, "null"]
        userId:
          $ref: "#/components/schemas/Id"
        userName:
          type: string
        ip:
          type: [string, "null"]
        at:
          $ref: "#/components/schemas/Timestamp"
        undoOfId:
          description: Set on an undo; the change it reverted.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        undoneById:
          description: Set when a later undo reverted this change.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"

    ChangePage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/Change"

    UndoRequest:
      type: object
      additionalProperties: false
      properties:
        resolution:
          type: string
          enum: [restore_mine, keep_current]
          description: |
            Answer to a 409. `restore_mine` overwrites the later values; `keep_current`
            undoes only the fields nobody changed since.
        note:
          type: string
          maxLength: 500

    UndoConflict:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [conflicts]
          properties:
            conflicts:
              type: array
              items:
                type: object
                required: [entityId, field, mine, current, changedBy, changedAt]
                properties:
                  entityId:
                    $ref: "#/components/schemas/Id"
                  field:
                    type: string
                  mine:
                    description: The value this change set (what undo would replace).
                  current:
                    description: The value set later by someone else.
                  changedBy:
                    type: string
                  changedAt:
                    $ref: "#/components/schemas/Timestamp"

    # ------------------------------------------------------------- reference data
    ReferenceData:
      type: object
      required: [businessCompanies, countries, productCategories, currencies, billingCycles, timezones, accountManagers]
      properties:
        businessCompanies:
          type: array
          items:
            type: object
            required: [id, name, baseCurrency]
            properties:
              id:
                $ref: "#/components/schemas/Id"
              name:
                type: string
              baseCurrency:
                type: string
        countries:
          type: array
          description: Sorted by name (§13.25).
          items:
            type: object
            required: [id, name, iso, dialCode]
            properties:
              id:
                $ref: "#/components/schemas/Id"
              name:
                type: string
              iso:
                type: string
              dialCode:
                type: string
        productCategories:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                $ref: "#/components/schemas/Id"
              name:
                type: string
        currencies:
          type: array
          items:
            type: object
            required: [iso, name, symbol]
            properties:
              iso:
                type: string
              name:
                type: string
              symbol:
                type: string
        billingCycles:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                $ref: "#/components/schemas/Id"
              name:
                type: string
        timezones:
          type: array
          items:
            type: string
        accountManagers:
          type: array
          items:
            type: object
            required: [id, displayName]
            properties:
              id:
                $ref: "#/components/schemas/Id"
              displayName:
                type: string

    # ------------------------------------------------------------- safe delete (§13.29)
    Archived:
      description: Set when the record is archived (deleted, §13.29); null otherwise.
      oneOf:
        - type: object
          required: [at, by]
          properties:
            at:
              $ref: "#/components/schemas/Timestamp"
            by:
              type: [string, "null"]
        - type: "null"

    DependencyItem:
      type: object
      required: [key, label, count, blocking]
      properties:
        key:
          type: string
          description: e.g. live_binds, trunks, route_rules, unpaid_invoices, balance, disputes, traffic_30d.
        label:
          type: string
        count:
          type: [number, "null"]
          description: Number (or amount for balance); null when it could not be determined.
        blocking:
          type: boolean
          description: Must be settled before archiving (§13.29).
        detail:
          type: [string, "null"]

    Dependencies:
      type: object
      required: [blocked, items]
      properties:
        blocked:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/DependencyItem"

    ArchiveRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
        override:
          type: boolean
          description: Administrators only, with a reason. Archives despite blocking dependencies.

    ArchiveBlocked:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [dependencies]
          properties:
            dependencies:
              $ref: "#/components/schemas/Dependencies"

    # ------------------------------------------------------------- enterprise record (§5.1)
    Contact:
      type: object
      required: [emails]
      additionalProperties: false
      properties:
        name:
          type: [string, "null"]
          maxLength: 200
        phone:
          type: [string, "null"]
          maxLength: 50
        emails:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: email

    Contacts:
      type: object
      required: [commercial, technical, rates, finance]
      additionalProperties: false
      properties:
        commercial:
          $ref: "#/components/schemas/Contact"
        technical:
          $ref: "#/components/schemas/Contact"
        rates:
          $ref: "#/components/schemas/Contact"
        finance:
          $ref: "#/components/schemas/Contact"

    Address:
      type: object
      required: [line1]
      additionalProperties: false
      properties:
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: [string, "null"]
          maxLength: 200
        city:
          type: [string, "null"]
          maxLength: 100
        state:
          type: [string, "null"]
          maxLength: 100
        countryId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        zip:
          type: [string, "null"]
          maxLength: 20

    CreditAlertPercent:
      type: object
      required: [notice, warning, critical]
      additionalProperties: false
      description: Credit alert levels in % of the credit limit (defaults 50 / 70 / 90).
      properties:
        notice:
          type: integer
          minimum: 1
          maximum: 100
        warning:
          type: integer
          minimum: 1
          maximum: 100
        critical:
          type: integer
          minimum: 1
          maximum: 100

    EnterpriseInput:
      type: object
      description: Add/Edit form (§5.1). The account manager is set on create; later changes go through handover (§13.30).
      required: [name, alias, type, tier, status, businessCompanyId, address, contacts, creditAlertPercent]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        alias:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: "#/components/schemas/EnterpriseType"
        tier:
          $ref: "#/components/schemas/EnterpriseTier"
        status:
          $ref: "#/components/schemas/RecordStatus"
        businessCompanyId:
          $ref: "#/components/schemas/Id"
        accountManagerId:
          $ref: "#/components/schemas/Id"
          description: Required on create; ignored on update (use handover).
        bindAlert:
          type: boolean
        creditAlert:
          type: boolean
        creditAlertPercent:
          $ref: "#/components/schemas/CreditAlertPercent"
        address:
          $ref: "#/components/schemas/Address"
        website:
          type: [string, "null"]
          maxLength: 300
        fax:
          type: [string, "null"]
          maxLength: 50
        registrationNumber:
          type: [string, "null"]
          maxLength: 100
        vatNumber:
          type: [string, "null"]
          maxLength: 100
        billingTimezone:
          type: string
          description: Day and month totals are cut at midnight in this zone (§13.31).
        rateNoticeDays:
          type: integer
          minimum: 0
          maximum: 90
          description: Notice period for rate increases (§13.14, §13.32).
        contacts:
          $ref: "#/components/schemas/Contacts"

    EnterpriseDetail:
      allOf:
        - $ref: "#/components/schemas/Enterprise"
        - type: object
          required: [bindAlert, creditAlert, creditAlertPercent, address, contacts, billingTimezone, rateNoticeDays, archived, trunkCounts]
          properties:
            bindAlert:
              type: boolean
            creditAlert:
              type: boolean
            creditAlertPercent:
              $ref: "#/components/schemas/CreditAlertPercent"
            address:
              $ref: "#/components/schemas/Address"
            website:
              type: [string, "null"]
            fax:
              type: [string, "null"]
            registrationNumber:
              type: [string, "null"]
            vatNumber:
              type: [string, "null"]
            billingTimezone:
              type: string
            rateNoticeDays:
              type: integer
            contacts:
              $ref: "#/components/schemas/Contacts"
            archived:
              $ref: "#/components/schemas/Archived"
            trunkCounts:
              type: object
              required: [customer, vendor]
              properties:
                customer:
                  type: integer
                vendor:
                  type: integer

    EnterpriseSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/EnterpriseDetail"
        change:
          description: The change this save recorded, for the Undo toast (§13.10); null when nothing differed.
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    # ------------------------------------------------------------- billing (§5.3)
    BillingSideFields:
      type: object
      description: Shared fields of a billing side form and record.
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
        billingCycleId:
          $ref: "#/components/schemas/Id"
        timezone:
          type: string
        billingType:
          type: [string, "null"]
          enum: [prepaid, postpaid, null]
          description: Customer side only.
        creditLimit:
          type: [number, "null"]
          minimum: 0
          description: Customer side, postpaid.
        openingBalance:
          type: number
        autoInvoicing:
          type: boolean
          description: Customer side only.
        sendPaymentConfirmation:
          type: boolean
          description: Default for new payments (§13.33).
        description:
          type: [string, "null"]
          maxLength: 1000

    BillingSideInput:
      allOf:
        - $ref: "#/components/schemas/BillingSideFields"
      required: [currency, billingCycleId, timezone, openingBalance]
      unevaluatedProperties: false

    BillingSide:
      required: [currency, billingCycleId, timezone, openingBalance]
      allOf:
        - $ref: "#/components/schemas/BillingSideFields"
        - type: object
          required: [balance, billingCycleName, updatedBy, updatedAt]
          properties:
            balance:
              type: number
              description: Opening balance + usage charges − payments and credits + debits, in the side's currency.
            billingCycleName:
              type: string
            updatedBy:
              type: [string, "null"]
            updatedAt:
              $ref: "#/components/schemas/Timestamp"

    Beneficiary:
      type: object
      additionalProperties: false
      properties:
        beneficiaryName:
          type: [string, "null"]
        address:
          type: [string, "null"]
        bank:
          type: [string, "null"]
        bankAddress:
          type: [string, "null"]
        currency:
          type: [string, "null"]
        accountNumber:
          type: [string, "null"]
        iban:
          type: [string, "null"]
        swift:
          type: [string, "null"]
        walletAddress:
          type: [string, "null"]
          description: Crypto wallet.

    EnterpriseBilling:
      type: object
      required: [customer, vendor, beneficiary]
      properties:
        customer:
          oneOf:
            - $ref: "#/components/schemas/BillingSide"
            - type: "null"
        vendor:
          oneOf:
            - $ref: "#/components/schemas/BillingSide"
            - type: "null"
        beneficiary:
          $ref: "#/components/schemas/Beneficiary"

    EnterpriseBillingInput:
      type: object
      additionalProperties: false
      properties:
        customer:
          $ref: "#/components/schemas/BillingSideInput"
        vendor:
          $ref: "#/components/schemas/BillingSideInput"
        beneficiary:
          $ref: "#/components/schemas/Beneficiary"

    BillingSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/EnterpriseBilling"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    # ------------------------------------------------------------- AM handover (§13.30)
    AmPeriod:
      type: object
      required: [userId, userName, startsAt, endsAt, note]
      properties:
        userId:
          $ref: "#/components/schemas/Id"
        userName:
          type: string
        startsAt:
          $ref: "#/components/schemas/Timestamp"
        endsAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        note:
          type: [string, "null"]

    HandoverRequest:
      type: object
      required: [userId]
      additionalProperties: false
      properties:
        userId:
          $ref: "#/components/schemas/Id"
        effectiveAt:
          $ref: "#/components/schemas/Timestamp"
          description: Default now. A future time schedules the handover.
        note:
          type: string
          maxLength: 500

    HandoverSaved:
      type: object
      required: [periods, change]
      properties:
        periods:
          type: array
          items:
            $ref: "#/components/schemas/AmPeriod"
        change:
          $ref: "#/components/schemas/Change"

    # ------------------------------------------------------------- docs (§5.2)
    EnterpriseDoc:
      type: object
      required: [id, name, fileName, contentType, size, createdBy, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        fileName:
          type: string
        contentType:
          type: string
        size:
          type: integer
        createdBy:
          type: [string, "null"]
        createdAt:
          $ref: "#/components/schemas/Timestamp"

    EnterpriseDocUpload:
      type: object
      required: [name, fileName, dataBase64]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          maxLength: 100
        dataBase64:
          type: string
          maxLength: 14000000
          description: File content, base64 (at most 10 MB decoded).

    # ------------------------------------------------------------- trunks (§5.4, §5.5)
    TrunkProtocol:
      type: string
      enum: [smpp, http]
    BillingType:
      type: string
      enum: [attempt, submit, reported, delivery]
      description: The event that makes a message billable (§7).
    SslType:
      type: string
      enum: [none, tls1.2, tls1.3]
      description: TLS 1.2/1.3 replace the reference platform's SSLv2/SSLv3/TLSv1 (§16).
    LimitPeriod:
      type: string
      enum: [hour, day, week, month, billing_cycle]

    TrunkListRow:
      type: object
      required: [id, enterpriseId, enterpriseName, name, username, categoryId, category, protocol, tps, status, bindType, rulesCount, updatedBy, updatedAt, archived]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        enterpriseId:
          $ref: "#/components/schemas/Id"
        enterpriseName:
          type: string
        name:
          type: string
        username:
          type: string
        categoryId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        category:
          type: [string, "null"]
        protocol:
          $ref: "#/components/schemas/TrunkProtocol"
        tps:
          type: integer
        status:
          $ref: "#/components/schemas/RecordStatus"
        bindType:
          type: string
        rulesCount:
          type: integer
          description: Translation rules running on the trunk (replaces "Translation Rule Group", §13.2).
        updatedBy:
          type: [string, "null"]
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        archived:
          type: boolean

    CustomerTrunkPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
