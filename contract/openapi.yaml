              schema:
                $ref: "#/components/schemas/RouteDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /route-rules/simulate:
    post:
      tags: [routing]
      operationId: simulateRoute
      summary: "Route Simulator: run a sample message through all rules"
      description: |
        Rules are tried by priority; the first that matches decides (continue YES moves on). Takes a
        simulated TPS and revenue (§13.8, §13.9).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteTestRequest"
      responses:
        "200":
          description: The rules tried and the decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteSimulation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rate-lookup/destinations:
    get:
      tags: [rates]
      operationId: resolveLookupDestinations
      summary: "Rate Lookup: find destinations as you type (§13.16)"
      description: |
        `q` is a country, network, MCCMNC, dial code or a full phone number. A number is resolved
        to its network by the longest dial-code prefix, or by a (simulated) HLR lookup with
        `live=true`. Country matches list the country-level code ("505 · all") first.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: live
          in: query
          required: false
          description: Resolve a phone number by HLR instead of by prefix (default false).
          schema:
            type: boolean
      responses:
        "200":
          description: Matching destinations, best first (at most 20)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupResolution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rate-lookup:
    post:
      tags: [rates]
      operationId: lookupRates
      summary: "Rate Lookup easy mode: vendor costs and client rates for one destination"
      description: |
        Two panels (§13.16): every vendor trunk with a rate, cheapest first, and every customer
        trunk selling the destination with its margin against the best vendor and against the
        vendor routing would use for that trunk today (§6.3 rules). A network falls back to the
        country-level line ("all networks") when a table has no line for it; sender-ID lines
        are left out unless `senderId` is given.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateLookupRequest"
      responses:
        "200":
          description: The two panels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLookupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rate-lookup/matrix:
    post:
      tags: [rates]
      operationId: rateLookupMatrix
      summary: "Rate Lookup advanced mode: many destinations at once, paged"
      description: |
        Rows are destinations, paged with `limit` and `cursor`; columns depend on the view
        (§13.16): vendor trunks (cost comparison), customer trunks (client rates or margin
        matrix), or ranks 1..N (cheapest vendors with quality). At most 60 columns, the trunks
        covering most of the destinations first (`columnsTruncated` says when more exist).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateMatrixRequest"
      responses:
        "200":
          description: One page of the matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateMatrix"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rate-lookup/matrix/export:
    post:
      tags: [rates]
      operationId: exportRateLookupMatrix
      summary: "Export the whole advanced lookup as CSV (§13.16)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateMatrixRequest"
      responses:
        "200":
          description: CSV file, UTF-8, header row; every destination row (up to 20,000)
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rate-lookups:
    get:
      tags: [rates]
      operationId: listSavedLookups
      summary: Saved lookups visible to the user (own and shared with them)
      responses:
        "200":
          description: Saved lookups, own first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedLookup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [rates]
      operationId: createSavedLookup
      summary: "Save an advanced lookup, e.g. \"Ahmad's clients – GCC\" (§13.16)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedLookupInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedLookup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rate-lookups/{id}:
    put:
      tags: [rates]
      operationId: updateSavedLookup
      summary: Change a saved lookup (owner only)
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedLookupInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedLookup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [rates]
      operationId: deleteSavedLookup
      summary: Delete a saved lookup (owner only)
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /reports/enterprise/query:
    post:
      tags: [reports]
      operationId: queryEnterpriseReport
      summary: "Enterprise report: the billing team's traffic report (§10, §13.31)"
      description: |
        Traffic per enterprise (customer or vendor side) for a period, cut into hours, days, weeks
        or months in the chosen time zone: the partner's billing time zone (default; a trunk's
        own when set), UTC or the platform time zone (§13.31). Rows group by the chosen keys
        plus the partner currency; every metric of §10 is returned. Filters, sort and paging
        follow the list grammar (§13.25) on the `enterprise_report` field catalogue; `totals`
        covers every matching row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnterpriseReportQuery"
      responses:
        "200":
          description: One page of report rows, with totals and the time zones used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseReportPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /reports/enterprise/export:
    post:
      tags: [reports]
      operationId: exportEnterpriseReport
      summary: "Export the Enterprise report as CSV, with the time zone printed (§13.31)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnterpriseReportExport"
      responses:
        "200":
          description: CSV file, UTF-8. The first lines name the period and the time zone(s) used.
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"


components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sms_session
      description: Session cookie set at sign-in (login flow added in a later revision).

  parameters:
    ViewAs:
      name: X-View-As
      in: header
      required: false
      description: |
        Administrators only: answer as this user would see it, with their visibility policy (§13.17 preview).
        Every operation honours it; ignored for other users.
      schema:
        $ref: "#/components/schemas/Id"
    TrafficWindow:
      name: window
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/TrafficWindow"
    RateView:
      name: view
      in: query
      required: false
      description: Which lines (§13.12 view tabs).
      schema:
        type: string
        enum: [current, scheduled, closed]
        default: current
    DocId:
      name: docId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    RecordId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ListId:
      name: list
      in: path
      required: true
      description: Identifier of a list page.
      schema:
        $ref: "#/components/schemas/ListId"

  responses:
    BadRequest:
      description: The request does not match the contract (e.g. unknown filter field or operator)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Not signed in, or not allowed by the user's GUI Access Group (§1)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such record
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The record clashes with another live record (e.g. a duplicate name or code) or is in use
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Signed in, but this record or action belongs to someone else
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: |
        The data store behind this operation is not reachable. In the frontend phase this
        means the local databases are not running or not seeded (`npm run db:up`,
        `npm run seed:small`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    # ------------------------------------------------------------------ common
    Id:
      type: integer
      format: int64
      minimum: 1
      description: Numeric record ID, shown to users (e.g. "Name – Alias (ID)").

    Timestamp:
      type: string
      format: date-time
      description: UTC, ISO 8601.

    Audit:
      type: object
      description: Who changed the record and when (spec §1).
      required: [updatedBy, updatedAt]
      properties:
        createdBy:
          type: [string, "null"]
        createdAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        updatedBy:
          type: string
        updatedAt:
          $ref: "#/components/schemas/Timestamp"

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          description: Field-level errors, for forms and for invalid filters.
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
                description: JSON pointer into the request, e.g. `/filter/conditions/0/field`.
              message:
                type: string

    # ------------------------------------------------------------------ system
    Health:
      type: object
      required: [status, version, contractVersion, serverTime, backend]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: Build version of the server answering the contract.
        contractVersion:
          type: string
          description: The `info.version` of this contract the server implements.
        serverTime:
          $ref: "#/components/schemas/Timestamp"
        backend:
          type: string
          enum: [mock, elixir]
          description: Which implementation answers the contract.

    Theme:
      type: string
      enum: [light, dark]
      description: Colour theme (§15.2).

    CurrentUser:
      type: object
      required: [id, username, displayName, role, businessCompany, preferences, permissions]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        username:
          type: string
        displayName:
          type: string
        initials:
          type: string
          description: Shown in the avatar (§3).
        role:
          type: string
          description: e.g. Admin, NOC, Rates, Finance, Account Manager.
        businessCompany:
          type: string
          description: The selling entity the user belongs to.
        preferences:
          type: object
          required: [theme, dashboard]
          properties:
            theme:
              $ref: "#/components/schemas/Theme"
            openInNewTab:
              type: boolean
              default: true
              description: Menu items open in a new tab or the current tab (§13.5).
            animations:
              type: boolean
              default: true
              description: Live value animations on/off (§13.3).
            dashboard:
              $ref: "#/components/schemas/DashboardSettings"
            alertSounds:
              $ref: "#/components/schemas/AlertSoundPrefs"
        permissions:
          type: array
          description: GUI Access Group permission keys; buttons not covered are hidden (§1).
          items:
            type: string

    PreferencesUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        theme:
          $ref: "#/components/schemas/Theme"
        openInNewTab:
          type: boolean
        animations:
          type: boolean
        dashboard:
          $ref: "#/components/schemas/DashboardSettings"
        alertSounds:
          $ref: "#/components/schemas/AlertSoundPrefs"

    DashboardSettings:
      type: object
      additionalProperties: false
      description: The live dashboard's time window, thresholds and panels, saved per user (§13.3).
      required: [windowMinutes, thresholdPct, chartMinutes, hiddenPanels]
      properties:
        windowMinutes:
          type: integer
          enum: [5, 15, 30, 60]
          description: Traffic movers compare this window with the one before.
        thresholdPct:
          type: number
          minimum: 5
          maximum: 500
          description: A client counts as increasing or decreasing beyond this change.
        chartMinutes:
          type: integer
          enum: [5, 15, 60]
          description: Length of the live TPS chart.
        hiddenPanels:
          type: array
          items:
            type: string
            enum: [summary, movers, chart, tps, tops, destinations]

    WorkspaceTab:
      type: object
      description: One open page tab (§13.5). Per-tab page state (filters, scroll) stays in the browser.
      required: [id, path, title, pinned]
      additionalProperties: false
      properties:
        id:
          type: string
          maxLength: 64
        path:
          type: string
          maxLength: 2000
          description: GUI route of the page, with its query string.
        title:
          type: string
          maxLength: 200
        pinned:
          type: boolean

    Workspace:
      type: object
      required: [tabs, activeTabId]
      additionalProperties: false
      properties:
        tabs:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/WorkspaceTab"
        activeTabId:
          type: [string, "null"]

    SearchHit:
      type: object
      required: [kind, id, label]
      properties:
        kind:
          type: string
          enum: [enterprise, customer_trunk, vendor_trunk, rate_table, route_rule, user]
        id:
          $ref: "#/components/schemas/Id"
        label:
          type: string
          description: Display name, e.g. "Name – Alias (ID)" for enterprises.
        detail:
          type: [string, "null"]
          description: Secondary text, e.g. the trunk's enterprise or the rule's priority.

    SearchResults:
      type: object
      required: [hits]
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"

    # ------------------------------------------------------------------ users (§11)
    UserPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/UserRow"

    # ------------------------------------------------------------- saved views (§13.25)
    ViewState:
      type: object
      description: What a saved view restores on a grid.
      additionalProperties: false
      properties:
        filter:
          $ref: "#/components/schemas/FilterGroup"
        search:
          type: string
          maxLength: 200
        sort:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/SortKey"
        columns:
          type: array
          description: Visible columns in display order (field names).
          maxItems: 200
          items:
            type: string
        report:
          description: Master Report views (list master_report) - the report settings (§13.15).
          allOf:
            - $ref: "#/components/schemas/MasterReportSettings"
          unevaluatedProperties: false

    SavedViewInput:
      type: object
      required: [list, name, state]
      additionalProperties: false
      properties:
        list:
          $ref: "#/components/schemas/ListId"
        name:
          type: string
          minLength: 1
          maxLength: 100
        sharedWithUserIds:
          type: array
          description: Colleagues who see the view read-only (decided 2026-10-16). Empty = private.
          maxItems: 200
          items:
            $ref: "#/components/schemas/Id"
        state:
          $ref: "#/components/schemas/ViewState"

    SavedView:
      type: object
      required: [id, list, name, owner, sharedWithUserIds, readOnly, state, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        list:
          $ref: "#/components/schemas/ListId"
        name:
          type: string
        owner:
          type: object
          required: [id, displayName]
          properties:
            id:
              $ref: "#/components/schemas/Id"
            displayName:
              type: string
        sharedWithUserIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        readOnly:
          type: boolean
          description: True when the view was shared with the user by someone else.
        state:
          $ref: "#/components/schemas/ViewState"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"

    # ------------------------------------------------------------- history and undo (§13.10)
    ChangeType:
      type: string
      enum: [create, edit, clone, delete, reorder, enable, disable, bulk, undo, import]

    ChangeField:
      type: object
      description: One field of one record, before and after the save.
      required: [entityId, field, before, after]
      properties:
        entityId:
          $ref: "#/components/schemas/Id"
        field:
          type: string
        before: {}
        after: {}

    Change:
      type: object
      required: [id, entityType, entityIds, changeType, diff, userId, userName, at, undoOfId, undoneById]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        entityType:
          type: string
          description: e.g. route_rule, rate_line, translation_rule, hlr_rule, customer_trunk.
        entityIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        changeType:
          $ref: "#/components/schemas/ChangeType"
        diff:
          type: array
          items:
            $ref: "#/components/schemas/ChangeField"
        note:
          type: [string, "null"]
        userId:
          $ref: "#/components/schemas/Id"
        userName:
          type: string
        ip:
          type: [string, "null"]
        at:
          $ref: "#/components/schemas/Timestamp"
        undoOfId:
          description: Set on an undo; the change it reverted.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        undoneById:
          description: Set when a later undo reverted this change.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"

    ChangePage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/Change"

    UndoRequest:
      type: object
      additionalProperties: false
      properties:
        resolution:
          type: string
          enum: [restore_mine, keep_current]
          description: |
            Answer to a 409. `restore_mine` overwrites the later values; `keep_current`
            undoes only the fields nobody changed since.
        note:
          type: string
          maxLength: 500

    UndoConflict:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [conflicts]
          properties:
            conflicts:
              type: array
              items:
                type: object
                required: [entityId, field, mine, current, changedBy, changedAt]
                properties:
                  entityId:
                    $ref: "#/components/schemas/Id"
                  field:
                    type: string
                  mine:
                    description: The value this change set (what undo would replace).
                  current:
                    description: The value set later by someone else.
                  changedBy:
                    type: string
                  changedAt:
                    $ref: "#/components/schemas/Timestamp"

    # ------------------------------------------------------------- reference data
    ReferenceData:
      type: object
      required: [businessCompanies, countries, productCategories, currencies, billingCycles, timezones, accountManagers, routeRuleGroups, numberLists, platformCurrency, platformTimezone]
      properties:
        businessCompanies:
          type: array
          items:
            type: object
            required: [id, name, baseCurrency]
            properties:
              id:
                $ref: "#/components/schemas/Id"
              name:
                type: string
              baseCurrency:
                type: string
        countries:
          type: array
          description: Sorted by name (§13.25).
          items:
            type: object
            required: [id, name, iso, dialCode]
            properties:
              id:
                $ref: "#/components/schemas/Id"
              name:
                type: string
              iso:
                type: string
              dialCode:
                type: string
        productCategories:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                $ref: "#/components/schemas/Id"
              name:
                type: string
        currencies:
          type: array
          items:
            type: object
            required: [iso, name, symbol]
            properties:
              iso:
                type: string
              name:
                type: string
              symbol:
                type: string
        billingCycles:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                $ref: "#/components/schemas/Id"
              name:
                type: string
        timezones:
          type: array
          items:
            type: string
        accountManagers:
          type: array
          items:
            type: object
            required: [id, displayName]
            properties:
              id:
                $ref: "#/components/schemas/Id"
              displayName:
                type: string
        platformTimezone:
          type: string
          description: The platform time zone (IANA name), one of the Enterprise report's time zone choices (§13.31).
        platformCurrency:
          type: string
          description: |
            ISO code of the platform currency (decided 2026-10-16: EUR by default, configurable).
            Converted rates, margins, revenue conditions and every cross-company total are in it.
        routeRuleGroups:
          description: Route rule groups for chaining with Next group (§6.3, optional since §13.2).
          type: array
          items:
            $ref: "#/components/schemas/Named"
        numberLists:
          description: Number lists for sender, receiver and whitelist conditions (§6.4, §13.27).
          type: array
          items:
            type: object
            required: [id, name, listType]
            properties:
              id:
                $ref: "#/components/schemas/Id"
              name:
                type: string
              listType:
                type: string
                enum: [random, tag, sender_id_template]

    # ------------------------------------------------------------- safe delete (§13.29)
    Archived:
      description: Set when the record is archived (deleted, §13.29); null otherwise.
      oneOf:
        - type: object
          required: [at, by]
          properties:
            at:
              $ref: "#/components/schemas/Timestamp"
            by:
              type: [string, "null"]
        - type: "null"

    DependencyItem:
      type: object
      required: [key, label, count, blocking]
      properties:
        key:
          type: string
          description: e.g. live_binds, trunks, route_rules, unpaid_invoices, balance, disputes, traffic_30d.
        label:
          type: string
        count:
          type: [number, "null"]
          description: Number (or amount for balance); null when it could not be determined.
        blocking:
          type: boolean
          description: Must be settled before archiving (§13.29).
        detail:
          type: [string, "null"]

    Dependencies:
      type: object
      required: [blocked, items]
      properties:
        blocked:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/DependencyItem"

    ArchiveRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
        override:
          type: boolean
          description: Administrators only, with a reason. Archives despite blocking dependencies.

    ArchiveBlocked:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [dependencies]
          properties:
            dependencies:
              $ref: "#/components/schemas/Dependencies"

    # ------------------------------------------------------------- enterprise record (§5.1)
    Contact:
      type: object
      required: [emails]
      additionalProperties: false
      properties:
        name:
          type: [string, "null"]
          maxLength: 200
        phone:
          type: [string, "null"]
          maxLength: 50
        emails:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: email

    Contacts:
      type: object
      required: [commercial, technical, rates, finance]
      additionalProperties: false
      properties:
        commercial:
          $ref: "#/components/schemas/Contact"
        technical:
          $ref: "#/components/schemas/Contact"
        rates:
          $ref: "#/components/schemas/Contact"
        finance:
          $ref: "#/components/schemas/Contact"

    Address:
      type: object
      required: [line1]
      additionalProperties: false
      properties:
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: [string, "null"]
          maxLength: 200
        city:
          type: [string, "null"]
          maxLength: 100
        state:
          type: [string, "null"]
          maxLength: 100
        countryId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        zip:
          type: [string, "null"]
          maxLength: 20

    CreditAlertPercent:
      type: object
      required: [notice, warning, critical]
      additionalProperties: false
      description: Credit alert levels in % of the credit limit (defaults 50 / 70 / 90).
      properties:
        notice:
          type: integer
          minimum: 1
          maximum: 100
        warning:
          type: integer
          minimum: 1
          maximum: 100
        critical:
          type: integer
          minimum: 1
          maximum: 100

    EnterpriseInput:
      type: object
      description: Add/Edit form (§5.1). The account manager is set on create; later changes go through handover (§13.30).
      required: [name, alias, type, tier, status, businessCompanyId, address, contacts, creditAlertPercent]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        alias:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: "#/components/schemas/EnterpriseType"
        tier:
          $ref: "#/components/schemas/EnterpriseTier"
        status:
          $ref: "#/components/schemas/RecordStatus"
        businessCompanyId:
          $ref: "#/components/schemas/Id"
        accountManagerId:
          $ref: "#/components/schemas/Id"
          description: Required on create; ignored on update (use handover).
        bindAlert:
          type: boolean
        creditAlert:
          type: boolean
        creditAlertPercent:
          $ref: "#/components/schemas/CreditAlertPercent"
        address:
          $ref: "#/components/schemas/Address"
        website:
          type: [string, "null"]
          maxLength: 300
        fax:
          type: [string, "null"]
          maxLength: 50
        registrationNumber:
          type: [string, "null"]
          maxLength: 100
        vatNumber:
          type: [string, "null"]
          maxLength: 100
        billingTimezone:
          type: string
          description: Day and month totals are cut at midnight in this zone (§13.31).
        rateNoticeDays:
          type: integer
          minimum: 0
          maximum: 90
          description: Notice period for rate increases (§13.14, §13.32).
        contacts:
          $ref: "#/components/schemas/Contacts"

    EnterpriseDetail:
      allOf:
        - $ref: "#/components/schemas/Enterprise"
        - type: object
          required: [bindAlert, creditAlert, creditAlertPercent, address, contacts, billingTimezone, rateNoticeDays, archived, trunkCounts]
          properties:
            bindAlert:
              type: boolean
            creditAlert:
              type: boolean
            creditAlertPercent:
              $ref: "#/components/schemas/CreditAlertPercent"
            address:
              $ref: "#/components/schemas/Address"
            website:
              type: [string, "null"]
            fax:
              type: [string, "null"]
            registrationNumber:
              type: [string, "null"]
            vatNumber:
              type: [string, "null"]
            billingTimezone:
              type: string
            rateNoticeDays:
              type: integer
            contacts:
              $ref: "#/components/schemas/Contacts"
            archived:
              $ref: "#/components/schemas/Archived"
            trunkCounts:
              type: object
              required: [customer, vendor]
              properties:
                customer:
                  type: integer
                vendor:
                  type: integer

    EnterpriseSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/EnterpriseDetail"
        change:
          description: The change this save recorded, for the Undo toast (§13.10); null when nothing differed.
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    # ------------------------------------------------------------- billing (§5.3)
    BillingSideFields:
      type: object
      description: Shared fields of a billing side form and record.
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
        billingCycleId:
          $ref: "#/components/schemas/Id"
        timezone:
          type: string
        billingType:
          type: [string, "null"]
          enum: [prepaid, postpaid, null]
          description: Customer side only.
        creditLimit:
          type: [number, "null"]
          minimum: 0
          description: Customer side, postpaid.
        openingBalance:
          type: number
          description: Positive = the partner starts in credit, negative = they start owing (§7 balance sign).
        autoInvoicing:
          type: boolean
          description: Customer side only.
        sendPaymentConfirmation:
          type: boolean
          description: Default for new payments (§13.33).
        description:
          type: [string, "null"]
          maxLength: 1000

    BillingSideInput:
      allOf:
        - $ref: "#/components/schemas/BillingSideFields"
      required: [currency, billingCycleId, timezone, openingBalance]
      unevaluatedProperties: false

    BillingSide:
      required: [currency, billingCycleId, timezone, openingBalance]
      allOf:
        - $ref: "#/components/schemas/BillingSideFields"
        - type: object
          required: [balance, billingCycleName, updatedBy, updatedAt]
          properties:
            balance:
              type: number
              description: "Opening balance + payments and credits − usage charges, in the side's currency (§7, decided 2026-10-17): positive = the partner's credit with us, negative = what the client owes us (customer) or what we owe the vendor (vendor)."
            billingCycleName:
              type: string
            updatedBy:
              type: [string, "null"]
            updatedAt:
              $ref: "#/components/schemas/Timestamp"

    Beneficiary:
      type: object
      additionalProperties: false
      properties:
        beneficiaryName:
          type: [string, "null"]
        address:
          type: [string, "null"]
        bank:
          type: [string, "null"]
        bankAddress:
          type: [string, "null"]
        currency:
          type: [string, "null"]
        accountNumber:
          type: [string, "null"]
        iban:
          type: [string, "null"]
        swift:
          type: [string, "null"]
        walletAddress:
          type: [string, "null"]
          description: Crypto wallet.

    EnterpriseBilling:
      type: object
      required: [customer, vendor, beneficiary]
      properties:
        customer:
          oneOf:
            - $ref: "#/components/schemas/BillingSide"
            - type: "null"
        vendor:
          oneOf:
            - $ref: "#/components/schemas/BillingSide"
            - type: "null"
        beneficiary:
          $ref: "#/components/schemas/Beneficiary"

    EnterpriseBillingInput:
      type: object
      additionalProperties: false
      properties:
        customer:
          $ref: "#/components/schemas/BillingSideInput"
        vendor:
          $ref: "#/components/schemas/BillingSideInput"
        beneficiary:
          $ref: "#/components/schemas/Beneficiary"

    BillingSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/EnterpriseBilling"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    # ------------------------------------------------------------- AM handover (§13.30)
    AmPeriod:
      type: object
      required: [userId, userName, startsAt, endsAt, note]
      properties:
        userId:
          $ref: "#/components/schemas/Id"
        userName:
          type: string
        startsAt:
          $ref: "#/components/schemas/Timestamp"
        endsAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        note:
          type: [string, "null"]

    HandoverRequest:
      type: object
      required: [userId]
      additionalProperties: false
      properties:
        userId:
          $ref: "#/components/schemas/Id"
        effectiveAt:
          $ref: "#/components/schemas/Timestamp"
          description: Default now. A future time schedules the handover.
        note:
          type: string
          maxLength: 500

    HandoverSaved:
      type: object
      required: [periods, change]
      properties:
        periods:
          type: array
          items:
            $ref: "#/components/schemas/AmPeriod"
        change:
          $ref: "#/components/schemas/Change"

    # ------------------------------------------------------------- docs (§5.2)
    EnterpriseDoc:
      type: object
      required: [id, name, fileName, contentType, size, createdBy, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        fileName:
          type: string
        contentType:
          type: string
        size:
          type: integer
        createdBy:
          type: [string, "null"]
        createdAt:
          $ref: "#/components/schemas/Timestamp"

    EnterpriseDocUpload:
      type: object
      required: [name, fileName, dataBase64]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          maxLength: 100
        dataBase64:
          type: string
          maxLength: 14000000
          description: File content, base64 (at most 10 MB decoded).

    # ------------------------------------------------------------- trunks (§5.4, §5.5)
    TrunkProtocol:
      type: string
      enum: [smpp, http]
    BillingType:
      type: string
      enum: [attempt, submit, reported, delivery]
      description: The event that makes a message billable (§7).
    SslType:
      type: string
      enum: [none, tls1.2, tls1.3]
      description: TLS 1.2/1.3 replace the reference platform's SSLv2/SSLv3/TLSv1 (§16).
    LimitPeriod:
      type: string
      enum: [hour, day, week, month, billing_cycle]

    TrunkListRow:
      type: object
      required: [id, enterpriseId, enterpriseName, name, username, categoryId, category, currency, protocol, tps, status, bindType, rulesCount, updatedBy, updatedAt, archived]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        enterpriseId:
          $ref: "#/components/schemas/Id"
        enterpriseName:
          type: string
        name:
          type: string
        username:
          type: [string, "null"]
        categoryId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        category:
          type: [string, "null"]
        currency:
          type: string
          description: |
            The trunk's currency: its first rate table's (a vendor trunk's buy table), else the enterprise's
            billing currency for that side, else the platform currency. MO reference book amounts are in it.
        protocol:
          $ref: "#/components/schemas/TrunkProtocol"
        tps:
          type: integer
        status:
          $ref: "#/components/schemas/RecordStatus"
        bindType:
          type: string
        rulesCount:
          type: integer
          description: Translation rules running on the trunk (replaces "Translation Rule Group", §13.2).
        updatedBy:
          type: [string, "null"]
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        archived:
          type: boolean

    CustomerTrunkPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/TrunkListRow"

    VendorTrunkPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/TrunkListRow"

    CustomerTrunkFields:
      description: Shared fields of the customer trunk form and record.
      type: object
      properties:
        enterpriseId:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          minLength: 1
          maxLength: 100
        protocol:
          $ref: "#/components/schemas/TrunkProtocol"
        categoryId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        billingType:
          $ref: "#/components/schemas/BillingType"
        status:
          $ref: "#/components/schemas/RecordStatus"
        bindType:
          type: string
          enum: [TX, RX, TR, AUTO]
        considerHlrRate:
          type: boolean
        serviceTypeRouting:
          type: boolean
        partWiseRouting:
          type: boolean
        hostIps:
          type: array
          minItems: 1
          maxItems: 50
          description: Allowed client IP addresses.
          items:
            anyOf:
              - type: string
                format: ipv4
              - type: string
                format: ipv6
        username:
          type: string
          minLength: 1
          maxLength: 16
          description: SMPP system_id.
        password:
          type: string
          minLength: 1
          maxLength: 9
          writeOnly: true
          description: SMPP password (system_id max 16, password max 9 characters in SMPP v3.4). Required on create; omit to keep.
        maxConnections:
          type: integer
          minimum: 1
          maximum: 10
        systemType:
          type: [string, "null"]
          maxLength: 13
        port:
          type: integer
          minimum: 1
          maximum: 65535
        sslType:
          $ref: "#/components/schemas/SslType"
        dlrPushUrl:
          type: [string, "null"]
          maxLength: 500
        moPushUrl:
          type: [string, "null"]
          maxLength: 500
        delayedSubmit:
          type: boolean
        sendBind:
          type: boolean
        dlrSessionAffinity:
          type: string
          enum: [strict, same_ip, same_trunk]
          description: Where receipts go when the submitting session is gone (§13.1).
        dlrHoldHours:
          type: integer
          minimum: 0
          maximum: 720
        tps:
          type: integer
          minimum: 1
          maximum: 100000
        overflowBuffer:
          type: integer
          minimum: 0
        loopDetection:
          type: boolean
        defaultCoding:
          type: integer
          enum: [0, 3]
        rateTableIds:
          type: array
          description: Rate tables in order; the first with a line for the destination wins (§5.4).
          maxItems: 20
          items:
            $ref: "#/components/schemas/Id"
        expressVendorTrunkId:
          description: Express vendor selection - bypass routing (§5.4).
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        expressMargin:
          type: [number, "null"]
        revenueLimit:
          type: [number, "null"]
          minimum: 0
        revenueLimitPeriod:
          oneOf:
            - $ref: "#/components/schemas/LimitPeriod"
            - type: "null"
        billingTimezone:
          type: [string, "null"]
          maxLength: 64
          description: Billing time zone of the trunk (§13.31); null = the enterprise's.


    CustomerTrunkInput:
      description: Customer trunk form (§5.4) with session affinity (§13.1) and revenue limit (§13.26).
      allOf:
        - $ref: "#/components/schemas/CustomerTrunkFields"
      required: [enterpriseId, name, protocol, billingType, status, bindType, hostIps, username, maxConnections, port, tps]
      unevaluatedProperties: false

    TrunkDetailCommon:
      type: object
      required: [id, enterpriseName, passwordSet, archived, ownRateTableId]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        enterpriseName:
          type: string
        passwordSet:
          type: boolean
          description: Passwords are never shown (§16 rebuild notes).
        archived:
          $ref: "#/components/schemas/Archived"
        ownRateTableId:
          description: Vendor trunks own one buy table (§13.12); null for customer trunks.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"

    CustomerTrunkDetail:
      allOf:
        - $ref: "#/components/schemas/TrunkDetailCommon"
        - $ref: "#/components/schemas/CustomerTrunkFields"
        - $ref: "#/components/schemas/Audit"
      required: [enterpriseId, name, protocol, billingType, status, bindType, hostIps, username, maxConnections, port, tps]

    VendorTrunkFields:
      description: Shared fields of the vendor trunk form and record.
      type: object
      properties:
        enterpriseId:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          minLength: 1
          maxLength: 100
        protocol:
          $ref: "#/components/schemas/TrunkProtocol"
        categoryId:
          $ref: "#/components/schemas/Id"
        billingType:
          $ref: "#/components/schemas/BillingType"
        status:
          $ref: "#/components/schemas/RecordStatus"
        bindType:
          type: string
          enum: [TX, RX, TR]
        username:
          type: string
          minLength: 1
          maxLength: 16
        password:
          type: string
          minLength: 1
          maxLength: 9
          writeOnly: true
          description: Required on create; omit to keep.
        host:
          type: string
          minLength: 1
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
        sourceHost:
          type: [string, "null"]
          maxLength: 64
        maxConnections:
          type: integer
          minimum: 1
          maximum: 10
        systemType:
          type: [string, "null"]
          maxLength: 13
        serviceType:
          type: [string, "null"]
          maxLength: 6
        sslType:
          $ref: "#/components/schemas/SslType"
        submitIntervalMs:
          type: integer
          minimum: 0
        submitTimeoutS:
          type: integer
          minimum: 1
        enquireLinkTimeoutS:
          type: integer
          minimum: 1
        msgIdType:
          type: string
          enum: [default, decimal, hexadecimal]
        http:
          $ref: "#/components/schemas/VendorHttpSettings"
        tps:
          type: integer
          minimum: 1
          maximum: 100000
        overflowBuffer:
          type: integer
          minimum: 0
        windowSize:
          type: integer
          minimum: 1
          maximum: 1000
        allowedDataCodings:
          type: array
          items:
            type: integer
            enum: [0, 1, 2, 3, 4, 5, 6, 7, 8, 13, 14]
        rerouteOn:
          type: array
          items:
            type: string
            enum: [EXPIRED, DELETED, UNDELIV, UNKNOWN, REJECTD]
        allowedSrcTon:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
        allowedDstTon:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
        allowedSrcNpi:
          type: array
          items:
            type: integer
            enum: [0, 1, 3, 4, 6, 8, 9, 10, 14, 18]
        allowedDstNpi:
          type: array
          items:
            type: integer
            enum: [0, 1, 3, 4, 6, 8, 9, 10, 14, 18]
        maxMsgLen:
          type: integer
          minimum: 1
          maximum: 2000
        supportMultipart:
          type: boolean
        dlrTimeoutS:
          type: integer
          minimum: 0
        dlrTimeoutStat:
          type: string
          enum: [DELIVRD, EXPIRED, UNDELIV, REJECTD, UNKNOWN]
        bindAddrTon:
          type: integer
          minimum: 0
          maximum: 6
        bindAddrNpi:
          type: integer
          minimum: 0
          maximum: 18
        bindAddrRange:
          type: [string, "null"]
          maxLength: 41
        costLimit:
          type: [number, "null"]
          minimum: 0
        costLimitPeriod:
          oneOf:
            - $ref: "#/components/schemas/LimitPeriod"
            - type: "null"
        billingTimezone:
          type: [string, "null"]
          maxLength: 64
          description: Billing time zone of the trunk (§13.31); null = the enterprise's.


    VendorTrunkInput:
      description: Vendor trunk form (§5.5) with cost limit (§13.26).
      allOf:
        - $ref: "#/components/schemas/VendorTrunkFields"
      required: [enterpriseId, name, protocol, categoryId, billingType, status, bindType, username, host, port, maxConnections, tps]
      unevaluatedProperties: false

    VendorHttpSettings:
      type: object
      description: Generic HTTP-API adapter (§5.5), used when protocol is http.
      additionalProperties: false
      properties:
        url:
          type: [string, "null"]
          maxLength: 1000
        receiverPort:
          type: [integer, "null"]
        successRegex:
          type: [string, "null"]
        messageIdRegex:
          type: [string, "null"]
        callbackUrl:
          type: [string, "null"]
        callbackIntervalS:
          type: [integer, "null"]
        dlrStatusRegex:
          type: [string, "null"]
        dlrMidRegex:
          type: [string, "null"]
        dlrSuccessStats:
          type: [string, "null"]
        dlrFailStats:
          type: [string, "null"]
        extraHeaders:
          type: [string, "null"]
        postData:
          type: [string, "null"]
        callbackExtraHeaders:
          type: [string, "null"]
        callbackPostData:
          type: [string, "null"]

    VendorTrunkDetail:
      allOf:
        - $ref: "#/components/schemas/TrunkDetailCommon"
        - $ref: "#/components/schemas/VendorTrunkFields"
        - $ref: "#/components/schemas/Audit"
      required: [enterpriseId, name, protocol, categoryId, billingType, status, bindType, username, host, port, maxConnections, tps]

    CustomerTrunkSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/CustomerTrunkDetail"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    VendorTrunkSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/VendorTrunkDetail"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    # ------------------------------------------------------------- trunk rules (§13.2)
    TrunkRule:
      type: object
      required: [ruleId, kind, name, source, position, enabled, continueAfter, ruleActive, detail]
      properties:
        ruleId:
          $ref: "#/components/schemas/Id"
        kind:
          type: string
          enum: [translation, hlr]
        name:
          type: string
        source:
          type: object
          description: How the rule reaches this trunk.
          required: [type, label]
          properties:
            type:
              type: string
              enum: [trunk, enterprise, category, all]
            label:
              type: string
        position:
          type: [integer, "null"]
          description: Position set on this trunk; null = default order.
        enabled:
          type: boolean
          description: Off for this trunk only.
        continueAfter:
          type: boolean
        ruleActive:
          type: boolean
          description: The rule's own status; inactive rules do not run anywhere.
        detail:
          type: [string, "null"]
          description: Short summary, e.g. action and patterns, or the HLR provider and DNID pattern.

    TrunkRules:
      type: object
      required: [translation, hlr]
      properties:
        translation:
          type: array
          items:
            $ref: "#/components/schemas/TrunkRule"
        hlr:
          type: array
          description: Customer trunks only; empty for vendor trunks.
          items:
            $ref: "#/components/schemas/TrunkRule"

    TrunkRuleSetting:
      type: object
      required: [ruleId, enabled]
      additionalProperties: false
      properties:
        ruleId:
          $ref: "#/components/schemas/Id"
        enabled:
          type: boolean
        continueAfter:
          type: boolean

    TrunkRulesInput:
      type: object
      additionalProperties: false
      properties:
        translation:
          type: array
          description: The new order (positions 1..n) and on/off per rule.
          items:
            $ref: "#/components/schemas/TrunkRuleSetting"
        hlr:
          type: array
          items:
            $ref: "#/components/schemas/TrunkRuleSetting"
        detachTranslationRuleIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        detachHlrRuleIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"

    TrunkRulesSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/TrunkRules"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    # ------------------------------------------------------------- rate tables (§6.2, §13.12)
    RateTableRow:
      type: object
      required: [id, name, kind, categoryId, category, currency, vendorTrunkId, vendorTrunkName, trunkCount, activeLines, updatedAt, description, trunkNames, enterpriseNames, scheduledChanges, nextChangeAt, negativeMarginLines, avgMarginPct, moneyToday, updatedBy, archived]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        kind:
          type: string
          enum: [customer, vendor]
        categoryId:
          $ref: "#/components/schemas/Id"
        category:
          type: string
        currency:
          type: string
        vendorTrunkId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        vendorTrunkName:
          type: [string, "null"]
        trunkCount:
          type: integer
          description: Customer trunks using the table.
        activeLines:
          type: integer
          description: Lines valid now.
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        description:
          type: [string, "null"]
        trunkNames:
          type: array
          description: Up to five customer trunks using the table (§13.12 "trunks using it").
          items:
            type: string
        enterpriseNames:
          type: array
          description: Up to five clients using the table, or the vendor.
          items:
            type: string
        scheduledChanges:
          type: integer
          description: Lines starting later.
        nextChangeAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        negativeMarginLines:
          type: [integer, "null"]
          description: Current sell rates below the best buy rate; null for vendor tables.
        avgMarginPct:
          type: [number, "null"]
          description: Margin of today's traffic, weighted by volume; null without traffic or EDR store.
        moneyToday:
          type: [number, "null"]
          description: Today's revenue (customer table) or cost (vendor table) in the table currency.
        updatedBy:
          type: [string, "null"]
        archived:
          type: boolean

    RateTablePage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/RateTableRow"

    # ------------------------------------------------------------- Rate Manager (§13.12)
    RateTableInput:
      type: object
      description: New customer (sell) rate table (§6.2 Add form).
      required: [name, categoryId, currency]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        categoryId:
          $ref: "#/components/schemas/Id"
        currency:
          type: string
          minLength: 3
          maxLength: 3
        description:
          type: [string, "null"]
          maxLength: 500
        copyFrom:
          description: Copy Rate From Vendor Rate (§6.2) - the vendor trunk's current rates plus a margin.
          type: object
          required: [vendorTrunkId, marginPct]
          additionalProperties: false
          properties:
            vendorTrunkId:
              $ref: "#/components/schemas/Id"
            marginPct:
              type: number
              minimum: -50
              maximum: 500

    RateTableUpdate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
          maxLength: 500

    RateTableTrunk:
      type: object
      required: [id, name, kind, enterpriseId, enterpriseName, status]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        kind:
          type: string
          enum: [customer, vendor]
        enterpriseId:
          $ref: "#/components/schemas/Id"
        enterpriseName:
          type: string
        status:
          $ref: "#/components/schemas/RecordStatus"

    RateTableSummary:
      type: object
      description: Summary cards (§13.12). Traffic figures are null when the EDR store does not answer.
      required: [activeRates, countries, scheduledChanges, nextChangeAt, scheduledIncreases, closedLines, negativeMarginLines, avgMarginPct, moneyToday, messagesToday]
      properties:
        activeRates:
          type: integer
        countries:
          type: integer
        scheduledChanges:
          type: integer
        nextChangeAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        scheduledIncreases:
          type: integer
        closedLines:
          type: integer
        negativeMarginLines:
          type: [integer, "null"]
          description: Current sell rates below the best buy rate; null for vendor tables.
        avgMarginPct:
          type: [number, "null"]
          description: Margin of today's traffic priced by this table, weighted by volume.
        moneyToday:
          type: [number, "null"]
          description: Today's revenue (customer table) or cost (vendor table), in the table currency.
        messagesToday:
          type: [integer, "null"]

    RateTableDetail:
      allOf:
        - type: object
          required: [id, name, kind, categoryId, category, currency, description, vendorTrunkId, vendorTrunkName, trunks, lastImport, archived, summary]
          properties:
            id:
              $ref: "#/components/schemas/Id"
            name:
              type: string
            kind:
              type: string
              enum: [customer, vendor]
            categoryId:
              $ref: "#/components/schemas/Id"
            category:
              type: string
            currency:
              type: string
            description:
              type: [string, "null"]
            vendorTrunkId:
              oneOf:
                - $ref: "#/components/schemas/Id"
                - type: "null"
            vendorTrunkName:
              type: [string, "null"]
            trunks:
              type: array
              description: Customer trunks using the table, or the vendor trunk that owns it.
              items:
                $ref: "#/components/schemas/RateTableTrunk"
            lastImport:
              oneOf:
                - type: object
                  required: [at, by, fileName, operation, status]
                  properties:
                    at:
                      $ref: "#/components/schemas/Timestamp"
                    by:
                      type: [string, "null"]
                    fileName:
                      type: string
                    operation:
                      type: string
                    status:
                      type: string
                - type: "null"
            archived:
              $ref: "#/components/schemas/Archived"
            summary:
              $ref: "#/components/schemas/RateTableSummary"
        - $ref: "#/components/schemas/Audit"

    RateTableSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/RateTableDetail"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    RateLineRow:
      type: object
      required: [id, rateTableId, mccmncId, mccmnc, country, countryIso, network, dialCode, senderId, rate, sysRate, currency, bestBuy, bestVendorTrunkId, bestVendor, margin, marginPct, changeType, changePct, validFrom, validTo, statedValidFrom, nextRate, nextFrom, isBlocked, rateNote, updatedBy, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        rateTableId:
          $ref: "#/components/schemas/Id"
        mccmncId:
          $ref: "#/components/schemas/Id"
        mccmnc:
          type: string
          description: A 3-digit code is the country's All networks line (§6.1).
        country:
          type: string
        countryIso:
          type: string
        network:
          type: string
        dialCode:
          type: [string, "null"]
        senderId:
          type: [string, "null"]
        rate:
          type: [number, "null"]
        sysRate:
          type: [number, "null"]
          description: The rate in the platform currency (`ReferenceData.platformCurrency`, EUR by default).
        currency:
          type: string
        bestBuy:
          type: [number, "null"]
          description: Cheapest current vendor rate for the destination and product category, in the table currency.
        bestVendorTrunkId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        bestVendor:
          type: [string, "null"]
        margin:
          type: [number, "null"]
          description: rate - bestBuy (customer tables).
        marginPct:
          type: [number, "null"]
          description: margin / rate x 100.
        changeType:
          type: string
          enum: [new, same, increase, decrease, closed]
        changePct:
          type: [number, "null"]
          description: Change against the previous version, in %.
        validFrom:
          $ref: "#/components/schemas/Timestamp"
        validTo:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        statedValidFrom:
          description: The vendor RN's stated date when it was back-dated (§13.32).
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        nextRate:
          type: [number, "null"]
          description: The next scheduled rate of the destination, if any.
        nextFrom:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        isBlocked:
          type: boolean
        rateNote:
          type: [string, "null"]
        updatedBy:
          type: [string, "null"]
        updatedAt:
          $ref: "#/components/schemas/Timestamp"

    RateLinePage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/RateLineRow"

    RateLineEdit:
      type: object
      description: |
        One edit. `set`: a new rate from `effectiveFrom` for an existing line (`lineId`) or for a
        destination (`mccmnc`, optional `senderId`). `close`: end the line at `at` (default now; a
        scheduled line is removed). `block`: block or unblock the line (§6.2 IsBlock).
      required: [action]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [set, close, block]
        lineId:
          $ref: "#/components/schemas/Id"
        mccmnc:
          type: string
          pattern: "^[0-9]{3,6}$"
        senderId:
          type: [string, "null"]
          maxLength: 20
        rate:
          type: number
          minimum: 0
        effectiveFrom:
          $ref: "#/components/schemas/Timestamp"
        at:
          $ref: "#/components/schemas/Timestamp"
        blocked:
          type: boolean
        rateNote:
          type: [string, "null"]
          maxLength: 500

    RateLineChanges:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: "#/components/schemas/RateLineEdit"
        note:
          type: string
          maxLength: 500
        acceptNoticeBreach:
          type: boolean
          description: Apply increases that start sooner than a client's notice period (§13.14).

    RateLineChangesSaved:
      type: object
      required: [change, applied, skipped]
      properties:
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"
        applied:
          type: integer
          description: Edits that changed something.
        skipped:
          type: integer
          description: Edits that changed nothing (e.g. the same rate).

    NoticeBreach:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [breaches]
          properties:
            breaches:
              type: array
              items:
                type: object
                required: [mccmnc, currentRate, newRate, effectiveFrom, noticeDays, earliestAllowed, enterpriseName]
                properties:
                  mccmnc:
                    type: string
                  currentRate:
                    type: number
                  newRate:
                    type: number
                  effectiveFrom:
                    $ref: "#/components/schemas/Timestamp"
                  noticeDays:
                    type: integer
                  earliestAllowed:
                    $ref: "#/components/schemas/Timestamp"
                  enterpriseName:
                    type: string
                  rateTableId:
                    $ref: "#/components/schemas/Id"
                  table:
                    type: string
                    description: The rate table (bulk apply only).

    RateBulkAction:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - none
          - set
          - change_pct
          - change_amount
          - cost_plus_pct
          - cost_plus_amount
          - close
          - block
          - unblock
          description: Set a fixed rate; change the current rate by % or by an amount (negative lowers it); sell = cost + margin % or + amount; close the lines; block or unblock them (§13.11 Rating).
        value:
          type:
          - number
          - 'null'
          description: The rate, the % or the amount; null for close / block / unblock.
        costSource:
          type: string
          enum:
          - best_buy
          - vendor_trunk
          description: 'Cost for cost_plus_*: the best vendor (best buy) or one vendor trunk''s current rate. Default best_buy.'
        vendorTrunkId: &id003
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        round:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 6
          description: Round new rates to N decimals; null = 6.
    RateBulkScope:
      type: object
      description: 'Step 1 and 2 of the bulk workspace: scope (tables × destinations; both destination lists empty = every current line of the tables) and one action.'
      additionalProperties: false
      required:
      - rateTableIds
      - action
      properties:
        rateTableIds:
          type: array
          items: &id001
            $ref: '#/components/schemas/Id'
          minItems: 1
          maxItems: 200
          uniqueItems: true
          description: The clients' (or vendors') rate tables.
        mccmncs:
          type: array
          items: &id009
            type: string
            pattern: ^[0-9]{3,6}$
          maxItems: 5000
          uniqueItems: true
          description: Destinations by MCCMNC.
        countryIsos:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{2}$
          maxItems: 300
          uniqueItems: true
          description: Destinations by country (every network of it).
        onlyExisting:
          type: boolean
          description: 'Default true: only lines the tables already have. False also adds the listed destinations a table lacks (set and cost_plus_* only; needs mccmncs or countryIsos).'
        action:
          $ref: '#/components/schemas/RateBulkAction'
        effectiveFrom:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: When new rates, closes and blocks start; null = now. Never in the past (§13.32).
        overrides:
          type: array
          maxItems: 5000
          description: Rates per table and destination that replace the action's result for those rows (Market moves "Update rates", §13.14). With action `none`, only these rows change.
          items:
            type: object
            required: [rateTableId, mccmnc, rate]
            additionalProperties: false
            properties:
              rateTableId:
                $ref: "#/components/schemas/Id"
              mccmnc:
                type: string
                pattern: "^[0-9]{3,6}$"
              rate:
                type: number
                minimum: 0
              effectiveFrom:
                $ref: "#/components/schemas/Timestamp"
        respectNotice:
          type: boolean
          description: Move each increase to the end of the notice period of the clients using its table (§13.14).
    RateBulkRow:
      type: object
      required:
      - key
      - rateTableId
      - table
      - kind
      - currency
      - clients
      - noticeDays
      - mccmnc
      - country
      - countryIso
      - network
      - senderId
      - lineId
      - currentRate
      - blocked
      - edit
      - newRate
      - newBlocked
      - effectiveFrom
      - change
      - cost
      - costVendor
      - currentMarginPct
      - newMarginPct
      - changePct
      - belowCost
      - noticeBreach
      - noticeAdjusted
      - messages7d
      - revenue7d
      - margin7d
      - revenueChange7d
      - toPlatform
      - note
      properties:
        key:
          type: string
          description: rateTableId:mccmnc:senderId - stable row key.
        rateTableId: *id001
        table:
          type: string
        kind:
          type: string
          enum:
          - customer
          - vendor
        currency:
          type: string
        clients:
          type: string
          description: Enterprises using the table (comma-separated).
        noticeDays:
          type:
          - integer
          - 'null'
        mccmnc:
          type: string
        country: &id002
          type: &id006
          - string
          - 'null'
        countryIso: *id002
        network: *id002
        senderId: *id002
        lineId: *id003
        currentRate: &id004
          type: &id005
          - number
          - 'null'
        blocked: &id010
          type: boolean
        edit:
          type: string
          enum:
          - set
          - close
          - block
          - none
          description: What apply would do; none = nothing changes (same rate, no cost, or missing line).
        newRate: *id004
        newBlocked:
          type:
          - boolean
          - 'null'
        effectiveFrom: &id011
          $ref: '#/components/schemas/Timestamp'
        change:
          type: string
          enum:
          - new
          - increase
          - decrease
          - same
          - close
          - block
          - unblock
          - skip
        cost:
          type: *id005
          description: 'Cost in the table currency: the chosen cost source, else best buy.'
        costVendor: *id002
        currentMarginPct: *id004
        newMarginPct: *id004
        changePct: *id004
        belowCost:
          type: boolean
          description: The new rate sells below cost (§13.11 Step 3).
        noticeBreach:
          type: boolean
          description: An increase starts sooner than the clients' notice period.
        noticeAdjusted:
          type: boolean
          description: respectNotice moved this increase later.
        messages7d: &id007
          type: integer
        revenue7d:
          type: number
          description: Last 7 days' revenue on this table and destination, table currency.
        margin7d:
          type: number
          description: Last 7 days' margin (revenue - cost) on this table and destination, table currency.
        toPlatform:
          type: number
          description: Multiply a table-currency amount by this to get the platform currency (summary money).
        revenueChange7d:
          type: number
          description: 'The same traffic at the new rate minus at the old one (closed: all of it lost).'
        note:
          type: *id006
          description: Why a row is skipped or flagged, in words.
    RateBulkSummary:
      type: object
      description: 'Step 4 impact: counts and money on the last 7 days of traffic.'
      required:
      - tables
      - destinations
      - lines
      - up
      - down
      - new
      - same
      - closed
      - blocked
      - unblocked
      - skipped
      - belowCost
      - noticeBreach
      - noticeAdjusted
      - currency
      - traffic
      - messages7d
      - revenue7d
      - margin7d
      - revenueChange7d
      - marginChange7d
      properties:
        tables: *id007
        destinations: *id007
        lines: *id007
        up: *id007
        down: *id007
        new: *id007
        same: *id007
        closed: *id007
        blocked: *id007
        unblocked: *id007
        skipped: *id007
        belowCost: *id007
        noticeBreach: *id007
        noticeAdjusted: *id007
        currency:
          type: string
          description: The platform currency of the money figures below.
        traffic:
          type: boolean
          description: False when the EDR store did not answer (money figures are 0).
        messages7d: *id007
        revenue7d: &id008
          type: number
        margin7d: *id008
        revenueChange7d: *id008
        marginChange7d: *id008
    RateBulkPreview:
      type: object
      required:
      - rows
      - summary
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RateBulkRow'
        summary:
          $ref: '#/components/schemas/RateBulkSummary'
    RateBulkItem:
      type: object
      description: 'One reviewed row: as a rate line edit (set by lineId or mccmnc, close / block by lineId) on its table. effectiveFrom is also the close / block time.'
      additionalProperties: false
      required:
      - rateTableId
      - action
      properties:
        rateTableId: *id001
        action:
          type: string
          enum:
          - set
          - close
          - block
        mccmnc: *id009
        lineId: *id001
        senderId:
          type:
          - string
          - 'null'
          maxLength: 20
        rate:
          type: number
          minimum: 0
        blocked: *id010
        effectiveFrom: *id011
    RateBulkApply:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RateBulkItem'
          minItems: 1
          maxItems: 20000
        note:
          type: string
          maxLength: 500
        acceptNoticeBreach:
          type: boolean
          description: Apply increases that start sooner than a client's notice period (§13.14).
    RateBulkSaved:
      type: object
      required:
      - change
      - applied
      - skipped
      - tables
      properties:
        change:
          oneOf:
          - $ref: '#/components/schemas/Change'
          - type: 'null'
        applied: *id007
        skipped: *id007
        tables:
          type: integer
          description: Tables that changed.

    RnStatus:
      type: string
      enum:
      - pending
      - accepted
      - partly_accepted
      - rejected
      - failed
      - unmatched
      description: Pending review, Accepted, Partly accepted, Rejected, Failed (file unreadable) and Unmatched (no vendor trunk found; Assign to trunk, §13.13).
    RnRow:
      type: object
      required:
      - id
      - reference
      - vendorId
      - vendor
      - vendorTrunkId
      - vendorTrunk
      - rateTableId
      - rateTable
      - currency
      - source
      - mailbox
      - fromAddress
      - subject
      - fileName
      - receivedAt
      - effectiveFrom
      - lines
      - newLines
      - increases
      - decreases
      - unchanged
      - closed
      - errors
      - flagged
      - noticeBreaches
      - backdated
      - turnsNegative
      - status
      - autoAccepted
      - dueSoon
      - decidedBy
      - decidedAt
      - updatedAt
      properties:
        id: &id006
          $ref: '#/components/schemas/Id'
        reference:
          type: string
          description: RN-YYYY-NNNNNN.
        vendorId: &id001
          oneOf: &id010
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        vendor: &id002
          type:
          - string
          - 'null'
        vendorTrunkId: *id001
        vendorTrunk: *id002
        rateTableId: *id001
        rateTable: *id002
        currency: *id002
        source:
          type: string
          enum:
          - email
          - upload
        mailbox: *id002
        fromAddress: *id002
        subject: *id002
        fileName: *id002
        receivedAt: &id005
          $ref: '#/components/schemas/Timestamp'
        effectiveFrom:
          oneOf: &id004
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: Earliest stated effective date of the lines.
        lines: &id003
          type: integer
        newLines: *id003
        increases: *id003
        decreases: *id003
        unchanged: *id003
        closed: *id003
        errors: *id003
        flagged:
          type: integer
          description: Increases or closes on live traffic (§13.32).
        noticeBreaches: *id003
        backdated: *id003
        turnsNegative: *id003
        status:
          $ref: '#/components/schemas/RnStatus'
        autoAccepted: &id009
          type: boolean
        dueSoon:
          type: boolean
          description: Flagged, still pending, and its earliest date is within the reminder days.
        decidedBy: *id002
        decidedAt: &id007
          oneOf: *id004
        updatedAt: *id005
    RnReply:
      type: object
      required:
      - id
      - kind
      - to
      - subject
      - body
      - status
      - createdAt
      - sentAt
      - sentBy
      properties:
        id: *id006
        kind:
          type: string
          enum:
          - successful
          - failed
          - rejected
        to:
          type: array
          items:
            type: string
        subject:
          type: string
        body:
          type: string
        status:
