          type: boolean
        sellRate:
          type: number
        sellCurrency:
          type: string
        sellRateConverted:
          type: number
          description: Sell rate in the platform currency (`currency`).
        rateTableId:
          $ref: "#/components/schemas/Id"
        rateTableName:
          type: string
        status:
          $ref: "#/components/schemas/RouteMapStatus"
        ruleId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        ruleName:
          type: [string, "null"]
        rulePriority:
          type: [integer, "null"]
        routeType:
          type: [string, "null"]
          enum: [static, dynamic, qbr, block, null]
        vendorTrunkId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        vendor:
          type: [string, "null"]
        vendorCost:
          type: [number, "null"]
          description: The routed vendor's buy rate, platform currency.
        margin:
          type: [number, "null"]
        marginPct:
          type: [number, "null"]
        decidedBy:
          type: [string, "null"]
          description: How the vendor was chosen (priority, percentage, least cost, quality …).
