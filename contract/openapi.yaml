    CustomerTrunkSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/CustomerTrunkDetail"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    VendorTrunkSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/VendorTrunkDetail"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    # ------------------------------------------------------------- trunk rules (§13.2)
    TrunkRule:
      type: object
      required: [ruleId, kind, name, source, position, enabled, continueAfter, ruleActive, detail]
      properties:
        ruleId:
          $ref: "#/components/schemas/Id"
        kind:
          type: string
          enum: [translation, hlr]
        name:
          type: string
        source:
          type: object
          description: How the rule reaches this trunk.
          required: [type, label]
          properties:
            type:
              type: string
              enum: [trunk, enterprise, category, all]
            label:
              type: string
        position:
          type: [integer, "null"]
          description: Position set on this trunk; null = default order.
        enabled:
          type: boolean
          description: Off for this trunk only.
        continueAfter:
          type: boolean
        ruleActive:
          type: boolean
          description: The rule's own status; inactive rules do not run anywhere.
        detail:
          type: [string, "null"]
          description: Short summary, e.g. action and patterns, or the HLR provider and DNID pattern.

    TrunkRules:
      type: object
      required: [translation, hlr]
      properties:
        translation:
          type: array
          items:
            $ref: "#/components/schemas/TrunkRule"
        hlr:
          type: array
          description: Customer trunks only; empty for vendor trunks.
          items:
            $ref: "#/components/schemas/TrunkRule"

    TrunkRuleSetting:
      type: object
      required: [ruleId, enabled]
      additionalProperties: false
      properties:
        ruleId:
          $ref: "#/components/schemas/Id"
        enabled:
          type: boolean
        continueAfter:
          type: boolean

    TrunkRulesInput:
      type: object
      additionalProperties: false
      properties:
        translation:
          type: array
          description: The new order (positions 1..n) and on/off per rule.
          items:
            $ref: "#/components/schemas/TrunkRuleSetting"
        hlr:
          type: array
          items:
            $ref: "#/components/schemas/TrunkRuleSetting"
        detachTranslationRuleIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        detachHlrRuleIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"

    TrunkRulesSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/TrunkRules"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    # ------------------------------------------------------------- rate tables (§6.2, §13.12)
    RateTableRow:
      type: object
      required: [id, name, kind, categoryId, category, currency, vendorTrunkId, vendorTrunkName, trunkCount, activeLines, updatedAt, description, trunkNames, enterpriseNames, scheduledChanges, nextChangeAt, negativeMarginLines, avgMarginPct, moneyToday, updatedBy, archived]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        kind:
          type: string
          enum: [customer, vendor]
        categoryId:
          $ref: "#/components/schemas/Id"
        category:
          type: string
        currency:
          type: string
        vendorTrunkId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        vendorTrunkName:
          type: [string, "null"]
        trunkCount:
          type: integer
          description: Customer trunks using the table.
        activeLines:
          type: integer
          description: Lines valid now.
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        description:
          type: [string, "null"]
        trunkNames:
          type: array
          description: Up to five customer trunks using the table (§13.12 "trunks using it").
          items:
            type: string
        enterpriseNames:
          type: array
          description: Up to five clients using the table, or the vendor.
          items:
            type: string
        scheduledChanges:
          type: integer
          description: Lines starting later.
        nextChangeAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        negativeMarginLines:
          type: [integer, "null"]
          description: Current sell rates below the best buy rate; null for vendor tables.
        avgMarginPct:
          type: [number, "null"]
          description: Margin of today's traffic, weighted by volume; null without traffic or EDR store.
        moneyToday:
          type: [number, "null"]
          description: Today's revenue (customer table) or cost (vendor table) in the table currency.
        updatedBy:
          type: [string, "null"]
        archived:
          type: boolean

    RateTablePage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/RateTableRow"

    # ------------------------------------------------------------- Rate Manager (§13.12)
    RateTableInput:
      type: object
      description: New customer (sell) rate table (§6.2 Add form).
      required: [name, categoryId, currency]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        categoryId:
          $ref: "#/components/schemas/Id"
        currency:
          type: string
          minLength: 3
          maxLength: 3
        description:
          type: [string, "null"]
          maxLength: 500
        copyFrom:
          description: Copy Rate From Vendor Rate (§6.2) - the vendor trunk's current rates plus a margin.
          type: object
          required: [vendorTrunkId, marginPct]
          additionalProperties: false
          properties:
            vendorTrunkId:
              $ref: "#/components/schemas/Id"
            marginPct:
              type: number
              minimum: -50
              maximum: 500

    RateTableUpdate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
          maxLength: 500

    RateTableTrunk:
      type: object
      required: [id, name, kind, enterpriseId, enterpriseName, status]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        kind:
          type: string
          enum: [customer, vendor]
        enterpriseId:
          $ref: "#/components/schemas/Id"
        enterpriseName:
          type: string
        status:
          $ref: "#/components/schemas/RecordStatus"

    RateTableSummary:
      type: object
      description: Summary cards (§13.12). Traffic figures are null when the EDR store does not answer.
      required: [activeRates, countries, scheduledChanges, nextChangeAt, scheduledIncreases, closedLines, negativeMarginLines, avgMarginPct, moneyToday, messagesToday]
      properties:
        activeRates:
          type: integer
        countries:
          type: integer
        scheduledChanges:
          type: integer
        nextChangeAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        scheduledIncreases:
          type: integer
        closedLines:
          type: integer
        negativeMarginLines:
          type: [integer, "null"]
          description: Current sell rates below the best buy rate; null for vendor tables.
        avgMarginPct:
          type: [number, "null"]
          description: Margin of today's traffic priced by this table, weighted by volume.
        moneyToday:
          type: [number, "null"]
          description: Today's revenue (customer table) or cost (vendor table), in the table currency.
        messagesToday:
          type: [integer, "null"]

    RateTableDetail:
      allOf:
        - type: object
          required: [id, name, kind, categoryId, category, currency, description, vendorTrunkId, vendorTrunkName, trunks, lastImport, archived, summary]
          properties:
            id:
              $ref: "#/components/schemas/Id"
            name:
              type: string
            kind:
              type: string
              enum: [customer, vendor]
            categoryId:
              $ref: "#/components/schemas/Id"
            category:
              type: string
            currency:
              type: string
            description:
              type: [string, "null"]
            vendorTrunkId:
              oneOf:
                - $ref: "#/components/schemas/Id"
                - type: "null"
            vendorTrunkName:
              type: [string, "null"]
            trunks:
              type: array
              description: Customer trunks using the table, or the vendor trunk that owns it.
              items:
                $ref: "#/components/schemas/RateTableTrunk"
            lastImport:
              oneOf:
                - type: object
                  required: [at, by, fileName, operation, status]
                  properties:
                    at:
                      $ref: "#/components/schemas/Timestamp"
                    by:
                      type: [string, "null"]
                    fileName:
                      type: string
                    operation:
                      type: string
                    status:
                      type: string
                - type: "null"
            archived:
              $ref: "#/components/schemas/Archived"
            summary:
              $ref: "#/components/schemas/RateTableSummary"
        - $ref: "#/components/schemas/Audit"

    RateTableSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/RateTableDetail"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    RateLineRow:
      type: object
      required: [id, rateTableId, mccmncId, mccmnc, country, countryIso, network, dialCode, senderId, rate, sysRate, currency, bestBuy, bestVendorTrunkId, bestVendor, margin, marginPct, changeType, changePct, validFrom, validTo, statedValidFrom, nextRate, nextFrom, isBlocked, rateNote, updatedBy, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        rateTableId:
          $ref: "#/components/schemas/Id"
        mccmncId:
          $ref: "#/components/schemas/Id"
        mccmnc:
          type: string
          description: A 3-digit code is the country's All networks line (§6.1).
        country:
          type: string
        countryIso:
          type: string
        network:
          type: string
        dialCode:
          type: [string, "null"]
        senderId:
          type: [string, "null"]
        rate:
          type: number
        sysRate:
          type: number
          description: The rate in the base currency (USD).
        currency:
          type: string
        bestBuy:
          type: [number, "null"]
          description: Cheapest current vendor rate for the destination and product category, in the table currency.
        bestVendorTrunkId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        bestVendor:
          type: [string, "null"]
        margin:
          type: [number, "null"]
          description: rate - bestBuy (customer tables).
        marginPct:
          type: [number, "null"]
          description: margin / rate x 100.
        changeType:
          type: string
          enum: [new, same, increase, decrease, closed]
        changePct:
          type: [number, "null"]
          description: Change against the previous version, in %.
        validFrom:
          $ref: "#/components/schemas/Timestamp"
        validTo:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        statedValidFrom:
          description: The vendor RN's stated date when it was back-dated (§13.32).
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        nextRate:
          type: [number, "null"]
          description: The next scheduled rate of the destination, if any.
        nextFrom:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        isBlocked:
          type: boolean
        rateNote:
          type: [string, "null"]
        updatedBy:
          type: [string, "null"]
        updatedAt:
          $ref: "#/components/schemas/Timestamp"

    RateLinePage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/RateLineRow"

    RateLineEdit:
      type: object
      description: |
        One edit. `set`: a new rate from `effectiveFrom` for an existing line (`lineId`) or for a
        destination (`mccmnc`, optional `senderId`). `close`: end the line at `at` (default now; a
        scheduled line is removed). `block`: block or unblock the line (§6.2 IsBlock).
      required: [action]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [set, close, block]
        lineId:
          $ref: "#/components/schemas/Id"
        mccmnc:
          type: string
          pattern: "^[0-9]{3,6}$"
        senderId:
          type: [string, "null"]
          maxLength: 20
        rate:
          type: number
          minimum: 0
        effectiveFrom:
          $ref: "#/components/schemas/Timestamp"
        at:
          $ref: "#/components/schemas/Timestamp"
        blocked:
          type: boolean
        rateNote:
          type: [string, "null"]
          maxLength: 500

    RateLineChanges:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: "#/components/schemas/RateLineEdit"
        note:
          type: string
          maxLength: 500
        acceptNoticeBreach:
          type: boolean
          description: Apply increases that start sooner than a client's notice period (§13.14).

    RateLineChangesSaved:
      type: object
      required: [change, applied, skipped]
      properties:
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"
        applied:
          type: integer
          description: Edits that changed something.
        skipped:
          type: integer
          description: Edits that changed nothing (e.g. the same rate).

    NoticeBreach:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [breaches]
          properties:
            breaches:
              type: array
              items:
                type: object
                required: [mccmnc, currentRate, newRate, effectiveFrom, noticeDays, earliestAllowed, enterpriseName]
                properties:
                  mccmnc:
                    type: string
                  currentRate:
                    type: number
                  newRate:
                    type: number
                  effectiveFrom:
                    $ref: "#/components/schemas/Timestamp"
                  noticeDays:
                    type: integer
                  earliestAllowed:
                    $ref: "#/components/schemas/Timestamp"
                  enterpriseName:
                    type: string

    Destination:
      type: object
      required: [id, mccmnc, mcc, mnc, country, countryIso, network, allNetworks]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        mccmnc:
          type: string
        mcc:
          type: string
        mnc:
          type: string
        country:
          type: string
        countryIso:
          type: string
        network:
          type: string
        allNetworks:
          type: boolean

    DestinationPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/Destination"

    # ------------------------------------------------------------- list query (§13.25)
    ListId:
      type: string
      description: A list page whose fields are described by `/meta/lists/{list}/fields`.
      enum: [enterprises, users, changes, customer_trunks, vendor_trunks, rate_tables, rate_lines, destinations]

    FilterOperator:
      type: string
      description: |
        Operators from §13.25. All text comparisons are case-insensitive.

        * `eq`, `neq`: equals / not equals.
        * `like`, `not_like`: wildcard match, `%` = any text, `_` = one character
          (`re%` starts with, `%re` ends with, `%re%` contains). A literal `%` or `_`
          is escaped with a backslash.
        * `in`, `not_in`: value in list (`values`).
        * `between`: inclusive range, `values` = [from, to].
        * `gt`, `gte`, `lt`, `lte`: greater / less than.
        * `empty`, `not_empty`: null or empty string; no value.
        * `regex`: POSIX regular expression, case-insensitive.
      enum: [eq, neq, like, not_like, in, not_in, between, gt, gte, lt, lte, empty, not_empty, regex]

    FilterValue:
      description: A single filter operand. Dates and times are ISO 8601 strings.
      type: [string, number, boolean]

    FilterCondition:
      type: object
      description: One "field + operator + value" condition (a column filter or a builder row).
      required: [field, op]
      additionalProperties: false
      properties:
        field:
          type: string
          description: A field name from the list's field catalogue (hidden fields included).
        op:
          $ref: "#/components/schemas/FilterOperator"
        value:
          $ref: "#/components/schemas/FilterValue"
          description: Operand for single-value operators.
        values:
          type: array
          description: Operands for `in`, `not_in` (any length) and `between` (exactly 2).
          items:
            $ref: "#/components/schemas/FilterValue"

    FilterGroup:
      type: object
      description: |
        Conditions combined with AND or OR. Groups nest, so the builder can express
        "A AND (B OR C)". Column filters and builder conditions are sent together as
        one tree; the top level is normally `and`.
      required: [logic, conditions]
      additionalProperties: false
      properties:
        logic:
          type: string
          enum: [and, or]
        conditions:
          type: array
          maxItems: 200
          items:
            oneOf:
              - $ref: "#/components/schemas/FilterCondition"
              - $ref: "#/components/schemas/FilterGroup"

    SortKey:
      type: object
      required: [field, dir]
      additionalProperties: false
      properties:
        field:
          type: string
        dir:
          type: string
          enum: [asc, desc]

    ListQuery:
      type: object
      description: |
        Server-side filter, sort and paging for every list (§13.25, §14.2). The first
        request has no `cursor`; each next page sends the previous response's
        `nextCursor` with the same filter and sort. Without `sort` the server applies
        the list's default (for destination lists: country name, then network name).
      additionalProperties: false
      properties:
        filter:
          $ref: "#/components/schemas/FilterGroup"
        search:
          type: string
          maxLength: 200
          description: Quick search across the list's text columns (case-insensitive, wildcards allowed).
        sort:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/SortKey"
        limit:
          type: integer
          minimum: 1
          maximum: 4000
          default: 100
          description: Rows per page (page-size choices in §1 go up to 4,000).
        cursor:
          type: [string, "null"]
          description: Opaque position from the previous page's `nextCursor`.
        withTotal:
          type: boolean
          default: true
          description: Compute `total`. Very large lists (EDRs) may return an estimate.

    ListPageMeta:
      type: object
      required: [total, totalIsEstimate, nextCursor]
      properties:
        total:
          type: integer
          minimum: 0
          description: Rows matching the filter (shown as the row count, §13.25 / §15.4 status bar).
        totalIsEstimate:
          type: boolean
          description: True when `total` is an estimate (very large lists).
        nextCursor:
          type: [string, "null"]
          description: Pass as `cursor` to fetch the next page; null on the last page.

    FieldType:
      type: string
      description: Decides the column filter widget (§15.1) and the allowed operators.
      enum: [text, prefix, integer, decimal, money, percent, enum, boolean, date, datetime, mccmnc]

    FieldDescriptor:
      type: object
      required: [field, label, type, operators, sortable, hidden]
      properties:
        field:
          type: string
        label:
          type: string
        type:
          $ref: "#/components/schemas/FieldType"
        operators:
          type: array
          items:
            $ref: "#/components/schemas/FilterOperator"
        defaultOperator:
          $ref: "#/components/schemas/FilterOperator"
          description: Operator used by the column filter box under the header.
        sortable:
          type: boolean
        hidden:
          type: boolean
          description: Not shown as a column by default, but still filterable (§13.25).
        enumValues:
          type: array
          description: Choices for `enum` fields (dropdown filter with Select All, §1).
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: string
              label:
                type: string

    ListFields:
      type: object
      required: [list, fields, defaultSort]
      properties:
        list:
          $ref: "#/components/schemas/ListId"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldDescriptor"
        defaultSort:
          type: array
          items:
            $ref: "#/components/schemas/SortKey"

    # ------------------------------------------------------------- enterprises (§5)
    EnterpriseType:
      type: string
      enum: [customer, vendor, reciprocal]
      description: Reciprocal = both customer and vendor.

    EnterpriseTier:
      type: string
      enum: [tier1, tier2, tier3]

    RecordStatus:
      type: string
      enum: [active, inactive]

    Enterprise:
      description: |
        Skeleton of the General Info record (§5.1). Address, contacts, credit alert
        percentages, docs and billing are added with the Enterprises screen (build step 4.1).
      allOf:
        - type: object
          required: [id, name, alias, type, tier, status, businessCompanyId, accountManagerId]
          properties:
            id:
              $ref: "#/components/schemas/Id"
            name:
              type: string
              minLength: 1
              maxLength: 200
            alias:
              type: string
              minLength: 1
              maxLength: 100
            type:
              $ref: "#/components/schemas/EnterpriseType"
            tier:
              $ref: "#/components/schemas/EnterpriseTier"
            status:
              $ref: "#/components/schemas/RecordStatus"
            businessCompanyId:
              $ref: "#/components/schemas/Id"
            accountManagerId:
              $ref: "#/components/schemas/Id"
            accountManagerName:
              type: [string, "null"]
              description: Display name of the current account manager (§13.30 keeps the history).
            businessCompanyName:
              type: string
            country:
              type: [string, "null"]
              description: ISO 3166-1 alpha-2.
            archivedAt:
              description: Set when the enterprise is archived (§13.29); archived rows show only with the "archived" filter.
              oneOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
        - $ref: "#/components/schemas/Audit"

    EnterprisePage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/Enterprise"
