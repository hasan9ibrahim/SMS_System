    CurrencySaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/CurrencyRow"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    CurrencyRateRow:
      type: object
      required: [id, iso, currency, ratePerUsd, validFrom, updatedBy, previousRate]
      properties:
        id:
          $ref: "#/components/schemas/Id"
          description: The currency's ID (one row per currency).
        iso:
          type: string
        currency:
          type: string
        ratePerUsd:
          type: number
          description: Units of the currency per 1 USD (USD = 1).
        validFrom:
          type: [string, "null"]
          format: date-time
        updatedBy:
          type: [string, "null"]
