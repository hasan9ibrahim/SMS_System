          minimum: 0
          description: Simulated per-message revenue in the platform currency (§13.9); default from the trunk's rate.
        accumulatedRevenue:
          type: number
          minimum: 0
          description: Simulated revenue already earned in the period (§13.9).
        hlrPorted:
          type: boolean
        warmupSent:
