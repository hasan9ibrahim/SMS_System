      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: One page of vendor invoices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorInvoicePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /vendor-invoices/export:
    post:
      tags: [finance]
      operationId: exportVendorInvoices
      summary: "Export vendor invoices as CSV"
