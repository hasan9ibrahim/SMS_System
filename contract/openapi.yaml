        cronFrequency:
          type: integer
          minimum: 1
          maximum: 59
        cronExpression:
          type: string
          maxLength: 100
          description: Five fields - minute hour day month weekday (UTC).
        fileType:
          type: string
          enum: [csv, excel, pdf]
        emailBody:
          type: string
          minLength: 1
          maxLength: 20000
          description: "Rich text (HTML); placeholders {report}, {from}, {to}, {rows}."

    ScheduledReportInput:
