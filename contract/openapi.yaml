      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkDiagnosisInput"
      responses:
        "200":
          description: The tool's output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkDiagnosisResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

