      allOf:
        - $ref: "#/components/schemas/TrafficAlertFields"
        - type: object
          required: [id, customerTrunk, enterprise, vendorTrunk, template, state, lastCheckedAt, lastTriggeredAt, lastValues, updatedBy, updatedAt, archivedAt]
          properties:
            id:
