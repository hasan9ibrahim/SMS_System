        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rerating-requests/{id}/decline:
    post:
      tags: [routing]
      operationId: declineReratingRequest
      summary: "Decline a re-rating request (checker)"
      description: |
        Another user than the requester (403 otherwise), with a reason. Nothing is re-rated.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
