            - type: "null"

    HlrProviderRow:
      type: object
      required: [id, name, providerType, currency, defaultRate, cacheDays, timeoutMs, dailyBudget, status, liveStatus, lookups, successPct, avgResponseMs, cost, rates, rules, policies, updatedBy, updatedAt, archivedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        providerType:
          $ref: "#/components/schemas/HlrProviderType"
        currency:
          type: string
        defaultRate:
          type: number
        cacheDays:
          type: integer
        timeoutMs:
          type: integer
        dailyBudget:
          type: [number, "null"]
        status:
          $ref: "#/components/schemas/RecordStatus"
        liveStatus:
          $ref: "#/components/schemas/HlrLiveStatus"
        lookups:
          type: integer
        successPct:
          type: [number, "null"]
        avgResponseMs:
          type: [integer, "null"]
        cost:
          type: number
        rates:
          type: integer
          description: Destinations with their own price.
        rules:
          type: integer
        policies:
          type: integer
        updatedBy:
          type: [string, "null"]
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        archivedAt:
          type: [string, "null"]
          format: date-time

    HlrProviderPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/HlrProviderRow"

    HlrProviderRate:
      type: object
      required: [id, providerId, destinationId, mccmnc, country, network, rate, currency, updatedBy, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        providerId:
          $ref: "#/components/schemas/Id"
        destinationId:
          $ref: "#/components/schemas/Id"
        mccmnc:
          type: string
        country:
          type: string
        network:
          type: string
        rate:
