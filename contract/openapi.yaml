                    type: string
                    format: date
                  transactionType:
                    $ref: "#/components/schemas/TransactionType"
                  paymentType:
                    type: string
                    enum: [credit, debit]
                  amount:
                    type: number
                  currency:
                    type: string
            createdBy:
              type: [string, "null"]
            createdAt:
              $ref: "#/components/schemas/Timestamp"
            updatedBy:
              type: [string, "null"]
            updatedAt:
              $ref: "#/components/schemas/Timestamp"

    InvoiceUpdate:
      type: object
      additionalProperties: false
      required: [dueDate, remarks]
