          maxLength: 100
        extraHeaders:
          type: [string, "null"]
          maxLength: 2000
          description: 'One "Name: value" per line.'
        postData:
          type: [string, "null"]
          maxLength: 4000
          description: POST body template ({DNID} is replaced); null = GET.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        defaultRate:
          type: number
          minimum: 0
          maximum: 1
          description: Price per live lookup for destinations without their own price.
        cacheDays:
          type: integer
          minimum: 0
          maximum: 7
          description: Enable Caching (0-7 days); a policy can set its own cache times.
        timeoutMs:
          type: integer
          minimum: 100
          maximum: 30000
        dailyBudget:
          type: [number, "null"]
          minimum: 0
          description: Spend per day after which the provider is skipped (null = no limit).
        status:
          $ref: "#/components/schemas/RecordStatus"
        responseMapping:
          $ref: "#/components/schemas/HlrResponseMapping"

