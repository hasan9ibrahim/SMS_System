      required: [trunk, translation, sender, receiver, mccmnc, destination, encoding, customerRate, route, vendorCost, marginPct, blocked, testSms]
      properties:
        trunk:
          type: object
          required: [id, name, enterprise]
          properties:
            id:
              $ref: "#/components/schemas/Id"
            name:
              type: string
            enterprise:
              type: string
        translation:
          $ref: "#/components/schemas/TrunkRulesTestResult"
        sender:
          type: string
          description: After translation.
        receiver:
          type: string
          description: After translation.
        mccmnc:
          type: [string, "null"]
        destination:
          type: [string, "null"]
        encoding:
          $ref: "#/components/schemas/MessageEncoding"
        customerRate:
          oneOf:
            - type: object
              required: [rate, currency, platformRate, rateTableId, rateTable]
              properties:
                rate:
                  type: number
                currency:
                  type: string
                platformRate:
                  type: number
                  description: The rate in the platform currency.
                rateTableId:
                  $ref: "#/components/schemas/Id"
                rateTable:
                  type: string
            - type: "null"
        route:
