          enum: [customer, vendor]
        reprocessType:
          type: string
          enum: [manual, auto]
        description:
          type: [string, "null"]
        senderId:
          type: [string, "null"]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        enterprises:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                $ref: "#/components/schemas/Id"
              name:
                type: string
        rateTableId:
          $ref: "#/components/schemas/Id"
        rateTableName:
          type: string
        reason:
          type: string
          enum: [rate_correction]
        mccmncs:
          type: array
          items:
            type: string
        noNote:
          type: boolean
        priority:
          type: string
          enum: [P1, P2, P3]
        requestStatus:
          type: string
          enum: [pending_approval, approved, declined]
        reprocessStatus:
          type: string
          enum: [not_started, in_queue, in_process, completed, failed]
        requestedBy:
          type: string
        requestedAt:
          $ref: "#/components/schemas/Timestamp"
        decidedBy:
          type: [string, "null"]
        decidedAt:
          type: [string, "null"]
          format: date-time
        declineReason:
          type: [string, "null"]
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        totalEdrs:
          type: [integer, "null"]
        error:
          type: [string, "null"]
        canDecide:
          type: boolean
          description: The signed-in user may approve or decline (pending, and not the requester).
        canEdit:
          type: boolean
          description: The signed-in user may change it (pending, and the requester).
        updatedBy:
          type: [string, "null"]
        updatedAt:
          $ref: "#/components/schemas/Timestamp"

    ReratingDetail:
      allOf:
        - $ref: "#/components/schemas/ReratingRequestFields"
        - type: object
          required: [summary]
          properties:
            summary:
              type: array
