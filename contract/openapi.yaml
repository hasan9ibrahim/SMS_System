            application/json:
              schema:
                $ref: "#/components/schemas/QbrStatSaved"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

