            - type: "null"
        label:
          type: string

    HlrRuleFields:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        providerId:
          $ref: "#/components/schemas/Id"
        dnidPattern:
          type: string
          minLength: 1
          maxLength: 200
          description: Regular expression on the receiver (after translation), e.g. ^44.
        status:
          $ref: "#/components/schemas/RecordStatus"
        insertAt:
          type: string
          enum: [top, bottom]
