        Same filter and sort as the list; up to 100,000 rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: CSV file, UTF-8, header row
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /vendor-invoices:
    post:
      tags: [finance]
      operationId: createVendorInvoice
      summary: "Add a vendor invoice (upload by hand, §13.31)"
      description: |
        Saves the invoice and runs the comparison with our EDR figures for the same partner, period,
        currency and time zone straight away; a match is accepted (and the acceptance e-mail sent or queued,
        as the partner's rule says). One undoable change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInvoiceInput"
      responses:
        "201":
          description: Created and checked, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorInvoiceSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /vendor-invoices/import:
    post:
      tags: [finance]
      operationId: importVendorInvoices
      summary: "Import vendor invoices from CSV (modal Vendor Invoice)"
      description: |
        Columns: `enterprise` (name or alias), `invoice_number`, `charge_volume`, `charge_amount`, `currency`,
        `invoice_date`, `due_date`, `period_from`, `period_to`, `timezone`, `remarks`. Invoices already on
        file (same partner and number) are reported as unchanged. All or nothing; each added invoice is
        checked as on Add. One undoable change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "200":
          description: What the import adds; `applied` says whether it was saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /vendor-invoices/{id}:
    get:
      tags: [finance]
      operationId: getVendorInvoice
      summary: "One vendor invoice with its reconciliation history"
      description: |
        Figures, the rule used for the last check and why it matched or not, every status change, note and
        e-mail with user and time (§13.31).
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: The invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorInvoiceDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [finance]
      operationId: updateVendorInvoice
      summary: "Edit a vendor invoice"
      description: |
        Saves the whole form and checks the invoice again. A decided invoice (accepted or rejected) keeps
        its status. One undoable change.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInvoiceInput"
      responses:
        "200":
          description: Saved, with the change (null when nothing differed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorInvoiceSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /vendor-invoices/{id}/comparison:
    get:
      tags: [finance]
      operationId: getVendorInvoiceComparison
      summary: "Result screen: their figures against ours per destination (§13.31)"
      description: |
        Our vendor cost and billable messages per MCCMNC for the invoice's period and time zone, against
        the invoice lines when it has them, sorted by the largest difference. `coverage` says whether the
        EDR store holds the whole period.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: The comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorInvoiceComparison"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /vendor-invoices/{id}/recheck:
    post:
      tags: [finance]
      operationId: recheckVendorInvoice
      summary: "Run the comparison again"
      description: |
        Reads our figures again and applies the partner's current rule. A pending invoice that now
        matches is accepted. Logged in the history.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: The invoice after the check, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorInvoiceSaved"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /vendor-invoices/{id}/decide:
    post:
      tags: [finance]
      operationId: decideVendorInvoice
      summary: "Accept, reject or keep pending (§13.31 Actions)"
      description: |
        accept: status Accepted, acceptance e-mail when `sendEmail`. reject: status Rejected and the rejection
        e-mail with the note and our figures. keep_pending: status Disputed, the note is kept. send_acceptance:
        sends the acceptance e-mail queued under "confirm before sending". A note is required to reject, to
        keep pending and to accept an invoice that did not match. One undoable change.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInvoiceDecision"
      responses:
        "200":
          description: The invoice, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorInvoiceSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /vendor-invoices/{id}/notes:
    post:
      tags: [finance]
      operationId: addVendorInvoiceNote
      summary: "Add a note to a vendor invoice"
      description: |
        Shows in the invoice history and on the partner's dispute list.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInvoiceNote"
      responses:
        "200":
          description: The invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorInvoiceDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

