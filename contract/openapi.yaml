        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/Destination"

    # ------------------------------------------------------------- Product reference data (§6.1)
    ProductCategory:
      type: object
      required: [id, name, customerTrunks, vendorTrunks, rateTables, updatedBy, updatedAt, archivedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        customerTrunks:
          type: integer
        vendorTrunks:
          type: integer
        rateTables:
          type: integer
        updatedBy:
          type: [string, "null"]
          description: Username of the last change; null for seeded records.
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        archivedAt:
          type: [string, "null"]
          format: date-time
          description: Set when deleted (archived, §13.29).

    ProductCategoryInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40

    ProductCategorySaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/ProductCategory"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    ProductCategoryPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/ProductCategory"

    Country:
      type: object
      required: [id, name, iso, dialCode, region, networks, updatedBy, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        iso:
          type: string
          description: ISO 3166-1 alpha-2; not unique (e.g. Abkhazia shares GE).
        dialCode:
          type: string
          description: Country calling code without "+".
        region:
          type: string
          description: Region set of the destination picker (§13.21).
        networks:
          type: integer
          description: Live MCCMNC codes of the country, its All networks code included.
        updatedBy:
          type: [string, "null"]
          description: Username of the last change; null for seeded records.
        updatedAt:
          $ref: "#/components/schemas/Timestamp"

    CountryInput:
      type: object
      additionalProperties: false
      required: [name, iso, dialCode, region]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        iso:
          type: string
          pattern: "^[A-Z]{2}$"
        dialCode:
          type: string
          pattern: "^[0-9]{1,4}$"
        region:
          type: string
          minLength: 1
          maxLength: 40

    CountrySaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/Country"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    CountryPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/Country"

    DestinationInput:
      type: object
      additionalProperties: false
      required: [mcc, mnc, countryId, network]
      properties:
        mcc:
          type: string
          pattern: "^[0-9]{3}$"
        mnc:
          type: string
          pattern: "^([0-9]{2,3})?$"
          description: Empty = the country-level "All networks" code.
        originalMnc:
          type: [string, "null"]
          maxLength: 10
          description: The MNC as the operator publishes it, when the code uses another (e.g. a 2-digit form).
        countryId:
          $ref: "#/components/schemas/Id"
        network:
          type: string
          minLength: 1
          maxLength: 120

    ImportRequest:
      type: object
      additionalProperties: false
      required: [csv, dryRun]
      properties:
        csv:
          type: string
          maxLength: 20000000
          description: The file's text, UTF-8, with a header row (comma or semicolon separated).
        dryRun:
          type: boolean
          description: Only check and count; nothing is saved. The GUI always runs a dry run first.
        mode:
          type: string
          enum: [merge, replace]
          description: "merge (when omitted): add and update only. replace: also archive what the file leaves out."

    ImportIssue:
      type: object
      required: [line, key, message]
      properties:
        line:
          type: [integer, "null"]
          description: Line in the file (header = 1); null when not tied to a line.
        key:
          type: [string, "null"]
          description: The row's key, e.g. the MCCMNC code or prefix.
        message:
          type: string

    ImportResult:
      type: object
      required: [applied, dryRun, total, added, updated, unchanged, archived, errors, warnings, kept, change]
      properties:
        applied:
          type: boolean
          description: True when saved (not a dry run and no errors).
        dryRun:
          type: boolean
        total:
          type: integer
          description: Data rows in the file.
        added:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
        archived:
          type: integer
          description: Records left out of the file and archived (replace mode).
        errors:
          type: array
          description: Rows that stop the import (at most 200 listed).
          items:
            $ref: "#/components/schemas/ImportIssue"
        warnings:
          type: array
          description: Rows imported with a remark, e.g. a duplicate row (at most 200 listed).
          items:
            $ref: "#/components/schemas/ImportIssue"
        kept:
          type: array
          description: Records missing from the file but kept because they are still in use (at most 200 listed).
          items:
            $ref: "#/components/schemas/ImportIssue"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

