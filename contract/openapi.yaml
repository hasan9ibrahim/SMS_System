        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"
        affected:
          type: integer

    TrafficFigures:
      type: object
      required: [messages, asr, dlr, margin]
      properties:
        messages:
          type: integer
        asr:
          type: [number, "null"]
        dlr:
          type: [number, "null"]
        margin:
          type: number

    RouteTraffic:
      type: object
      required: [window, available, from, to, total, byCustomer, byVendor, series]
      properties:
        window:
          $ref: "#/components/schemas/TrafficWindow"
        available:
          type: boolean
          description: False when the EDR store does not answer (figures are then empty).
        from:
          $ref: "#/components/schemas/Timestamp"
        to:
          $ref: "#/components/schemas/Timestamp"
        total:
          $ref: "#/components/schemas/TrafficFigures"
        byCustomer:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/TrafficFigures"
              - type: object
                required: [customerTrunkId, name, enterpriseName, sharePct]
                properties:
                  customerTrunkId:
                    $ref: "#/components/schemas/Id"
                  name:
                    type: string
                  enterpriseName:
                    type: string
                  sharePct:
                    type: number
        byVendor:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/TrafficFigures"
              - type: object
                required: [vendorTrunkId, name, sharePct]
                properties:
                  vendorTrunkId:
                    $ref: "#/components/schemas/Id"
                  name:
                    type: string
                  sharePct:
                    type: number
        series:
          type: array
          description: Buckets over the window (minutes for 15m and 1h, hours for 24h, days for 7d and 30d).
          items:
            type: object
            required: [at, messages, margin]
            properties:
              at:
                $ref: "#/components/schemas/Timestamp"
              messages:
                type: integer
              margin:
                type: number

    RouteTestRequest:
      type: object
      description: A sample message for the rule Test and the Route Simulator.
      required: [receiver]
      additionalProperties: false
      properties:
        customerTrunkId:
          $ref: "#/components/schemas/Id"
        receiver:
          type: string
          pattern: "^[0-9]{5,15}$"
        sender:
          type: string
          maxLength: 20
        content:
          type: string
          maxLength: 1600
        mccmnc:
          type: string
          pattern: "^[0-9]{3,6}$"
          description: Overrides the destination found from the number (e.g. after HLR).
        tps:
          type: number
          minimum: 0
          description: Simulated TPS (§13.8).
        revenuePerMessage:
          type: number
          minimum: 0
          description: Simulated per-message revenue in the base currency (§13.9); default from the trunk's rate.
        accumulatedRevenue:
          type: number
          minimum: 0
          description: Simulated revenue already earned in the period (§13.9).
        hlrPorted:
          type: boolean
        warmupSent:
          type: integer
          minimum: 0
          description: Messages already counted towards warm-up thresholds (§13.27).

    RouteCheck:
      type: object
      required: [condition, ok, detail]
      properties:
        condition:
          type: string
        ok:
          type: boolean
        detail:
          type: string

    RouteCandidate:
      type: object
      required: [vendorTrunkId, name, level, cost, margin, note]
      properties:
        vendorTrunkId:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        level:
          type: integer
        cost:
          type: [number, "null"]
          description: Buy rate for the destination in the base currency.
        margin:
          type: [number, "null"]
        note:
          type: [string, "null"]

    RouteDecision:
      type: object
      required: [ruleId, matched, checks, outcome, vendor, candidates, mccmnc, destination, sellRate]
      properties:
        ruleId:
          $ref: "#/components/schemas/Id"
        matched:
          type: boolean
        checks:
          type: array
          items:
            $ref: "#/components/schemas/RouteCheck"
        outcome:
          type: string
          enum: [route, block, no_vendor, not_matched]
        vendor:
          oneOf:
            - type: object
              required: [vendorTrunkId, name, level, decidedBy]
              properties:
                vendorTrunkId:
                  $ref: "#/components/schemas/Id"
                name:
                  type: string
                level:
                  type: integer
                decidedBy:
                  type: string
                  enum: [whitelist, warmup, percentage, top_down, round_robin, lcr, qbr]
            - type: "null"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/RouteCandidate"
        mccmnc:
          type: [string, "null"]
        destination:
          type: [string, "null"]
          description: Country · network of the destination.
        sellRate:
          type: [number, "null"]
          description: Customer rate for the message in the base currency, when a customer trunk is given.

    RouteSimulation:
      type: object
      required: [tried, decision]
      properties:
        tried:
          type: array
          description: Rules tried in priority order, up to the deciding one (at most 100 listed).
          items:
            type: object
            required: [ruleId, name, priority, matched, reason]
            properties:
              ruleId:
                $ref: "#/components/schemas/Id"
              name:
                type: string
              priority:
                type: integer
              matched:
                type: boolean
              reason:
                type: string
        decision:
          oneOf:
            - $ref: "#/components/schemas/RouteDecision"
            - type: "null"

    # ------------------------------------------------------------- list query (§13.25)
    ListId:
      type: string
      description: A list page whose fields are described by `/meta/lists/{list}/fields`.
      enum: [enterprises, users, changes, customer_trunks, vendor_trunks, rate_tables, rate_lines, destinations, route_rules]

    FilterOperator:
      type: string
      description: |
        Operators from §13.25. All text comparisons are case-insensitive.

        * `eq`, `neq`: equals / not equals.
        * `like`, `not_like`: wildcard match, `%` = any text, `_` = one character
          (`re%` starts with, `%re` ends with, `%re%` contains). A literal `%` or `_`
          is escaped with a backslash.
        * `in`, `not_in`: value in list (`values`).
        * `between`: inclusive range, `values` = [from, to].
        * `gt`, `gte`, `lt`, `lte`: greater / less than.
        * `empty`, `not_empty`: null or empty string; no value.
        * `regex`: POSIX regular expression, case-insensitive.
      enum: [eq, neq, like, not_like, in, not_in, between, gt, gte, lt, lte, empty, not_empty, regex]

    FilterValue:
      description: A single filter operand. Dates and times are ISO 8601 strings.
      type: [string, number, boolean]

    FilterCondition:
      type: object
      description: One "field + operator + value" condition (a column filter or a builder row).
      required: [field, op]
      additionalProperties: false
      properties:
        field:
          type: string
          description: A field name from the list's field catalogue (hidden fields included).
        op:
          $ref: "#/components/schemas/FilterOperator"
        value:
          $ref: "#/components/schemas/FilterValue"
          description: Operand for single-value operators.
        values:
          type: array
          description: Operands for `in`, `not_in` (any length) and `between` (exactly 2).
          items:
            $ref: "#/components/schemas/FilterValue"

    FilterGroup:
      type: object
      description: |
        Conditions combined with AND or OR. Groups nest, so the builder can express
        "A AND (B OR C)". Column filters and builder conditions are sent together as
        one tree; the top level is normally `and`.
      required: [logic, conditions]
      additionalProperties: false
      properties:
        logic:
          type: string
          enum: [and, or]
        conditions:
          type: array
          maxItems: 200
          items:
            oneOf:
              - $ref: "#/components/schemas/FilterCondition"
              - $ref: "#/components/schemas/FilterGroup"

    SortKey:
      type: object
      required: [field, dir]
      additionalProperties: false
      properties:
        field:
          type: string
        dir:
          type: string
          enum: [asc, desc]

    ListQuery:
      type: object
      description: |
        Server-side filter, sort and paging for every list (§13.25, §14.2). The first
        request has no `cursor`; each next page sends the previous response's
        `nextCursor` with the same filter and sort. Without `sort` the server applies
        the list's default (for destination lists: country name, then network name).
      additionalProperties: false
      properties:
        filter:
          $ref: "#/components/schemas/FilterGroup"
        search:
          type: string
          maxLength: 200
          description: Quick search across the list's text columns (case-insensitive, wildcards allowed).
        sort:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/SortKey"
        limit:
          type: integer
          minimum: 1
          maximum: 4000
          default: 100
          description: Rows per page (page-size choices in §1 go up to 4,000).
        cursor:
          type: [string, "null"]
          description: Opaque position from the previous page's `nextCursor`.
        withTotal:
          type: boolean
          default: true
          description: Compute `total`. Very large lists (EDRs) may return an estimate.

    ListPageMeta:
      type: object
      required: [total, totalIsEstimate, nextCursor]
      properties:
        total:
          type: integer
          minimum: 0
          description: Rows matching the filter (shown as the row count, §13.25 / §15.4 status bar).
        totalIsEstimate:
          type: boolean
          description: True when `total` is an estimate (very large lists).
        nextCursor:
          type: [string, "null"]
          description: Pass as `cursor` to fetch the next page; null on the last page.

    FieldType:
      type: string
      description: Decides the column filter widget (§15.1) and the allowed operators.
      enum: [text, prefix, integer, decimal, money, percent, enum, boolean, date, datetime, mccmnc]

    FieldDescriptor:
      type: object
      required: [field, label, type, operators, sortable, hidden]
      properties:
        field:
          type: string
        label:
          type: string
        type:
          $ref: "#/components/schemas/FieldType"
        operators:
          type: array
          items:
            $ref: "#/components/schemas/FilterOperator"
        defaultOperator:
          $ref: "#/components/schemas/FilterOperator"
          description: Operator used by the column filter box under the header.
        sortable:
          type: boolean
        hidden:
          type: boolean
          description: Not shown as a column by default, but still filterable (§13.25).
        enumValues:
          type: array
          description: Choices for `enum` fields (dropdown filter with Select All, §1).
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: string
              label:
                type: string

    ListFields:
      type: object
      required: [list, fields, defaultSort]
      properties:
        list:
          $ref: "#/components/schemas/ListId"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldDescriptor"
        defaultSort:
          type: array
          items:
            $ref: "#/components/schemas/SortKey"

    # ------------------------------------------------------------- enterprises (§5)
    EnterpriseType:
      type: string
      enum: [customer, vendor, reciprocal]
      description: Reciprocal = both customer and vendor.

    EnterpriseTier:
      type: string
      enum: [tier1, tier2, tier3]

    RecordStatus:
      type: string
      enum: [active, inactive]

    Enterprise:
      description: |
        Skeleton of the General Info record (§5.1). Address, contacts, credit alert
        percentages, docs and billing are added with the Enterprises screen (build step 4.1).
      allOf:
        - type: object
          required: [id, name, alias, type, tier, status, businessCompanyId, accountManagerId]
          properties:
            id:
              $ref: "#/components/schemas/Id"
            name:
              type: string
              minLength: 1
              maxLength: 200
            alias:
              type: string
              minLength: 1
              maxLength: 100
            type:
              $ref: "#/components/schemas/EnterpriseType"
            tier:
              $ref: "#/components/schemas/EnterpriseTier"
            status:
              $ref: "#/components/schemas/RecordStatus"
            businessCompanyId:
              $ref: "#/components/schemas/Id"
            accountManagerId:
              $ref: "#/components/schemas/Id"
            accountManagerName:
              type: [string, "null"]
              description: Display name of the current account manager (§13.30 keeps the history).
            businessCompanyName:
              type: string
            country:
              type: [string, "null"]
              description: ISO 3166-1 alpha-2.
            archivedAt:
              description: Set when the enterprise is archived (§13.29); archived rows show only with the "archived" filter.
              oneOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
        - $ref: "#/components/schemas/Audit"

    EnterprisePage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/Enterprise"

    # ------------------------------------------------------------- Rate Lookup (§13.16)
    LookupDestination:
      type: object
      required: [mccmnc, mcc, country, countryIso, network, allNetworks]
      properties:
        mccmnc:
          type: string
          description: A 3-digit code is the whole country (§13.21).
        mcc:
          type: string
        country:
          type: string
        countryIso:
          type: string
        network:
          type: string
        allNetworks:
          type: boolean

    LookupResolution:
      type: object
      required: [kind, destinations]
      properties:
        kind:
          type: string
          enum: [text, number]
          description: "`number` when the query is a phone number (digits, optional +, 6 or more)."
        number:
          description: How a phone number was resolved.
          oneOf:
            - type: "null"
            - type: object
              required: [resolvedBy, prefix, ported]
              properties:
                resolvedBy:
                  type: string
                  enum: [prefix, hlr]
                prefix:
                  type: [string, "null"]
                  description: The dial-code prefix that matched.
                ported:
                  type: [boolean, "null"]
                  description: HLR only; the number was ported away from the prefix's network.
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/LookupDestination"

    CurrencyMode:
      type: string
      enum: [original, converted]
      description: Rates in their table currency, or converted to the lookup currency (USD).

    RateLookupRequest:
      type: object
      additionalProperties: false
      required: [mccmnc]
      properties:
        mccmnc:
          type: string
          pattern: "^[0-9]{3,6}$"
        myClientsOnly:
          type: boolean
          description: Only clients whose account manager is the signed-in user.
        includeInactive:
          type: boolean
          description: Include inactive trunks (archived ones never show).
        showScheduled:
          type: boolean
          description: Include the next scheduled rate of each line.
        currency:
          $ref: "#/components/schemas/CurrencyMode"
        asOf:
          description: Rates valid at this time; default now. A past date shows what was charged then.
          $ref: "#/components/schemas/Timestamp"
        senderId:
          type: string
          maxLength: 20
          description: Use the sender-ID line where a table has one (§6.2).

    LookupRate:
      type: object
      description: One rate line as the lookup shows it.
      required: [rateTableId, rate, currency, rateConverted, effectiveFrom, validTo, matchedCode, scheduled]
      properties:
        rateTableId:
          $ref: "#/components/schemas/Id"
        rate:
          type: number
        currency:
          type: string
        rateConverted:
          type: number
          description: In the lookup currency (USD) at the latest exchange rate.
        effectiveFrom:
          $ref: "#/components/schemas/Timestamp"
        validTo:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        matchedCode:
          type: string
          description: The line's code; the country code when a network falls back to "all networks".
        senderId:
          type: [string, "null"]
        scheduled:
          description: The next rate after this one, when asked for.
          oneOf:
            - type: "null"
            - type: object
              required: [rate, rateConverted, effectiveFrom]
              properties:
                rate:
                  type: number
                rateConverted:
                  type: number
                effectiveFrom:
                  $ref: "#/components/schemas/Timestamp"

    LookupVendorCost:
      allOf:
        - $ref: "#/components/schemas/LookupRate"
        - type: object
          required: [vendorTrunkId, vendorTrunkName, enterpriseId, enterpriseName, tier, category, status, routed, messages24h, asr24h, dlr24h]
          properties:
            vendorTrunkId:
              $ref: "#/components/schemas/Id"
            vendorTrunkName:
              type: string
            enterpriseId:
              $ref: "#/components/schemas/Id"
            enterpriseName:
              type: string
            tier:
              type: string
              enum: [tier1, tier2, tier3]
            category:
              type: string
            status:
              $ref: "#/components/schemas/RecordStatus"
            routed:
              type: boolean
              description: Routing sends this destination to the vendor for at least one client today.
            messages24h:
              type: [integer, "null"]
              description: Messages to this destination over the last 24 h; null without the EDR store.
            asr24h:
              type: [number, "null"]
            dlr24h:
              type: [number, "null"]

    LookupClientRate:
      allOf:
        - $ref: "#/components/schemas/LookupRate"
        - type: object
          required:
            [customerTrunkId, customerTrunkName, enterpriseId, enterpriseName, rateTableName, category, status,
             accountManager, messages7d, routedVendor, marginBest, marginBestPct, marginRouted, marginRoutedPct]
          properties:
            customerTrunkId:
              $ref: "#/components/schemas/Id"
            customerTrunkName:
              type: string
            enterpriseId:
              $ref: "#/components/schemas/Id"
            enterpriseName:
              type: string
            rateTableName:
              type: string
            category:
              type: [string, "null"]
            status:
              $ref: "#/components/schemas/RecordStatus"
            accountManager:
              oneOf:
                - type: "null"
                - type: object
                  required: [id, name]
                  properties:
                    id:
                      $ref: "#/components/schemas/Id"
                    name:
                      type: string
            messages7d:
              type: [integer, "null"]
            routedVendor:
              description: The vendor today's route rules pick for this trunk and destination; null when blocked or unrouted.
              oneOf:
                - type: "null"
                - type: object
                  required: [vendorTrunkId, name, cost, decidedBy, ruleId]
                  properties:
                    vendorTrunkId:
                      $ref: "#/components/schemas/Id"
                    name:
                      type: string
                    cost:
                      type: [number, "null"]
                      description: Buy rate in the lookup currency.
                    decidedBy:
                      type: string
                    ruleId:
                      $ref: "#/components/schemas/Id"
            marginBest:
              type: [number, "null"]
              description: Sell minus the best vendor cost, lookup currency.
            marginBestPct:
              type: [number, "null"]
            marginRouted:
              type: [number, "null"]
              description: Sell minus the routed vendor's cost, lookup currency.
            marginRoutedPct:
              type: [number, "null"]

    RateLookupResult:
      type: object
      required: [destination, asOf, lookupCurrency, bestCost, vendors, clients]
      properties:
        destination:
          $ref: "#/components/schemas/LookupDestination"
        asOf:
          $ref: "#/components/schemas/Timestamp"
        lookupCurrency:
          type: string
          description: Currency of the converted figures and margins.
        bestCost:
          type: [number, "null"]
          description: Cheapest active vendor cost, lookup currency.
        vendors:
          type: array
          items:
            $ref: "#/components/schemas/LookupVendorCost"
        clients:
          type: array
          items:
            $ref: "#/components/schemas/LookupClientRate"

    MatrixView:
      type: string
      enum: [vendor_costs, client_rates, margin, cheapest]

    MatrixHighlight:
      type: string
      enum: [below_cost, cheaper_than_routed, expiring_soon, single_vendor]
      description: |
        below_cost: a client sells under the best vendor cost; cheaper_than_routed: a vendor is
        cheaper than the one routing uses; expiring_soon: a rate ends within 14 days with no
        version after it; single_vendor: only one vendor has a rate. Filtering on highlights
        scans at most 1,000 destinations.

    RateLookupQuery:
      type: object
      description: What to look up in advanced mode, and how (saved with a lookup).
      required: [view]
      properties:
        countryIds:
          type: array
          maxItems: 300
          items:
            $ref: "#/components/schemas/Id"
        mccmncs:
          type: array
          maxItems: 5000
          items:
            type: string
            pattern: "^[0-9]{3,6}$"
        numbers:
          type: array
          maxItems: 5000
          description: Pasted or uploaded numbers, resolved by dial-code prefix.
          items:
            type: string
            pattern: "^\\+?[0-9]{6,15}$"
        accountManagerIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        customerEnterpriseIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        customerTrunkIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        rateTableIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        vendorEnterpriseIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        vendorTrunkIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        tiers:
          type: array
          items:
            type: string
            enum: [tier1, tier2, tier3]
        categoryIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        businessCompanyIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        currencies:
          type: array
          description: Only rate tables in these currencies.
          items:
            type: string
        senderId:
          type: string
          maxLength: 20
        asOf:
          $ref: "#/components/schemas/Timestamp"
        view:
          $ref: "#/components/schemas/MatrixView"
        cheapestN:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
        currency:
          $ref: "#/components/schemas/CurrencyMode"
        includeInactive:
          type: boolean
        highlights:
          type: array
          description: Keep only destinations with any of these highlights.
          items:
            $ref: "#/components/schemas/MatrixHighlight"

    RateMatrixRequest:
      allOf:
        - $ref: "#/components/schemas/RateLookupQuery"
        - type: object
          properties:
            limit:
              type: integer
              minimum: 1
              maximum: 200
              default: 50
            cursor:
              type: [string, "null"]
      unevaluatedProperties: false

    MatrixColumn:
      type: object
      required: [key, kind, id, name, detail]
      properties:
        key:
          type: string
        kind:
          type: string
          enum: [vendor, client, rank]
        id:
          type: [integer, "null"]
          description: Vendor or customer trunk ID; null for rank columns.
        name:
          type: string
        detail:
          type: string
          description: Enterprise name, or "Cheapest 1" for ranks.

    MatrixCell:
      type: object
      required: [rate, currency, rateConverted]
      properties:
        rate:
          type: number
        currency:
          type: string
        rateConverted:
          type: number
        rateTableId:
          $ref: "#/components/schemas/Id"
        vendorTrunkId:
          $ref: "#/components/schemas/Id"
          description: Rank columns - the vendor in that place.
        vendorName:
          type: string
        asr:
          type: [number, "null"]
        dlr:
          type: [number, "null"]
        marginBest:
          type: [number, "null"]
        marginRouted:
          type: [number, "null"]
        routedVendor:
          type: [string, "null"]
        best:
          type: boolean
          description: The cheapest vendor cell of the row.
        routed:
          type: boolean
          description: Vendor columns - routing uses this vendor for the destination.
        expiring:
          type: boolean
          description: The rate ends within 14 days with no version after it.
        scheduled:
          oneOf:
            - type: "null"
            - type: object
              required: [rate, effectiveFrom]
              properties:
                rate:
                  type: number
                effectiveFrom:
                  $ref: "#/components/schemas/Timestamp"

    MatrixRow:
      type: object
      required: [destination, bestCost, bestVendor, vendorCount, highlights, cells]
      properties:
        destination:
          $ref: "#/components/schemas/LookupDestination"
        bestCost:
          type: [number, "null"]
        bestVendor:
          type: [string, "null"]
        vendorCount:
          type: integer
        highlights:
          type: array
          items:
            $ref: "#/components/schemas/MatrixHighlight"
        cells:
          type: array
          description: One per column, in column order; null where there is no rate.
          items:
            oneOf:
              - $ref: "#/components/schemas/MatrixCell"
              - type: "null"

    RateMatrix:
      type: object
      required: [view, asOf, lookupCurrency, columns, columnsTruncated, rows, total, nextCursor, unresolved]
      properties:
        view:
          $ref: "#/components/schemas/MatrixView"
        asOf:
          $ref: "#/components/schemas/Timestamp"
        lookupCurrency:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/MatrixColumn"
        columnsTruncated:
          type: boolean
        rows:
          type: array
          items:
            $ref: "#/components/schemas/MatrixRow"
        total:
          type: integer
          description: Destinations after the highlight filter.
        nextCursor:
          type: [string, "null"]
        unresolved:
          type: array
          description: Numbers or codes that matched no destination (at most 50).
          items:
            type: string

    SavedLookupInput:
      type: object
      additionalProperties: false
      required: [name, query]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        sharedWithUserIds:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Id"
        query:
          $ref: "#/components/schemas/RateLookupQuery"

    SavedLookup:
      type: object
      required: [id, name, owner, sharedWithUserIds, readOnly, query, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        owner:
          type: object
          required: [id, displayName]
          properties:
            id:
              $ref: "#/components/schemas/Id"
            displayName:
              type: string
        sharedWithUserIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        readOnly:
          type: boolean
        query:
          $ref: "#/components/schemas/RateLookupQuery"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
