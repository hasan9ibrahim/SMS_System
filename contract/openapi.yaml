    ReratingInput:
      type: object
      additionalProperties: false
      required: [description, startDate, endDate, side, enterpriseIds, rateTableId, reason, mccmncs, senderId, noNote, priority]
      properties:
        description:
          type: [string, "null"]
          maxLength: 500
        startDate:
          type: string
          format: date
          description: First day, UTC.
        endDate:
          type: string
          format: date
          description: Last day (inclusive), UTC.
        side:
          type: string
          enum: [customer, vendor]
        enterpriseIds:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/Id"
        rateTableId:
          $ref: "#/components/schemas/Id"
          description: The corrected table; only EDRs billed with it are re-rated.
        reason:
          type: string
          enum: [rate_correction]
        mccmncs:
          type: array
          maxItems: 500
          description: Limit to these codes (a 3-digit code = the whole country); empty = all.
          items:
            type: string
            pattern: "^[0-9]{3,6}$"
        senderId:
          type: [string, "null"]
          maxLength: 20
        noNote:
          type: boolean
          description: "\"Don't add credit/debit note to transaction\": compute only."
        priority:
          type: string
          enum: [P1, P2, P3]

    ReratingDecline:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    ReratingSummaryRow:
      type: object
      required: [enterpriseId, enterpriseName, side, totalEdrs, oldAmount, newAmount, amount, currency, paymentType, transactionStatus, transactionId, startTime, endTime, updatedBy]
      properties:
        enterpriseId:
          $ref: "#/components/schemas/Id"
        enterpriseName:
          type: string
        side:
          type: string
          enum: [customer, vendor]
        totalEdrs:
          type: integer
        oldAmount:
          type: number
          description: Billed, in `currency` (the rate table's).
        newAmount:
          type: number
        amount:
          type: number
          description: newAmount - oldAmount.
        currency:
          type: string
        paymentType:
          type: [string, "null"]
          enum: [credit, debit, null]
          description: The note posted to the enterprise; null when there is no difference.
        transactionStatus:
          type: string
          enum: [pending, posted, not_posted, no_difference]
          description: "pending: not processed yet; not_posted: noNote was set."
        transactionId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        startTime:
          type: [string, "null"]
          format: date-time
        endTime:
          type: [string, "null"]
          format: date-time
        updatedBy:
          type: [string, "null"]

    ReratingPreview:
