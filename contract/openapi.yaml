            - type: "null"

    QbrStatPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/QbrStat"

    # ------------------------------------------------------------- Number lists, translation rules (§6.4, §13.2)
    NumberListType:
      type: string
      enum: [random, tag, sender_id_template]
      description: "random: numbers a sender conversion picks from; tag: numbers or sender IDs rules match; sender_id_template: sender IDs with {n} placeholders."

    NumberList:
      type: object
      required: [id, name, listType, entries, usedBy, updatedBy, updatedAt, archivedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        listType:
          $ref: "#/components/schemas/NumberListType"
        entries:
          type: integer
        usedBy:
          type: integer
          description: Live translation and route rules using the list.
        updatedBy:
          type: [string, "null"]
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        archivedAt:
          type: [string, "null"]
          format: date-time

    NumberListInput:
      type: object
      additionalProperties: false
      required: [name, listType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        listType:
          $ref: "#/components/schemas/NumberListType"

    NumberListSaved:
      type: object
      required: [record, change]
      properties:
        record:
          $ref: "#/components/schemas/NumberList"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    NumberListPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/NumberList"

    NumberListEntry:
      type: object
      required: [id, numberListId, value, createdBy, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        numberListId:
          $ref: "#/components/schemas/Id"
        value:
          type: string
        createdBy:
          type: [string, "null"]
        createdAt:
          $ref: "#/components/schemas/Timestamp"

    NumberListEntryPage:
      allOf:
        - $ref: "#/components/schemas/ListPageMeta"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/NumberListEntry"

    NumberListEntriesInput:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: string
            minLength: 1
            maxLength: 64

    NumberListEntriesResult:
      type: object
      required: [added, skipped, errors, change]
      properties:
        added:
          type: integer
        skipped:
          type: integer
          description: Already in the list (or repeated in the input).
        errors:
          type: array
          description: Values that do not fit the list type; nothing is saved when there are any.
          items:
            $ref: "#/components/schemas/ImportIssue"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    TranslationTargetInput:
      type: object
      additionalProperties: false
      required: [type, trunkKind, id]
      description: What a rule applies to (§13.2); customer side = ingress, vendor side = egress.
      properties:
        type:
          type: string
          enum: [trunk, enterprise, category, all]
        trunkKind:
          type: string
          enum: [customer, vendor]
        id:
          description: Trunk, enterprise or product category ID; null for all.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"

    TranslationTarget:
      type: object
      required: [type, trunkKind, id, label]
      properties:
        type:
          type: string
          enum: [trunk, enterprise, category, all]
        trunkKind:
          type: string
          enum: [customer, vendor]
        id:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        label:
          type: string

    DlrMapEntry:
      type: object
      additionalProperties: false
      required: [fromStatus, fromError, toStatus, toError]
      description: DLR Status & Error Code Convert (§6.4) - the vendor's stat (and error) as the customer gets it.
      properties:
        fromStatus:
          type: string
          minLength: 1
          maxLength: 10
        fromError:
          type: [string, "null"]
          maxLength: 10
          description: Null = any error code.
        toStatus:
          type: string
          minLength: 1
          maxLength: 10
        toError:
          type: [string, "null"]
          maxLength: 10
          description: Null = keep the error code.

    TranslationRuleFields:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        direction:
          type: [string, "null"]
          enum: [ingress, egress, null]
          description: Override; null = implied by the trunk (customer = ingress, vendor = egress, §13.2).
        action:
          type: string
          enum: [allow, block]
        status:
          $ref: "#/components/schemas/RecordStatus"
        continueAfter:
          type: boolean
          description: Is Continue - apply further rules after this one (a trunk can override).
        senderPattern:
          type: [string, "null"]
          maxLength: 200
          description: Regular expression on the sender ID.
        senderPatternNegate:
          type: boolean
        receiverPattern:
          type: [string, "null"]
          maxLength: 200
        receiverPatternNegate:
          type: boolean
        mccmncs:
          type: array
          maxItems: 2000
          items:
            type: string
            pattern: "^[0-9]{3,6}$"
        mccmncNegate:
          type: boolean
        contentPattern:
          type: [string, "null"]
          maxLength: 500
          description: Regular expression on the message body.
        contentPatternNegate:
          type: boolean
        senderListId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        senderListNegate:
          type: boolean
        receiverListId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        receiverListNegate:
          type: boolean
        senderConversion:
          type: [string, "null"]
          enum: [left_strip, right_strip, prepend, append, translation, regex_replace, random_number, sender_id_template, null]
          description: "translation = prefix swap written \"from=to\"; regex_replace = senderConversionValue is a regular expression and senderConversionReplacement replaces each match ($1..$9 = groups)."
        senderConversionValue:
          type: [string, "null"]
          maxLength: 200
          description: "Digits to strip, text to add, \"from=to\" for translation, or the pattern for regex_replace."
        senderConversionReplacement:
          type: [string, "null"]
          maxLength: 100
          description: regex_replace only - the text each match becomes ($1..$9 insert groups); empty removes the match.
        senderConversionListId:
          description: Number list (Random or Sender ID Template) for random_number and sender_id_template.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        receiverConversion:
          type: [string, "null"]
          enum: [left_strip, right_strip, prepend, append, translation, regex_replace, null]
        receiverConversionValue:
          type: [string, "null"]
          maxLength: 200
        receiverConversionReplacement:
          type: [string, "null"]
          maxLength: 100
          description: regex_replace only - the text each match becomes ($1..$9 insert groups).
        senderTon:
          type: [integer, "null"]
          minimum: 0
          maximum: 6
        senderNpi:
          type: [integer, "null"]
          minimum: 0
          maximum: 18
        destTon:
          type: [integer, "null"]
          minimum: 0
          maximum: 6
        destNpi:
          type: [integer, "null"]
          minimum: 0
          maximum: 18
        billingType:
          type: [string, "null"]
          enum: [attempt, submit, reported, delivery, null]
        registeredDelivery:
          type: [integer, "null"]
          minimum: 0
          maximum: 1
        dlrMap:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/DlrMapEntry"
        contentRegex:
          type: [string, "null"]
          maxLength: 500
          description: Content rewrite - the part of the text to replace.
        contentRegexIndex:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
        contentReplacement:
          type: [string, "null"]
          maxLength: 1000
          description: Message Text that replaces the matched group (Regex Index) or the whole match.
        msgTemplate:
          type: [string, "null"]
          maxLength: 1000
          description: MSG Template - replaces the whole text; {text} inserts the original.
        senderMinLength:
          type: integer
          minimum: 0
          maximum: 20
        senderMaxLength:
          type: integer
          minimum: 1
          maximum: 20
        receiverMinLength:
          type: integer
          minimum: 0
          maximum: 20
        receiverMaxLength:
          type: integer
          minimum: 1
          maximum: 20
        startsAt:
          type: [string, "null"]
          format: date-time
        stopsAt:
          type: [string, "null"]
          format: date-time
        insertAt:
          type: string
          enum: [top, bottom]
          description: Where the rule runs on trunks that have no position for it.

    TranslationRuleInput:
      allOf:
        - $ref: "#/components/schemas/TranslationRuleFields"
        - type: object
          properties:
            targets:
              type: array
              maxItems: 1000
              items:
                $ref: "#/components/schemas/TranslationTargetInput"
      required: [name, direction, action, status, continueAfter, senderPattern, senderPatternNegate, receiverPattern, receiverPatternNegate, mccmncs, mccmncNegate, contentPattern, contentPatternNegate, senderListId, senderListNegate, receiverListId, receiverListNegate, senderConversion, senderConversionValue, senderConversionReplacement, senderConversionListId, receiverConversion, receiverConversionValue, receiverConversionReplacement, senderTon, senderNpi, destTon, destNpi, billingType, registeredDelivery, dlrMap, contentRegex, contentRegexIndex, contentReplacement, msgTemplate, senderMinLength, senderMaxLength, receiverMinLength, receiverMaxLength, startsAt, stopsAt, insertAt, targets]
      unevaluatedProperties: false

    TranslationRuleDetail:
      allOf:
        - $ref: "#/components/schemas/TranslationRuleFields"
