        fired:
          type: boolean
          description: Matched and changed or blocked the message.
        blocked:
          type: boolean
        checks:
          type: array
          items:
            type: object
            required: [condition, ok, detail]
            properties:
              condition:
                type: string
              ok:
                type: boolean
              detail:
                type: string
