      summary: "Restore an archived MO reference book entry (§13.29)"
      description: |
        Shown under "Delete history" (archived filter). The restore is one undoable change.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Restored, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoNumberSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /mo-numbers/import:
    post:
      tags: [reference]
      operationId: importMoNumbers
      summary: "Import MO reference book entries from CSV (dry run first)"
      description: |
        "MO Reference Book Import" (§6.1). Columns: `customer_trunk` (name), `number`, `keyword`, `rate`,
        `vendor_rate`, `mccmnc`, `setup_charge`, `fix_charge`. Amounts are in the customer trunk's currency; an
        optional `currency` column must match it.
        Rows are matched by number + keyword. `replace` archives entries missing from the file. All or
        nothing; one undoable change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "200":
          description: What the import adds, changes and reports; `applied` says whether it was saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /mo-numbers/export:
    post:
      tags: [reference]
      operationId: exportMoNumbers
      summary: "Export the filtered MO reference book entries as CSV"
      description: |
        Same filter, search and sort as the grid; every matching row. The file can be imported again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: CSV file, UTF-8, header row
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /route-map/query:
    post:
      tags: [routing]
      operationId: queryRouteMap
      summary: "Route map of a customer trunk (server-side filter, sort and paging)"
      description: |
        Which rule and vendor each destination the trunk sells gets today (§6.3 Route map, scope decided
        2026-10-17): every destination with a sell rate in the trunk's rate tables, run through the
        live route rules in order as a message without receiver or content (steady state: no warm-up, no
        number whitelists). The `customerTrunkId` filter (eq) is required. Filter, sort and paging work on
        every column, including the routed vendor, cost and margin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: One page of destinations with their route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteMapPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /route-map/export:
    post:
      tags: [routing]
      operationId: exportRouteMap
      summary: "Export a trunk's route map as CSV"
      description: |
        Same filter (with `customerTrunkId`), search and sort as the grid; every matching row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: CSV file, UTF-8, header row
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rerating-requests/query:
    post:
      tags: [routing]
      operationId: queryReratingRequests
      summary: "List re-rating requests (server-side filter, sort and paging)"
      description: |
        Re-Rating (§6.3, §12.2): requests to recompute charges on past EDRs after a rate correction, with
        their request status (maker-checker) and reprocess status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: One page of re-rating requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReratingRequestPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rerating-requests/preview:
    post:
      tags: [routing]
      operationId: previewRerating
      summary: "Estimate a re-rating before requesting it"
      description: |
        Runs the computation without saving: EDRs in scope and the difference per enterprise between the
        billed amount and the amount at the rate table's rates valid at send time (a back-dated line counts
        from its stated date, §13.32).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReratingInput"
      responses:
        "200":
          description: The estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReratingPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rerating-requests:
    post:
      tags: [routing]
      operationId: createReratingRequest
      summary: "Request a re-rating (§12.2 Re-Rating Request)"
      description: |
        Saved as Pending Approval. Another user approves or declines it (maker-checker); nothing is
        re-rated before that. One undoable change while pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReratingInput"
      responses:
        "201":
          description: Created, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReratingSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rerating-requests/{id}:
    get:
      tags: [routing]
      operationId: getReratingRequest
      summary: "One re-rating request with its summary (§12.2 Re-Rating view)"
      description: |
        The request fields, statuses and times, and the Re-Rating Summary per enterprise.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: The request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReratingDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [routing]
      operationId: updateReratingRequest
      summary: "Change a pending re-rating request"
      description: |
        Only the requester, and only while it is Pending Approval (409 otherwise). One undoable change.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReratingInput"
      responses:
        "200":
          description: Saved, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReratingSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rerating-requests/{id}/approve:
    post:
      tags: [routing]
      operationId: approveReratingRequest
      summary: "Approve a re-rating request (checker)"
      description: |
        Another user than the requester (403 otherwise). The request is queued and processed in the
        background: In Queue, In Process, then Completed (or Failed). Unless `noNote` is set, each
        enterprise with a difference gets a credit or debit note in Transactions (type Reprocess). EDRs
        keep the amounts they were billed at (§13.29).
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Approved, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReratingSaved"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /rerating-requests/{id}/decline:
    post:
      tags: [routing]
      operationId: declineReratingRequest
      summary: "Decline a re-rating request (checker)"
      description: |
        Another user than the requester (403 otherwise), with a reason. Nothing is re-rated.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReratingDecline"
      responses:
        "200":
          description: Declined, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReratingSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /qbr-stats/query:
    post:
      tags: [routing]
      operationId: queryQbrStats
      summary: "List QBR stats (server-side filter, sort and paging)"
      description: |
        QBR Stats (§6.3): ASR, DLR and ADD (average delivery delay, s) per vendor or customer trunk and
        MCCMNC, from the last 24 hours of EDRs, refreshed every 5 minutes. The `side` filter (eq customer or
        vendor) is required. A vendor stat can be overridden by hand; the override wins until cleared, and
        QBR routing uses the effective DLR per destination.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: One page of QBR stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QbrStatPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /qbr-stats/vendor-override:
    put:
      tags: [routing]
      operationId: setQbrVendorOverride
      summary: "Add or override a vendor stat (Add Vendor Stat)"
      description: |
        Seeds or overrides the scores of a vendor trunk for a destination; a null value keeps the traffic
        figure. One undoable change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QbrOverrideInput"
      responses:
        "200":
          description: The stat, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QbrStatSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /qbr-stats/{id}/clear-override:
    post:
      tags: [routing]
      operationId: clearQbrOverride
      summary: "Clear a vendor stat override"
      description: |
        The traffic figures apply again. One undoable change.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: The stat, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QbrStatSaved"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /number-lists/query:
    post:
      tags: [switch]
      operationId: queryNumberLists
      summary: "List number lists (server-side filter, sort and paging)"
      description: |
        Number List (§6.4): Random, Tag and Sender ID Template lists used by translation and route rules,
        with their entry count and how many rules use them. Hidden `archived` field = deleted lists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: One page of number lists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberListPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /number-lists:
    post:
      tags: [switch]
      operationId: createNumberList
      summary: "Add a number list (§6.4)"
      description: |
        Also used by "+ New list" inside rule forms (§13.2). One undoable change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NumberListInput"
      responses:
        "201":
          description: Created, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberListSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /number-lists/{id}:
    put:
      tags: [switch]
      operationId: updateNumberList
      summary: "Rename a number list or change its type"
      description: |
        The type cannot change while entries do not fit it (400). One undoable change.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NumberListInput"
      responses:
        "200":
          description: Saved, with the change (null when nothing differed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberListSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /number-lists/{id}/dependencies:
    get:
      tags: [switch]
      operationId: getNumberListDependencies
      summary: "What uses a number list (safe delete, §13.29)"
      description: |
        Translation rules (match lists and sender conversion) and route rules (sender / receiver lists,
        number whitelists) using the list; all blocking.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Dependencies and whether they block archiving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dependencies"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /number-lists/{id}/archive:
    post:
      tags: [switch]
      operationId: archiveNumberList
      summary: "Archive (delete) a number list (§13.29)"
      description: |
        Blocked while rules use it (409) unless an administrator overrides with a reason. One undoable change.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveRequest"
      responses:
        "200":
          description: Archived, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberListSaved"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Blocked by dependencies that must be settled first
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ArchiveBlocked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /number-lists/{id}/restore:
    post:
      tags: [switch]
      operationId: restoreNumberList
      summary: "Restore an archived number list (§13.29)"
      description: |
        Administrators; one undoable change.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Restored, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberListSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /number-list-entries/query:
    post:
      tags: [switch]
      operationId: queryNumberListEntries
      summary: "List the entries of a number list (server-side filter, sort and paging)"
      description: |
        The `numberListId` filter (eq) is required (§12.4 Number List entries: Number, Created By, Created Time).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: One page of entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberListEntryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /number-lists/{id}/entries:
    post:
      tags: [switch]
      operationId: addNumberListEntries
      summary: "Add entries to a number list"
      description: |
        Values are checked against the list type; values already in the list are skipped and counted.
        One undoable change.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NumberListEntriesInput"
      responses:
        "200":
          description: What was added, with the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberListEntriesResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /number-lists/{id}/entries/delete:
    post:
      tags: [switch]
      operationId: deleteNumberListEntries
      summary: "Delete entries of a number list"
      description: |
        Archives the entries as one undoable change.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdList"
      responses:
        "200":
          description: The change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /number-lists/{id}/import:
    post:
      tags: [switch]
      operationId: importNumberListEntries
      summary: "Import entries from a file (dry run first)"
      description: |
        "Import List" (§6.4): one value per line, or a CSV with a `value` (or `number`) column. In
        `replace` mode entries missing from the file are removed. All or nothing; one undoable change.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "200":
          description: What the import adds and removes; `applied` says whether it was saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /number-lists/{id}/export:
    get:
      tags: [switch]
      operationId: exportNumberListEntries
      summary: "Export a number list's entries as CSV"
      description: |
        Column `value`; the file can be imported again.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: CSV file, UTF-8, header row
          content:
            text/csv:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /translation-rules/query:
    post:
      tags: [switch]
      operationId: queryTranslationRules
      summary: "List translation rules (server-side filter, sort and paging)"
      description: |
        Translation Rule grid (§6.4) with what each rule applies to and how many trunks it touches (§13.2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: One page of translation rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslationRulePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /translation-rules:
