      type: object
      required: [command, lines, exitCode, durationMs]
      properties:
        command:
          type: string
          description: "The command line run."
        lines:
          type: array
          items:
            type: string
        exitCode:
          type: integer
        durationMs:
          type: integer

    # ------------------------------------------------------------- Route rules (§6.3, §13.8–13.11, §13.24, §13.27, §15.4)
    TrafficWindow:
      type: string
      enum: [15m, 1h, 24h, 7d, 30d]
      description: Time frame for traffic figures (§13.27).

    CompareOp:
      type: string
      enum: [">", ">=", "=", "<=", "<", between]

    MatchMode:
      type: string
      enum: [all, inclusive, exclusive]
      description: All, only the listed ones (inclusive) or all but them (exclusive).

    TpsCondition:
      type: object
      description: Live TPS condition (§13.8).
      required: [op, value, scope]
      additionalProperties: false
      properties:
        op:
          $ref: "#/components/schemas/CompareOp"
        value:
          type: number
          minimum: 0
        value2:
          type: [number, "null"]
          description: Upper bound for between.
        tolerancePct:
          type: number
          minimum: 0
          maximum: 50
          description: "± margin for =, default 5 %."
        scope:
          type: string
          enum: [customer_trunk, customer_enterprise, destination, sender_id, rule]
        windowS:
          type: integer
          enum: [1, 5, 10, 60]
        holdS:
          type: integer
          minimum: 0
          maximum: 3600
          description: Must stay past the value this long before switching (hysteresis).
        releasePct:
          type: number
          minimum: 0
          maximum: 100
          description: Back past the value by this % before switching back.

    RevenueCondition:
      type: object
      description: Revenue condition (§13.9), platform currency.
      required: [type, op, value]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [per_message, accumulated]
        op:
          $ref: "#/components/schemas/CompareOp"
        value:
          type: number
          minimum: 0
        value2:
          type: [number, "null"]
        scope:
          type: string
          enum: [customer_trunk, customer_enterprise, destination, sender_id, rule]
          description: Accumulated only.
        period:
          type: string
          enum: [15m, 60m, today, week, month, billing_cycle]
          description: Accumulated only.
        minMargin:
          type: [number, "null"]
          description: Also require at least this margin for the chosen vendor.
        minMarginUnit:
          type: string
          enum: [amount, percent]

    HlrAction:
      type: object
      description: Do HLR with a policy for the chosen customer trunks of the rule (§13.24); empty list = all of them. Wins over the trunk's HLR rules for that traffic.
      required: [policyId, customerTrunkIds]
      additionalProperties: false
      properties:
        policyId:
          $ref: "#/components/schemas/Id"
        customerTrunkIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"

    RouteVendor:
      type: object
      description: One vendor on a route level (§6.3) with an optional warm-up threshold (§13.27).
      required: [level, vendorTrunkId]
      additionalProperties: false
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 10
        vendorTrunkId:
          $ref: "#/components/schemas/Id"
        sharePct:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: Percentage hunt policy; shares of a level add up to 100.
        isBackup:
          type: boolean
        warmupCount:
          type: [integer, "null"]
          minimum: 1
          description: Send the first N messages to this vendor before the normal split.
        warmupReset:
          type: [string, "null"]
          enum: [hour, day, week, null]
        warmupPer:
          type: [string, "null"]
          enum: [rule, customer_trunk, null]

    RouteWhitelist:
      type: object
      description: Numbers pinned to one vendor of the rule (§13.27); checked before warm-up and split.
      required: [vendorTrunkId, numbers]
      additionalProperties: false
      properties:
        vendorTrunkId:
          $ref: "#/components/schemas/Id"
        numberListId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        numbers:
          type: array
          maxItems: 10000
          items:
            type: string
            pattern: "^[0-9]{5,15}$"

    RouteRuleFields:
      type: object
      description: Shared fields of the route rule form and record (§6.3 General Information and Route Information).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        priority:
          type: integer
          minimum: 1
          maximum: 100
          description: Evaluation order, low first.
        status:
          $ref: "#/components/schemas/RecordStatus"
        startsAt:
          $ref: "#/components/schemas/Timestamp"
        stopsAt:
          $ref: "#/components/schemas/Timestamp"
        groupId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        nextGroupId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        continueRouting:
          type: string
          enum: ["yes", stop, next]
          description: YES keeps evaluating, STOP ends, NEXT jumps to the next group.
        matchMode:
          type: string
          enum: [all, any]
          description: All conditions must match, or any one.
        comment:
          type: [string, "null"]
          maxLength: 1000
        categoryMode:
          $ref: "#/components/schemas/MatchMode"
        categoryIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        customerTrunkMode:
          $ref: "#/components/schemas/MatchMode"
        customerTrunkIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        mccmncMode:
          $ref: "#/components/schemas/MatchMode"
        mccmncs:
          type: array
          description: Codes; a 3-digit code is the whole country (§13.21).
          items:
            type: string
