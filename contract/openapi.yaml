        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteSimulatorInput"
      responses:
        "200":
          description: What would happen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteSimulatorResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /network-diagnosis:
    post:
      tags: [observation]
      operationId: runNetworkDiagnosis
      summary: "Network Diagnosis: ping, trace route, MTR, telnet from the switch host (§9.2)"
      description: |
        Count, Destination, Source, Port (telnet). Output as the tool prints it. The mock answers with simulated output
