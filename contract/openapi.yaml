    post:
      tags: [observation]
      operationId: startSignalingCapture
      summary: "Start a capture (Signaling Deck)"
      description: |
        Filter (IP address or range), Max Duration (s), Max File Size (bytes). The capture stops at whichever limit comes
        first, or on Stop. At most 3 captures run at a time (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignalingCaptureInput"
      responses:
        "201":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalingCaptureRow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /signaling-captures/{id}/stop:
    post:
      tags: [observation]
      operationId: stopSignalingCapture
      summary: "Stop a running capture"
      description: |
        The file keeps what was captured.
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalingCaptureRow"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /signaling-captures/{id}/file:
    get:
      tags: [observation]
      operationId: downloadSignalingCapture
      summary: "Download the trace (pcap)"
      description: |
        libpcap file with the SMPP packets (opens in Wireshark).
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: The pcap file
          content:
            application/vnd.tcpdump.pcap:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

