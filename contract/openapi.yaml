          type: string
          description: The country's calling code ("Country Code" in §6.1).
        updatedBy:
          type: [string, "null"]
          description: Username of the last change; null for seeded records.
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        archivedAt:
          type: [string, "null"]
          format: date-time
          description: Set when deleted (archived, §13.29).

        id:
          $ref: "#/components/schemas/Id"
        mccmnc:
          type: string
        mcc:
          type: string
        mnc:
          type: string
        country:
          type: string
        countryIso:
          type: string
        network:
          type: string
        allNetworks:
          type: boolean
        dlrTargetPct:
          type: [number, "null"]
          description: |
            DLR target for route rules sending here (decided 2026-10-16). A country-level code
            covers its networks unless a network has its own; null = no target.

    DlrTargetInput:
      type: object
      additionalProperties: false
      required: [targetPct]
      properties:
        targetPct:
          type: [number, "null"]
          minimum: 0
          maximum: 100
          description: Null removes the target.

