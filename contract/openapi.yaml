    TrafficAlertFields:
      type: object
      required: [name, sampleCount, sampleMinutes, asrThreshold, dlrThreshold, marginThreshold, customerTrunkId, vendorTrunkId, senderId, mccmnc, delayThreshold, notificationEmails, contactEmail, templateId, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        sampleCount:
          type: integer
          minimum: 1
          description: Sample Count (≥) - at least this many messages in the interval before the alert judges.
        sampleMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: Sample Interval (minutes).
        asrThreshold:
          type: number
          minimum: 0
          maximum: 100
          description: ASR Threshold (≤), percent.
        dlrThreshold:
          type: number
          minimum: 0
          maximum: 100
          description: DLR Threshold (≤), percent.
        marginThreshold:
          type: number
          minimum: -100
          maximum: 100
          description: MRG Threshold (≤), margin percent.
        customerTrunkId:
          $ref: "#/components/schemas/Id"
        vendorTrunkId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        senderId:
          type: [string, "null"]
          maxLength: 32
        mccmnc:
          type: [string, "null"]
          pattern: "^[0-9]{5,6}$"
        delayThreshold:
          type: [number, "null"]
          minimum: 0
          description: Average Delivery Delay (s ≥); null = not checked.
        notificationEmails:
          type: array
          maxItems: 20
          items:
            type: string
            format: email
        contactEmail:
          type: string
          enum: [none, commercial, technical, rates, finance]
          description: Enterprise Contact Email - also e-mail this contact of the customer.
        templateId:
          $ref: "#/components/schemas/Id"
        status:
          type: string
          enum: [active, inactive]

