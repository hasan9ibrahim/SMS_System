              name:
                type: string
              enterpriseName:
                type: string
              via:
                type: string
                enum: [trunk, enterprise, category, all]
              enabled:
                type: boolean
                description: False when the rule is switched off on this trunk.

    TranslationCloneInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        targetTrunk:
          type: object
          additionalProperties: false
