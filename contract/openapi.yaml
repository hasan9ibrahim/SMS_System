            customerTrunk:
              type: string
            enterprise:
              type: string
            vendorTrunk:
              type: [string, "null"]
            template:
              type: [string, "null"]
            state:
              type: string
              enum: [ok, firing, too_few, unknown]
              description: Result of the last check; too_few = fewer messages than the sample count.
            lastCheckedAt:
              type: [string, "null"]
              format: date-time
            lastTriggeredAt:
              type: [string, "null"]
              format: date-time
            lastValues:
              oneOf:
                - $ref: "#/components/schemas/TrafficAlertValues"
                - type: "null"
            updatedBy:
              type: [string, "null"]
            updatedAt:
              $ref: "#/components/schemas/Timestamp"
            archivedAt:
              type: [string, "null"]
              format: date-time

