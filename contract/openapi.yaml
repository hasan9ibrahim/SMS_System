          minimum: 0
          maximum: 20
        senderMaxLength:
          type: integer
          minimum: 1
          maximum: 20
        receiverMinLength:
          type: integer
          minimum: 0
          maximum: 20
        receiverMaxLength:
          type: integer
          minimum: 1
          maximum: 20
        startsAt:
          type: [string, "null"]
          format: date-time
        stopsAt:
          type: [string, "null"]
          format: date-time
        insertAt:
          type: string
          enum: [top, bottom]
          description: Where the rule runs on trunks that have no position for it.

